version: "1.0"
dispatch_board_repo: "flytonewyork/harness"
dispatch_board_issue: 70
repos:
  - "flytonewyork/harness"
  - "flytonewyork/loopbench"

rules:
  max_branch_age_hours: 24
  require_draft_pr_on_first_commit: true
  default_lookback_days: 7
  require_scripts_check_before_pr: true

# Exclusive module write lanes. Only ONE active agent may hold a lane at a time.
# Cross-lane edits require a recorded handoff or convergence Work Order on Issue #70.
lanes:
  lane-a-safety-gateway:
    description: "Deterministic safety kernel, ModelGateway, triage, companion, FHIR/PDPO security, protocols & SRE"
    paths:
      - "backend/safety/**"
      - "backend/gateway/**"
      - "backend/acute/triage.py"
      - "backend/acute/companion.py"
      - "backend/acute/security.py"
      - "backend/acute/observability.py"
      - "backend/acute/rx_rules.py"
      - "backend/acute/certificates.py"
      - "backend/acute/terminology.py"
      - "backend/acute/verification.py"
      - "backend/sre/**"
      - "protocols/**"

  lane-b-agentic-graph:
    description: "Agentic runtime, skills/prompts/memory, practice knowledge graph, pathway runner, curator & clinic packs"
    paths:
      - "backend/agentic/**"
      - "backend/acute/agent_harness.py"
      - "backend/acute/agentic_runtime.py"
      - "backend/acute/practice_graph.py"
      - "backend/acute/pathway_runner.py"
      - "backend/acute/curator.py"
      - "backend/acute/workflows.py"
      - "backend/acute/scheduling.py"
      - "backend/knowledge/**"
      - "packs/**"
      - "knowledge/**"
      - "skills/**"

  lane-c-mcp-integrations:
    description: "Permission Gate, MCP Clinic EMR server/client, EMR connectors, external adapters & vault"
    paths:
      - "backend/mcp/**"
      - "backend/acute/emr_connector.py"
      - "backend/acute/adapters.py"
      - "backend/acute/contracts.py"
      - "backend/acute/legacy_feed.py"
      - "backend/vault/**"

  lane-d-workspace-ui:
    description: "Frontend apps (/workspace, /emr, /c, /p, /ec), workspace engine, live demo flows & live bus"
    paths:
      - "frontend/**"
      - "backend/acute/workspace_engine.py"
      - "backend/acute/live_demo*.py"
      - "backend/acute/live_journeys*.py"
      - "backend/acute/live_bus.py"
      - "demo/**"

  lane-e-evals-loopbench:
    description: "Turn-level eval suites, lookback runner, blind sets & LoopBench test bed"
    paths:
      - "evals/**"
      - "backend/lookback/**"
      - "backend/adapters/**"
      - "loopbench/**"

  lane-f-core-engine:
    description: "Core clinic loop engine, append-only CaseLog, extractors, plug-in journeys, precare & core API"
    paths:
      - "backend/engine/**"
      - "backend/case/**"
      - "backend/extract/**"
      - "backend/journeys/**"
      - "backend/precare/**"
      - "backend/api/**"

  lane-g-platform-em:
    description: "PM/EM tooling, CI workflows, deploy configs & architecture docs"
    paths:
      - "docs/em/**"
      - "scripts/agent_em.py"
      - "scripts/team_status.sh"
      - ".github/**"
      - "deploy/**"

  lane-h-clinical-ontology:
    description: "Declarative Primary Care Clinical Knowledge Ontology (Core + HK/AU/Clinic overlays, Murtagh PROMPT, LOINC/SNOMED GPS linter)"
    paths:
      - "backend/ontology/**"
      - "tests/test_ontology.py"

# Shared chokepoints: keep edits minimal/additive and always coordinate on Issue #70.
shared_chokepoints:
  - "backend/acute/app.py"
  - "backend/acute/db.py"
  - "backend/acute/seed.py"
  - "NOW.md"
  - "CLAUDE.md"
  - "pyproject.toml"

# Explicit 4-Agent Engineering Stream Roster.
# Invariant (tested in tests/test_agent_em.py): every lane above belongs to EXACTLY ONE stream.
streams:
  stream-1-trust-gate:
    role: "Trust, Safety, Gateway & Permission Gate Lead"
    owned_lanes:
      - "lane-a-safety-gateway"
      - "lane-c-mcp-integrations"
    chokepoint_role: "additive-only (app.py/db.py for MCP/FHIR/audit wiring)"
    provides_seams:
      - "backend.safety.kernel (screen_safety, check_outbound_safety)"
      - "backend.gateway.ModelGateway (residency, schemas, fencing, AgentRun audits)"
      - "backend.mcp.ClinicEMRMCPServer + SMART scopes + EMR/Labs/Pharmacy adapters"
    consumes_seams:
      - "backend.case.context (read-only)"
      - "backend.agentic.tools schema registry (read-only)"
    never_touches:
      - "backend/engine/**"
      - "backend/case/**"
      - "backend/journeys/**"
      - "backend/agentic/**"
      - "backend/ontology/**"
      - "frontend/**"
      - "evals/**"

  stream-2-core-evals:
    role: "Core Clinical Loop Engine & LoopBench Evals Lead"
    owned_lanes:
      - "lane-f-core-engine"
      - "lane-e-evals-loopbench"
    chokepoint_role: "none (pure engine, case log, lookback & evals)"
    provides_seams:
      - "backend.engine (ClinicPort, RulesHarness v1.0/v1.1, AgenticHarness, trace)"
      - "backend.case (CaseLog, CaseView, build_scrubbed_clinical_context)"
      - "backend.extract & backend.journeys + LoopBench/Turn Eval CI gates"
    consumes_seams:
      - "backend.gateway.ModelGateway public API (read-only — never edits gateway.py)"
    never_touches:
      - "backend/acute/**"
      - "backend/gateway/**"
      - "backend/mcp/**"
      - "backend/agentic/**"
      - "backend/ontology/**"
      - "frontend/**"

  stream-3-clinical-ai:
    role: "Clinical Intelligence, Ontology, Practice Graph & Forward-Deployment Packs Lead"
    owned_lanes:
      - "lane-b-agentic-graph"
      - "lane-h-clinical-ontology"
    chokepoint_role: "none (declarative ontology, packs, graph nodes & agentic runtime)"
    provides_seams:
      - "backend.ontology (Primary Care Clinical Knowledge Ontology, HK/AU/clinic overlays)"
      - "backend.agentic (GovernedAgentRunner, skills, prompts, memory, context)"
      - "backend.acute.{practice_graph,pathway_runner,curator,workflows,scheduling}"
      - "backend.knowledge & knowledge/<clinic_id>/ + packs/*.yaml + skills/clinical/*"
    consumes_seams:
      - "backend.safety.kernel & ModelGateway (read-only)"
      - "backend.mcp.InProcessMCPClient (read-only)"
    never_touches:
      - "backend/safety/**"
      - "backend/gateway/**"
      - "backend/mcp/**"
      - "backend/engine/**"
      - "frontend/**"

  stream-4-surfaces-em:
    role: "Product UX Surfaces, Live Demos & Platform/EM Integration Steward"
    owned_lanes:
      - "lane-d-workspace-ui"
      - "lane-g-platform-em"
    chokepoint_role: "Integration Steward (owns app.py router split WO #73, db.py coordination, NOW.md & CI)"
    provides_seams:
      - "frontend/** (/workspace, /emr, /c, /p, /ec) & live demo flows"
      - "backend/acute/routes/* (post-WO #73 modular FastAPI routers)"
      - "docs/em/*, scripts/agent_em.py, pr-overlap-guard.yml & Issue #70 governance"
    consumes_seams:
      - "All backend API & MCP contracts (read-only)"
    never_touches:
      - "backend/safety/**"
      - "backend/gateway/**"
      - "backend/engine/**"
      - "backend/case/**"
      - "backend/mcp/**"

