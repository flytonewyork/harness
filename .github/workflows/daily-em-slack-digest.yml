name: daily-em-slack-digest

on:
  schedule:
    # 01:00 UTC = 09:00 HKT daily
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print Slack Block Kit JSON without posting"
        required: false
        default: "false"
      since_hours:
        description: "Lookback window in hours for shipped PRs"
        required: false
        default: "24"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  daily-standup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Build and Post Daily Slack Standup Digest
        env:
          GH_TOKEN: ${{ secrets.REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          SINCE="${{ github.event.inputs.since_hours || '24' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/agent_em.py slack-digest --since-hours "$SINCE" --dry-run
          else
            python3 scripts/agent_em.py slack-digest --since-hours "$SINCE" --post
          fi
