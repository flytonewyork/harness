# Remote Cloud Build pipeline for Clinic AI Harness -> GCP Cloud Run (asia-east2 Hong Kong)
# Zero local Docker daemon required.
substitutions:
  _REGION: asia-east2
  _REPO: tmrw-harness
  _SERVICE: clinic-ai-harness-staging
  _CLOUDSQL_INSTANCE: ""
  _VAULT_BUCKET: ""
  _DATABASE_URL: ""
  _VERTEX_MODEL: gemini-2.5-flash

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/acute.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=HARNESS_ENV=staging,HARNESS_REGION=${_REGION},GCP_PROJECT_ID=${PROJECT_ID},VERTEX_REGION=${_REGION},VERTEX_MODEL=${_VERTEX_MODEL},VAULT_GCS_BUCKET=${_VAULT_BUCKET},DEMO_MODE=true,DEMO_SHOW_OTP=true
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
