  - {text: "only 2 tablets left of my bisoprolol", classes: [beta_blocker], kinds: [repeat]}
  - {text: "could you send another script for my cholesterol meds", classes: [statin], kinds: [repeat]}
  - {text: "Feeling great, no issues with the new meds", quiet: true}
  - {text: "冇事，一切正常", quiet: true}
  - {text: "No rash or itching anymore, thanks!", quiet: true}
  - {text: "My son had a fever but he's fine now", quiet: true}
  - {text: "Appointment on Tuesday is fine for me", quiet: true}
