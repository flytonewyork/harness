high_risk_classes: [anticoagulant, insulin, sulfonylurea, ssri, xanthine_oxidase, opioid, benzodiazepine, z_drug]
controlled_classes: [benzodiazepine, z_drug, opioid]
short_course_classes: [antibiotic]
no_gap_classes: [anticoagulant, insulin, thyroid, beta_blocker]

# Conservative baseline repeat-prescription monitoring rules (flag, never block).
# Clinic packs may tighten intervals freely; loosening requires explicit clinician signature.
monitoring_defaults:
  metformin:
    tests: [eGFR, Creatinine]
    max_days: 365
  acei:
    tests: [Creatinine, Potassium, eGFR]
    max_days: 365
  arb:
    tests: [Creatinine, Potassium, eGFR]
    max_days: 365
  diuretic:
    tests: [Sodium, Potassium, Creatinine]
    max_days: 365
  sglt2:
    tests: [eGFR, Creatinine]
    max_days: 365
  anticoagulant:
    tests: [INR]
    max_days: 42
  thyroid:
    tests: [TSH]
    max_days: 365
  statin:
    tests: [LDL cholesterol, ALT]
    max_days: 450

doac_renal_monitoring:
  tests: [Creatinine, eGFR]
  max_days: 365

review_days: 365

# Local clinician shorthand beyond RV n/52 (empty in default so Task.fingerprint() is 1:1 unchanged)
shorthand_glossary: {}

# Baseline insurer paperwork patterns matching backend/journeys/insurance/__init__.py
insurer_patterns:
  ask:
    - "(?i)please (return|provide|complete|send|furnish|forward|fax|reply|submit|let us have)"
    - "(?i)kindly (complete|return|provide|send)"
    - "(?i)we would be grateful if you could"
    - "(?i)we request"
    - "(?i)may (be )?resubmit"
    - "(?i)is (still )?outstanding"
    - "請於"
    - "請提供"
    - "請填"
    - "請將"
    - "煩請"
  not_ask:
    - "(?i)should any further information be required"
    - "(?i)no further information is required"
    - "(?i)for your (information|records) only"
  consent:
    - "(?i)consent|authori[sz]ation|授權|同意書"
  consent_missing:
    - "(?i)not enclosed|not attached|to follow|forwarded separately|will be (sent|forwarded|provided)|missing|未(有)?附|稍後"
  consent_given:
    - "(?i)enclose|attached|herewith|附上|已附"
