[project]
name = "tmrw-harness"
version = "0.1.0"
description = "tmrw follow-up harness: engine, free-text extractor, Phase 0 look-back and API"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pyyaml"]
acute = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "cryptography>=43.0",
  "pyjwt>=2.9",
  "fpdf2>=2.8",
  "python-multipart",
  "google-auth>=2.35",
  "requests>=2.32",
  "google-cloud-storage>=2.18",
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
