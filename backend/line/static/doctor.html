<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your care line</title>
<style>
  :root { --ink:#16201c; --soft:#5b6b64; --line:#dfe6e2; --accent:#0f7b5f; --warn:#b4541a; --bg:#f4f6f5; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", "PingFang HK", "Noto Sans HK", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:180px; }
  header a, button { font:inherit; }
  main { max-width:860px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  section h2 { font-size:15px; margin:0 0 10px; color:var(--soft); text-transform:uppercase; letter-spacing:.04em; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--soft); font-size:13px; }
  .item { border-top:1px solid var(--line); padding:12px 0; } .item:first-of-type { border-top:none; padding-top:0; }
  .meta { color:var(--soft); font-size:13px; } .late { color:var(--warn); font-weight:600; }
  .quote { margin:6px 0; white-space:pre-wrap; }
  .draft { background:#f1f7f4; border-radius:8px; padding:8px 10px; white-space:pre-wrap; font-size:14px; margin:6px 0; }
  textarea { width:100%; min-height:64px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pill { font-size:12px; border-radius:999px; padding:2px 8px; background:#eef2f0; color:var(--soft); }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:6px 4px; border-top:1px solid var(--line); }
  .thread { max-height:420px; overflow:auto; display:grid; gap:6px; }
  .bubble { padding:8px 10px; border-radius:10px; white-space:pre-wrap; font-size:14px; max-width:92%; }
  .in { background:#fff; border:1px solid var(--line); } .out { background:#e6f3ee; justify-self:end; }
  .empty { color:var(--soft); }
  input[type=number] { width:90px; font:inherit; padding:4px 6px; }
  #err { color:var(--warn); padding:16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Your care line</h1>
  <a id="qr" href="#" target="_blank">QR card</a>
  <a id="payouts" href="#">Payouts</a>
</header>
<div id="err" hidden></div>
<main id="app">
  <section><h2>This month</h2><div class="stats" id="stats"></div></section>
  <section><h2>Waiting for you</h2><div id="queue"></div></section>
  <section><h2>Patients</h2><div id="patients"></div></section>
  <section id="detail" hidden><h2 id="dname">Patient</h2><div id="dbody"></div></section>
  <section><h2>Fees</h2><div id="fees"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { $("app").hidden = true; $("err").hidden = false; $("err").textContent = "Signed out. Send WEB to your care line on WhatsApp for a new sign-in link."; throw new Error("401"); }
  if (!r.ok) throw new Error(await r.text());
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });

function when(iso) { const t = new Date(iso); return t.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

async function load() {
  S = await api("/api/doctor/state");
  const d = S.doctor, m = S.money, st = S.stats;
  $("title").textContent = `${d.name_en}'s care line` + (d.paused_until ? ` · paused until ${d.paused_until}` : "");
  $("qr").href = S.qr;
  $("payouts").hidden = !S.payments_on;
  $("stats").innerHTML = [
    [st.joined, "patients joined"], [st.with_plan, "have a written plan"], [st.open, "waiting for you"],
    [`HK$${m.earned_hkd}`, `earned from ${m.paid_count} paid follow-up(s)`],
    [`${S.membership.members} / ${S.membership.offered}`, `members / offered membership (HK$${S.membership.monthly_hkd} a month to you)`],
    [m.subscription_hkd ? `HK$${m.subscription_hkd}` : "HK$0", m.subscription_hkd ? "subscription" : `subscription during the pilot (would be HK$${m.shadow_subscription_hkd})`],
  ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");

  const now = new Date();
  const q = S.drafts.map((x) => `<div class="item"><div><b>${esc(x.patient_name)}</b> <span class="pill">${x.job === "plan" ? "plan draft" : "reply draft"}</span></div>
      <div class="draft">${esc(x.text)}</div>
      <div class="row"><button class="primary" onclick="plan('${x.id}','send')">Send</button><button onclick="plan('${x.id}','skip')">Skip</button></div></div>`)
    .concat(S.queue.map((h) => `<div class="item"><div><b>${esc(h.patient_name)}</b> <span class="pill">${esc(h.kind.replace("_", " "))}</span>
        <span class="meta ${new Date(h.reply_by) < now ? "late" : ""}">reply by ${esc(when(h.reply_by))}</span>${h.calling ? ' <span class="pill">you said you\'d call</span>' : ""}</div>
      <div class="quote">“${esc(h.quote)}”</div>
      ${h.draft ? `<div class="draft">Draft: ${esc(h.draft)}</div>` : ""}
      ${h.media_ref ? `<div><a href="/api/doctor/media/${esc(h.media_ref)}" target="_blank">Open the report / voice note</a></div>` : ""}
      ${h.kind === "repeat" ? `<div class="row"><button class="primary" onclick="act('${h.id}','ok')">Approve${S.payments_on ? " (patient pays)" : ""}</button><button onclick="act('${h.id}','visit')">Needs a visit</button><button onclick="act('${h.id}','no')">Decline</button></div>`
        : `<textarea id="r-${h.id}" placeholder="Your reply, sent exactly as you write it"></textarea>
           <div class="row">${h.draft ? `<button class="primary" onclick="act('${h.id}','send_draft')">Send draft</button>` : ""}<button class="primary" onclick="reply('${h.id}')">Send my reply</button><button onclick="act('${h.id}','done')">Done (no reply needed)</button>
           <a class="meta" href="tel:+${esc(h.patient_wa)}">Call +${esc(h.patient_wa)}</a></div>`}
    </div>`));
  $("queue").innerHTML = q.length ? q.join("") : `<p class="empty">Nothing waiting.</p>`;

  $("patients").innerHTML = S.patients.length ? `<table><tr><th>Name</th><th>Born</th><th>Joined</th><th></th></tr>` +
    S.patients.map((p) => `<tr><td>${esc(p.name)}${p.state === "stopped" ? ' <span class="pill">stopped</span>' : ""}${p.member ? ' <span class="pill">member</span>' : ""}</td><td>${esc((p.dob || "").slice(0, 4))}</td>
      <td>${esc((p.joined_at || "").slice(0, 10))}</td><td><button onclick="open_('${p.id}')">Open</button>
      ${!p.member && !p.membership_offered && d.membership_hkd && p.state !== "stopped" ? `<button onclick="offer('${p.id}')">Offer membership</button>` : ""}</td></tr>`).join("") + `</table>`
    : `<p class="empty">No patients yet. Show your <a href="${esc(S.qr)}" target="_blank">QR card</a> at the end of a consult.</p>`;

  $("fees").innerHTML = `<div class="row">Repeat prescription HK$<input type=number id="f-repeat" value="${d.fees?.repeat ?? 0}" min=0>
     Result review HK$<input type=number id="f-result" value="${d.fees?.result ?? 0}" min=0>
     Membership HK$<input type=number id="f-member" value="${d.membership_hkd ?? 0}" min=0> a month (0 = off)
     <button onclick="saveFees()">Save</button></div>
     <p class="meta">QR cards, one per clinic: ${S.qrs.map((q) => `<a href="${esc(q.url)}" target="_blank">${esc(q.name || "card")}</a>`).join(" · ")}</p>
     <p class="meta">Patients also pay a HK$30 tmrw service fee on each paid follow-up, and ${S.membership.fee_pct}% on a membership, shown on its own line. Members get repeats and result reviews with no per-item charge. You offer membership one patient at a time, once. Your fee goes to your own Stripe account in full. Replies: ${esc(S.hours_text)}.</p>`;
}

async function open_(pid) {
  const r = await api(`/api/doctor/patient/${pid}`);
  $("detail").hidden = false;
  $("dname").textContent = `${r.patient.name} (b. ${r.patient.dob})`;
  const reports = (r.patient.reports || []).map((x) => `<a href="/api/doctor/media/${esc(x.ref)}" target="_blank">report ${esc(x.at.slice(0, 10))}</a>`).join(" · ");
  $("dbody").innerHTML = `<p class="meta">Joined ${esc(r.patient.joined_at)} · consent ${esc(r.patient.consent?.at)} · language ${esc(r.patient.lang)} ·
     <a href="/api/doctor/export/${pid}" target="_blank">Export record</a>${reports ? " · " + reports : ""}</p>
     <div class="thread">${r.messages.map((m) => `<div class="bubble ${m.dir}"><span class="meta">${esc(m.at.replace("T", " "))}${m.dir === "out" ? " · " + esc(m.kind) : ""}</span>\n${esc(m.text || "[" + m.kind + "]")}</div>`).join("")}</div>`;
  $("detail").scrollIntoView({ behavior: "smooth" });
}
async function plan(id, what) { await post(`/api/doctor/plan/${id}/${what}`); load(); }
async function act(id, what) { await post(`/api/doctor/handoff/${id}/${what}`); load(); }
async function reply(id) { const t = $("r-" + id).value.trim(); if (!t) return; await post(`/api/doctor/handoff/${id}/reply`, { text: t }); load(); }
async function saveFees() { await post("/api/doctor/settings", { fees: { repeat: +$("f-repeat").value, result: +$("f-result").value }, membership_hkd: +$("f-member").value }); load(); }
async function offer(pid) { const r = await post(`/api/doctor/patient/${pid}/offer`); alert(r.note.replace(/^tmrw · /, "")); load(); }
$("payouts").onclick = async (e) => { e.preventDefault(); const r = await api("/api/doctor/payouts"); if (r.url) location.href = r.url; };

load().then(() => { const m = location.hash.match(/patient=(\w+)/); if (m) open_(m[1]); }).catch(() => {});
setInterval(() => load().catch(() => {}), 30000);
</script>
</body>
</html>
