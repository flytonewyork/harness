        question: { en: "Do you have any swelling of your lips, tongue, or throat, trouble breathing, hoarseness, or dizziness?", zh_hk: "請問你有沒有嘴唇、舌頭或喉嚨腫脹、呼吸困難、聲沙或頭暈？" }
        urgency_if_present: 4
