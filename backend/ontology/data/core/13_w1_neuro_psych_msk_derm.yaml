        - { id: p_zoster, concept_id: cond:herpes_zoster, key_discriminators: ["unilateral dermatomal painful vesicles"] }
        - { id: p_cellulitis, concept_id: cond:cellulitis, key_discriminators: ["spreading warm tender erythema", "unilateral limb"] }
      serious_not_to_be_missed:
        - { id: s_anaphylaxis, concept_id: cond:anaphylaxis, key_discriminators: ["acute urticaria + lip/throat swelling, wheeze, or hypotension"] }
