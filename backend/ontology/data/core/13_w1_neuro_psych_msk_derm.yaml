    murtagh_prompt:
      probability_diagnoses:
        - { id: p_bppv, concept_id: cond:bppv, key_discriminators: ["brief <60s spinning triggered by rolling in bed/looking up", "Dix-Hallpike+"] }
        - { id: p_drugs, concept_id: cond:drug_adverse_effect, key_discriminators: ["orthostatic hypotension from antihypertensives/sedatives"] }
        - { id: p_anxiety, concept_id: cond:gad, key_discriminators: ["non-rotational lightheadedness/hyperventilation"] }
      serious_not_to_be_missed:
        - { id: s_stroke, concept_id: cond:stroke_tia, key_discriminators: ["posterior circulation stroke — HINTS central signs, truncal ataxia, diplopia/dysarthria"] }
        - { id: s_acs, concept_id: cond:acs, key_discriminators: ["presyncope / arrhythmia / silent ischaemia"] }
        - { id: s_anaemia, concept_id: cond:anaemia, key_discriminators: ["orthostatic dizziness + pallor / occult GI bleed"] }
      pitfalls_often_missed:
        - { id: o_migraine, concept_id: cond:migraine, key_discriminators: ["vestibular migraine (vertigo +/- headache)"] }
        - { id: o_hypoglycaemia, concept_id: cond:t2dm, key_discriminators: ["sulfonylurea/insulin hypoglycaemia"] }
      masquerades:
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check lying/standing BP and review antihypertensives, diuretics, and sedatives." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:anaemia, clue_prompt: { en: "Check Hb and screen for occult GI blood loss if presyncopal." } }
        - { id: mq_neuro, tier: secondary, masquerade: neurological_dilemma, concept_id: cond:neurological_dilemma, clue_prompt: { en: "Perform targeted cerebellar, cranial nerve, and gait exam to exclude central vertigo." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of stroke, recent falls at home, and driving safety concerns." }
    positive_exclusions:
      - id: ex_focal_neuro
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Do you have double vision, slurred speech, difficulty swallowing, limb weakness/numbness, or inability to walk unaided?", zh_hk: "請問你有否出現重影、口齒不清、吞嚥困難、手腳無力麻痺或完全無法自行站立行走？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_syncope
        finding_concept_id: rf:syncope
        question: { en: "Have you actually fainted, blacked out, or collapsed?", zh_hk: "請問你有沒有真正暈倒、短暫失去知覺或休克？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_chest_pain
        finding_concept_id: rf:chest_pain_cardiac
        question: { en: "Are you having any chest pain, palpitations, or shortness of breath?", zh_hk: "請問你有沒有伴隨胸痛、心悸或氣促？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_dizziness_emergency
        trigger_condition: { en: "New weakness, slurred speech, double vision, severe headache, fainting, chest pain, or inability to walk", zh_hk: "新出現肢體無力、口齒不清、重影、劇烈頭痛、暈倒、胸痛或無法行走" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Do not drive while dizzy. Seek immediate emergency care if you develop slurred speech, double vision, weakness, severe headache, chest pain, fainting, or cannot walk safely."
          zh_hk: "頭暈期間請勿駕駛。如出現口齒不清、重影、肢體無力、劇烈頭痛、胸痛、暈倒或無法安全站立行走，請立即尋求緊急醫療協助。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:low_back_pain
    rfe_concept_id: rfe:low_back_pain
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_mechanical, concept_id: cond:spinal_dysfunction, prevalence_note: "Non-specific mechanical LBP (~85-90%)" }
        - { id: p_oa, concept_id: cond:osteoarthritis, key_discriminators: ["lumbar facet OA / spinal stenosis in older adults"] }
      serious_not_to_be_missed:
        - { id: s_cauda, concept_id: cond:cauda_equina, key_discriminators: ["saddle numbness", "urinary retention/incontinence", "bilateral leg weakness"] }
        - { id: s_malignancy, concept_id: cond:malignancy_occult, key_discriminators: ["history of cancer", "unexplained weight loss", "relentless night pain"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["spinal epidural abscess / discitis — fever, IVDU, immunocompromised"] }
        - { id: s_dissection, concept_id: cond:aortic_dissection, key_discriminators: ["sudden tearing back pain / ruptured AAA in older smoker"] }
      pitfalls_often_missed:
        - { id: o_osteoporotic_fx, concept_id: cond:osteoporosis, key_discriminators: ["vertebral fragility fracture in older adult or chronic steroid user"] }
        - { id: o_zoster, concept_id: cond:herpes_zoster, key_discriminators: ["pre-eruptive dermatomal burning pain before vesicles appear"] }
      masquerades:
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Screen red flags: prior cancer, age >50 new onset, unexplained weight loss, night pain." } }
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Assess yellow flags (fear-avoidance, mood, workplace distress) for chronic LBP risk." } }
        - { id: mq_uti, tier: primary, masquerade: uti, concept_id: cond:uti, clue_prompt: { en: "Consider pyelonephritis / renal colic when flank pain accompanies fever or dysuria." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore expectations for MRI/X-ray (avoid routine imaging in uncomplicated LBP), work capacity, and fear of paralysis." }
    positive_exclusions:
      - id: ex_cauda_equina
        finding_concept_id: rf:cauda_equina_signs
        question: { en: "Have you noticed numbness around your groin/buttocks, difficulty passing urine, loss of bladder or bowel control, or weakness in both legs?", zh_hk: "請問你有否感到會陰或臀部麻痺、排尿困難、大小便失禁或雙腳無力？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_weight_loss
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you had unexplained weight loss, fever, night sweats, or a history of cancer?", zh_hk: "請問你有沒有無故體重下降、發燒、夜間盜汗或癌症病史？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_syncope_vascular
        finding_concept_id: rf:syncope
        question: { en: "Did the pain start suddenly and severely with feeling faint, sweating, or abdominal pain?", zh_hk: "請問腰痛是否突然劇烈發作，並伴隨頭暈欲暈、冒冷汗或腹痛？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_lbp_cauda_emergency
        trigger_condition: { en: "Groin/saddle numbness, inability to pass urine, loss of bladder/bowel control, or new leg weakness", zh_hk: "會陰麻痺、無法排尿、大小便失禁或新出現下肢無力" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Go to an emergency department immediately if you develop numbness around the groin/buttocks, difficulty passing urine, loss of bladder or bowel control, or progressive leg weakness."
          zh_hk: "如出現會陰／臀部麻痺、排尿困難、大小便失禁或下肢無力加劇，請立即前往急症室作緊急評估。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:joint_pain
    rfe_concept_id: rfe:joint_pain
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_oa, concept_id: cond:osteoarthritis, key_discriminators: ["activity-related pain", "brief <30 min morning stiffness", "crepitus"] }
        - { id: p_gout, concept_id: cond:gout, key_discriminators: ["abrupt severe nocturnal monoarthritis (1st MTP/ankle/knee)", "erythema"] }
      serious_not_to_be_missed:
        - { id: s_septic, concept_id: cond:septic_arthritis, key_discriminators: ["hot swollen single joint", "fever", "markedly restricted passive ROM", "prosthetic joint"] }
        - { id: s_ra, concept_id: cond:rheumatoid_arthritis, key_discriminators: ["symmetrical small joint synovitis", "morning stiffness >60 min", "anti-CCP/RF"] }
        - { id: s_malignancy, concept_id: cond:malignancy_occult, key_discriminators: ["persistent bony/night pain", "systemic B-symptoms"] }
      pitfalls_often_missed:
        - { id: o_gca_pmr, concept_id: cond:gca, key_discriminators: ["bilateral shoulder/hip girdle stiffness >50y (PMR) — screen GCA symptoms"] }
