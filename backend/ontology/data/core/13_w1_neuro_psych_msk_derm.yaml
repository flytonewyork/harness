        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check recent anticholinergics/topiramate/sympathomimetics precipitating angle closure, or unmonitored steroid eye drops." } }
      patient_hidden_agenda_prompts:
