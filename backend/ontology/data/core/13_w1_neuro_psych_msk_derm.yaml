      masquerades:
        - { id: mq_ctd, tier: secondary, masquerade: connective_tissue, concept_id: cond:connective_tissue_disease, clue_prompt: { en: "Screen symmetrical synovitis, rash, oral ulcers, Raynaud's, or inflammatory markers." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check thiazides/diuretics triggering gout, or statin myalgia (check CK)." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore functional impact on work/mobility, fear of long-term disability, and self-medication with OTC NSAIDs or TCM." }
    positive_exclusions:
      - id: ex_hot_joint
        finding_concept_id: rf:hot_swollen_single_joint
        question: { en: "Is a single joint very hot, red, and swollen, or are you unable to move it or put weight on it?", zh_hk: "請問是否有單一關節明顯發熱、紅腫劇痛，或完全無法屈伸／負重？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_weight_loss
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you had fevers, drenching night sweats, or unexplained weight loss?", zh_hk: "請問你有沒有同時發燒、夜間盜汗或無故體重下降？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_gca_screen
        finding_concept_id: rf:jaw_claudication_temporal_pain
        question: { en: "If you have shoulder/hip stiffness, have you also had temple headaches, jaw pain when chewing, or visual changes?", zh_hk: "如有肩頸或髖部僵硬，請問有否伴隨太陽穴頭痛、咀嚼下顎痛或視力變化？" }
        urgency_if_present: 3
        mandatory: false
        when: { fact: age_years, op: ge, value: 50 }
    safety_netting:
      - id: sn_joint_septic_emergency
        trigger_condition: { en: "Rapidly worsening hot swollen joint, fever/chills, inability to bear weight, or prosthetic joint redness", zh_hk: "關節迅速發熱紅腫劇痛、發燒發冷、無法負重或人工關節部位紅腫" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek urgent emergency hospital assessment if a joint becomes hot, red, and severely swollen — especially if you develop a fever, feel unwell, or have an artificial joint."
          zh_hk: "如關節變得發熱、紅腫劇痛，特別是伴隨發燒、身體不適或該處為人工關節，請立即前往急症室作緊急評估。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:rash
