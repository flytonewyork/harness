      - id: ex_non_blanching
        finding_concept_id: rf:stiff_neck_meningism
        question: { en: "Do you have a fever with a purple/red rash that does not fade when pressed, or painful blisters in your mouth or eyes?", zh_hk: "請問你有沒有發燒並出現按壓不退色的紫紅斑，或口腔／眼部起痛性水泡？" }
