        urgency_if_present: 3
        mandatory: true
    safety_netting:
      - id: sn_rash_emergency
        trigger_condition: { en: "Lip/tongue/throat swelling, breathing trouble, non-blanching purple rash, mouth/eye blistering, or rapidly spreading painful redness with fever", zh_hk: "嘴唇／舌頭／喉嚨腫脹、呼吸困難、按壓不退色紫疹、口腔或眼部起水泡，或紅腫劇痛迅速擴散伴發燒" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency care if you develop lip, tongue, or throat swelling, breathing difficulty, a rash that does not fade when pressed, painful mouth/eye blisters, or rapidly spreading redness with fever."
          zh_hk: "如出現嘴唇、舌頭或喉嚨腫脹、呼吸困難、按壓不退色的皮疹、口腔或眼部起水泡，或紅腫伴發燒迅速擴散，請立即尋求緊急醫療協助。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

