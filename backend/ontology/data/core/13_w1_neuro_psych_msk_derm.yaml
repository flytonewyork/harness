        question: { en: "Do you have any blurred or reduced vision, severe eye pain, sensitivity to light, or rainbow haloes around lights?", zh_hk: "請問你有沒有視力模糊或下降、眼睛劇痛、畏光，或看燈光時見到彩虹光環？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_ophthalmic_zoster
        finding_concept_id: rf:ophthalmic_zoster_tip_nose
        question: { en: "Do you have any blistering rash on your forehead, eyelid, or tip of your nose?", zh_hk: "請問你的額頭、眼皮或鼻尖有沒有水泡皮疹？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_focal_diplopia
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Do you have double vision or pain when moving your eye?", zh_hk: "請問你有沒有看東西重影，或轉動眼球時感到疼痛？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_red_eye_emergency
        trigger_condition: { en: "Any decrease in vision, severe eye pain, sensitivity to light, haloes, chemical splash, or contact lens-associated eye pain", zh_hk: "視力下降、眼部劇痛、嚴重畏光、視物有光環、化學品濺眼或戴隱形眼鏡後眼痛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Remove contact lenses immediately and do not use leftover steroid eye drops. Seek immediate emergency eye care if you notice reduced vision, severe eye pain, light sensitivity, or haloes around lights."
          zh_hk: "請立即除下隱形眼鏡，切勿自行使用舊有的類固醇眼藥水。如出現視力下降、眼睛劇痛、嚴重畏光或見彩虹光環，請立即前往急症室作緊急眼科評估。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:anxiety_low_mood
    rfe_concept_id: rfe:anxiety_low_mood
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_gad, concept_id: cond:gad, key_discriminators: ["excessive uncontrollable worry >=6m", "GAD-7"] }
        - { id: p_dep, concept_id: cond:depression, key_discriminators: ["anhedonia", "persistent low mood >=2w", "PHQ-9"] }
        - { id: p_panic, concept_id: cond:panic_disorder, key_discriminators: ["abrupt surges of intense fear/palpitations/dyspnoea peaking within minutes"] }
      serious_not_to_be_missed:
        - { id: s_dep_suicide, concept_id: cond:depression, key_discriminators: ["active suicidal ideation, plan, or self-harm risk"] }
        - { id: s_acs, concept_id: cond:acs, key_discriminators: ["do not attribute acute chest pain/dyspnoea to panic without cardiac/PE exclusion"] }
        - { id: s_aud, concept_id: cond:alcohol_use_disorder, key_discriminators: ["alcohol withdrawal risk / co-occurring substance misuse"] }
      pitfalls_often_missed:
        - { id: o_thyroid, concept_id: cond:hypothyroidism, key_discriminators: ["thyroid dysfunction mimicking depression or anxiety"] }
        - { id: o_dementia, concept_id: cond:dementia, key_discriminators: ["new late-life anxiety/apathy or depressive pseudodementia"] }
      masquerades:
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Order TSH to exclude hyper- or hypothyroidism." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Screen alcohol (AUDIT-C), caffeine, stimulants, corticosteroids, and beta-agonists." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:anaemia, clue_prompt: { en: "Check CBC, ferritin, and Vitamin B12 if co-existing fatigue or cognitive fog." } }
      patient_hidden_agenda_prompts:
        - { en: "Gently explore stigma around mental health care, domestic/workplace stress, trauma, and preference for talking therapy vs medication." }
    positive_exclusions:
      - id: ex_suicidal
        finding_concept_id: rf:suicidal_ideation
        question: { en: "Have you had any thoughts of hurting yourself, ending your life, or feeling you cannot keep yourself safe?", zh_hk: "請問你最近有沒有傷害自己、輕生的念頭，或覺得無法保障自己安全？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_cardiac_cp
        finding_concept_id: rf:chest_pain_cardiac
        question: { en: "Are you currently having chest pain, chest tightness, or fainting?", zh_hk: "請問你現時有沒有胸痛、心口壓迫或暈倒？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_confusion
        finding_concept_id: rf:confusion
        question: { en: "Have you or your family noticed severe confusion, hallucinations, or extreme agitation?", zh_hk: "請問你或家人有否察覺嚴重意識混亂、幻覺或極度躁動？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_mental_health_crisis
        trigger_condition: { en: "Thoughts of self-harm or suicide, feeling unable to stay safe, or acute crisis", zh_hk: "出現自殘或輕生念頭、感到無法保持安全或情緒危急" }
        escalation_channel: crisis_hotline
        patient_instruction:
          en: "Support is available right now. If you have thoughts of harming yourself or feel unsafe, contact a 24-hour crisis support hotline or emergency services immediately."
          zh_hk: "你並不孤單，隨時有專業支援陪伴。如出現傷害自己或輕生念頭，請立即致電24小時情緒支援熱線或緊急救援服務。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:insomnia
    rfe_concept_id: rfe:insomnia
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_insomnia, concept_id: cond:sleep_apnoea_insomnia, prevalence_note: "Primary chronic/acute insomnia (first-line CBT-I)" }
        - { id: p_gad, concept_id: cond:gad, key_discriminators: ["sleep-onset insomnia with rumination"] }
        - { id: p_dep, concept_id: cond:depression, key_discriminators: ["early morning wakening", "anhedonia"] }
      serious_not_to_be_missed:
        - { id: s_dep_suicide, concept_id: cond:depression, key_discriminators: ["severe insomnia strongly elevates acute suicide risk"] }
        - { id: s_osa, concept_id: cond:sleep_apnoea_insomnia, key_discriminators: ["loud snoring, witnessed apnoeas, daytime somnolence, driving risk"] }
        - { id: s_aud, concept_id: cond:alcohol_use_disorder, key_discriminators: ["using alcohol as a sleep aid / withdrawal insomnia"] }
      pitfalls_often_missed:
        - { id: o_drugs, concept_id: cond:drug_adverse_effect, key_discriminators: ["late caffeine, SSRIs, corticosteroids, decongestants, hypnotic rebound"] }
        - { id: o_iron_rls, concept_id: cond:iron_deficiency_anaemia, key_discriminators: ["restless legs syndrome — check serum ferritin (<50-75 ug/L)"] }
      masquerades:
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Screen PHQ-2/PHQ-9 and active suicidality in every insomnia presentation." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review alcohol, caffeine, nicotine, steroids, SSRIs, and prior hypnotic dependence." } }
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Consider thyroid function testing if palpitations, weight change, or heat/cold intolerance." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore expectations for sleeping pills (benzodiazepine/Z-drug), shift-work strain, or fear of losing daytime functioning." }
    positive_exclusions:
      - id: ex_suicidal
        finding_concept_id: rf:suicidal_ideation
        question: { en: "Have you had any thoughts of harming yourself or feeling that life is not worth living?", zh_hk: "請問你最近有沒有想過傷害自己，或覺得生無可戀？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_dyspnoea_sleep
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Do you wake up gasping for air, choking, or unable to breathe when lying flat?", zh_hk: "請問你睡眠時有否因窒息感、透唔到氣或平躺氣促而驚醒？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_confusion
        finding_concept_id: rf:confusion
        question: { en: "Have you had episodes of severe confusion, hallucinations, or sudden daytime sleep attacks while driving?", zh_hk: "請問你有否出現嚴重意識混亂、幻覺，或日間駕駛時突然無法控制地睡著？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_insomnia_crisis_safety
        trigger_condition: { en: "Thoughts of self-harm, severe daytime drowsiness risking driving safety, or waking gasping for air", zh_hk: "自殘或輕生念頭、日間極度嗜睡影響駕駛安全，或睡夢中呼吸困難驚醒" }
        escalation_channel: crisis_hotline
        patient_instruction:
          en: "Avoid driving or operating machinery if severely sleep-deprived or after sedative medicines. If you have any thoughts of self-harm, contact a 24-hour crisis support hotline or emergency services immediately."
          zh_hk: "如嚴重睡眠不足或服用助眠藥物後，切勿駕駛或操作機械。如出現傷害自己或輕生念頭，請立即致電24小時情緒支援熱線或緊急救援服務。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

# ===========================================================================
# OBSERVATION RULES (6) — Quantitative Bands, Conversions & Clinician Plans
# Note: obs_rule:esr (canonical_ucum: "mm/h") is staged in w1_pod_c_overlays.yaml
# pending addition of "mm/h" to VALID_UCUM in backend/ontology/lint.py.
# ===========================================================================
observation_rules:
  - id: obs_rule:urate
    observation_concept_id: obs:urate
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    unit_conversions:
      # Convert umol/L -> canonical mmol/L (divide by 1000)
      - { from_ucum: "umol/L", factor: 0.001, offset: 0.0 }
    reference_intervals:
      - { id: ri_adult_default, low: 0.15, high: 0.42, priority: 0 }
      - { id: ri_adult_male, low: 0.21, high: 0.42, priority: 10, when: { fact: sex, op: eq, value: "M" } }
      - { id: ri_adult_female, low: 0.14, high: 0.36, priority: 10, when: { fact: sex, op: eq, value: "F" } }
    severity_bands:
      significant: { gt: 0.48 }
      urgent: { gt: 0.60 }
      critical: { gt: 0.72 }
    direction_templates:
      H:
        working_problem: { en: "hyperuricaemia", zh_hk: "高尿酸血症" }
        plan_template:
          en: "Confirm gout history (serum urate may be falsely normal during an acute flare — repeat 2-4 weeks post-flare). Target <0.36 mmol/L (<0.30 mmol/L if tophi) on ULT; check eGFR and HLA-B*58:01 before allopurinol."
          zh_hk: "核實痛風病史（急性發作期血尿酸可假性正常，應於發作後2至4星期覆檢）；降尿酸目標 <0.36 mmol/L（有痛風石 <0.30 mmol/L），處方別嘌醇前須核對腎功能及 HLA-B*58:01。"
        relevant_med_class_ids: ["drug_class:xanthine_oxidase_inhibitor", "drug_class:gout_acute", "drug_class:diuretic"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: obs_rule:calcium
    observation_concept_id: obs:calcium
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    reference_intervals:
      - { id: ri_adult_default, low: 2.15, high: 2.55, priority: 0 }
    severity_bands:
      significant: { lt: 2.00, gt: 2.75 }
      urgent: { lt: 1.90, gt: 3.00 }
      critical: { lt: 1.75, gt: 3.50 }
    direction_templates:
      H:
        working_problem: { en: "hypercalcaemia", zh_hk: "高血鈣症" }
        plan_template:
          en: "Verify albumin-corrected/ionised calcium and order PTH, eGFR, Vitamin D, and myeloma/malignancy workup; review thiazides, lithium, and Vitamin D/calcium supplements; urgent hospital care if >=3.0 mmol/L or symptomatic."
          zh_hk: "核實校正血鈣並檢查副甲狀腺素 (PTH)、腎功能、維他命D及排除腫瘤／骨髓瘤；檢視利尿藥、鋰劑及補充劑；如 >=3.0 mmol/L 或有症狀須緊急送院。"
        relevant_med_class_ids: ["drug_class:diuretic", "drug_class:mood_stabiliser"]
      L:
        working_problem: { en: "hypocalcaemia", zh_hk: "低血鈣症" }
        plan_template:
          en: "Verify corrected calcium, magnesium, Vitamin D, PTH, and eGFR; screen perioral/digital paraesthesiae, tetany, or QTc prolongation; urgent hospital treatment if <1.9 mmol/L or symptomatic; hold bisphosphonates."
          zh_hk: "核實校正血鈣、血鎂、維他命D、PTH及腎功能；篩查口周麻痺、抽搐或心電圖 QTc 延長；如 <1.9 mmol/L 或有症狀須緊急處理，並暫緩雙膦酸鹽。"
        relevant_med_class_ids: ["drug_class:bisphosphonate"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: obs_rule:ck
    observation_concept_id: obs:ck
    canonical_ucum: "U/L"
    display_ucum: "U/L"
    reference_intervals:
      - { id: ri_adult_default, low: 30.0, high: 200.0, priority: 0 }
      - { id: ri_adult_male, low: 40.0, high: 250.0, priority: 10, when: { fact: sex, op: eq, value: "M" } }
      - { id: ri_adult_female, low: 30.0, high: 170.0, priority: 10, when: { fact: sex, op: eq, value: "F" } }
    severity_bands:
      significant: { gt: 500.0 }
      urgent: { gt: 1000.0 }
      critical: { gt: 5000.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated creatine kinase (myopathy / rhabdomyolysis risk)", zh_hk: "肌酸激酶 (CK) 偏高（肌病變／橫紋肌溶解風險）" }
        plan_template:
          en: "Assess muscle pain/weakness, dark tea-coloured urine, vigorous exercise, hypothyroidism, and culprit drugs (statins, colchicine, macrolide DDIs). If CK >5x ULN (~1000 U/L) hold statin and check RFT/K+; if >=5000 U/L or AKI/dark urine escalate urgently to hospital."
          zh_hk: "評估肌肉痛／無力、茶色尿、劇烈運動、甲減及誘發藥物（他汀、秋水仙鹼）；若 CK >1000 U/L 應暫停他汀並覆檢腎功能／血鉀，>=5000 U/L 或伴腎損傷須緊急送院。"
        relevant_med_class_ids: ["drug_class:statin", "drug_class:gout_acute", "drug_class:macrolide_antibiotic"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: obs_rule:vitamin_d
    observation_concept_id: obs:vitamin_d
    canonical_ucum: "nmol/L"
    display_ucum: "nmol/L"
    reference_intervals:
      - { id: ri_adult_default, low: 50.0, high: 150.0, priority: 0 }
    severity_bands:
      significant: { lt: 30.0, gt: 200.0 }
      urgent: { lt: 15.0, gt: 250.0 }
    direction_templates:
      L:
        working_problem: { en: "Vitamin D deficiency", zh_hk: "維他命D缺乏" }
        plan_template:
          en: "Replace with colecalciferol (especially prior to osteoporosis/bisphosphonate therapy); check serum calcium and renal function; assess fracture/falls risk."
          zh_hk: "補充維他命D3（特別於開始骨質疏鬆雙膦酸鹽治療前），並檢查血鈣、腎功能及評估跌倒／骨折風險。"
        relevant_med_class_ids: ["drug_class:bisphosphonate"]
      H:
        working_problem: { en: "hypervitaminosis D", zh_hk: "維他命D過量" }
        plan_template:
          en: "Stop high-dose Vitamin D supplements and check corrected serum calcium and renal function."
          zh_hk: "停服高劑量維他命D補充劑，並覆檢校正血鈣及腎功能。"
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: obs_rule:lithium
    observation_concept_id: obs:lithium
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    reference_intervals:
      - { id: ri_maintenance, low: 0.6, high: 0.8, priority: 0, source_note: "12-hour post-dose trough maintenance range (0.6-1.0 mmol/L acute mania)" }
    severity_bands:
      significant: { lt: 0.4, gt: 1.0 }
      urgent: { gt: 1.2 }
      critical: { gt: 1.5 }
    trend_rules:
      - id: tr_lithium_acute_rise
        direction: rise
        delta_abs: 0.3
        window_days: 30
        urgency_floor: 3
        clinician_rationale:
          en: "Serum lithium rise >=0.3 mmol/L within 30 days — check hydration, eGFR, and newly added NSAIDs, ACEi/ARBs, or thiazide diuretics."
          zh_hk: "30日內血鋰濃度上升 >=0.3 mmol/L，須即時排查脫水、腎功能惡化或新併用消炎止痛藥／血壓藥／利尿藥。"
    direction_templates:
      H:
        working_problem: { en: "supratherapeutic lithium / toxicity risk", zh_hk: "血鋰濃度過高／鋰中毒風險" }
        plan_template:
          en: "Verify 12h trough timing; screen tremor, ataxia, dysarthria, GI upset, confusion; hold lithium and arrange immediate emergency assessment if >=1.5 mmol/L or symptomatic; check eGFR/electrolytes and interacting drugs."
          zh_hk: "核實抽血時間是否服藥後12小時；評估手震、步態不穩、口齒不清及嘔吐；如 >=1.5 mmol/L 或出現中毒症狀須暫停鋰劑並立即送急症室。"
        relevant_med_class_ids: ["drug_class:mood_stabiliser", "drug_class:nsaid", "drug_class:raas_agent", "drug_class:diuretic"]
      L:
        working_problem: { en: "subtherapeutic serum lithium", zh_hk: "血鋰濃度偏低" }
        plan_template:
          en: "Assess adherence, timing of sample, and relapse symptoms before dose adjustment with psychiatrist/GP."
          zh_hk: "評估服藥依從性、抽血時間及情緒復發徵兆，再由醫生考慮調整劑量。"
        relevant_med_class_ids: ["drug_class:mood_stabiliser"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: obs_rule:anti_ccp
    observation_concept_id: obs:anti_ccp
    canonical_ucum: "U/mL"
    display_ucum: "U/mL"
    reference_intervals:
      - { id: ri_default, low: null, high: 20.0, priority: 0 }
    severity_bands:
      significant: { ge: 20.0 }
      urgent: { ge: 60.0 }
    direction_templates:
      H:
        working_problem: { en: "positive anti-CCP (suspected rheumatoid arthritis)", zh_hk: "抗環瓜氨酸肽抗體陽性（懷疑類風濕性關節炎）" }
        plan_template:
          en: "High specificity (>95%) for rheumatoid arthritis; check CRP, ESR, CBC, LFT, RFT, and arrange early rheumatology referral for timely DMARD initiation."
          zh_hk: "對類風濕性關節炎具高度特異性 (>95%)；建議檢查發炎指數及肝腎功能，並盡早轉介風濕病科評估啟動抗風濕藥 (DMARD)。"
        relevant_med_class_ids: ["drug_class:dmard", "drug_class:nsaid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

