# ===========================================================================
# DETERMINISTIC CLINICAL EDGES (17) — PGx, DDIs, Renal Gates & Red-Flag Floor
# ===========================================================================
edges:
  - id: edge:carbamazepine_pgx_hla_b_1502
    source_id: drug:carbamazepine
    relation: REQUIRES_PGX_CHECK
    target_id: pgx:hla_b_1502
    severity: high
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      all:
        - { fact: ethnicity, op: in, value: ["han_chinese", "thai", "malay", "southeast_asian", "south_asian"] }
        - { fact: hla_b_1502, op: ne, value: "negative" }
    clinician_rationale:
      en: "HLA-B*15:02 carries a >100-fold risk of fatal Stevens-Johnson syndrome / toxic epidermal necrolysis (SJS/TEN) with carbamazepine in East/Southeast/South Asian ancestries."
      zh_hk: "東亞／東南亞／南亞裔人士若帶有 HLA-B*15:02 基因，服用卡馬西平引發致命性史蒂文斯-強森綜合症／中毒性表皮壞死鬆解症 (SJS/TEN) 風險極高。"
    clinician_action_prompt:
      en: "Verify negative HLA-B*15:02 result before initiating carbamazepine; select alternative agent (e.g. levetiracetam, gabapentin for neuropathic pain) if positive or pending."
      zh_hk: "處方卡馬西平前必須確認 HLA-B*15:02 呈陰性；如陽性或未有結果應考慮替代藥物。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:ssri_nsaid_gi_bleed
    source_id: drug_class:ssri
    relation: INTERACTS_WITH
    target_id: drug_class:nsaid
    bidirectional: true
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Concurrent SSRI + systemic NSAID impairs platelet serotonin uptake and gastric mucosal protection, increasing upper GI bleeding risk 3-6x."
      zh_hk: "同時使用 SSRI 與口服非類固醇消炎止痛藥 (NSAID) 會顯著增加上消化道出血風險（約3至6倍）。"
    clinician_action_prompt:
      en: "Avoid systemic NSAID if possible (use paracetamol or topical NSAID); if clinically essential, add PPI gastroprotection and counsel on melaena red flags."
      zh_hk: "盡量避免併用口服消炎止痛藥；如確有需要應處方質子泵抑制劑 (PPI) 護胃並提醒黑便警號。"
    patient_safety_net:
      en: "If you notice black tarry stools, vomiting blood, or severe upper stomach pain while taking these medicines, seek urgent medical care immediately."
      zh_hk: "服藥期間如出現黑便、吐血或劇烈上腹痛，請立即尋求緊急醫療評估。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:ssri_tramadol_serotonin
    source_id: drug_class:ssri
    relation: INTERACTS_WITH
    target_id: drug:tramadol
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "SSRI + tramadol causes potentially life-threatening serotonin toxicity (agitation, clonus, hyperreflexia, diaphoresis, hyperthermia) and lowers seizure threshold (and CYP2D6 SSRIs like fluoxetine block tramadol analgesia)."
      zh_hk: "SSRI 與曲馬多併用可引致嚴重血清素症候群及降低抽搐閾值，且氟西汀等 CYP2D6 抑制劑會削弱曲馬多止痛效力。"
    clinician_action_prompt:
      en: "Avoid tramadol in patients on SSRIs/SNRIs; propose non-serotonergic analgesic alternative for doctor review."
      zh_hk: "避免為正服用 SSRI/SNRI 的病人處方曲馬多，建議醫生考慮非血清素能止痛替代方案。"
    patient_safety_net:
      en: "If you develop sudden confusion, fever, heavy sweating, shivering, fast heartbeat, or muscle twitching, seek emergency medical care immediately."
      zh_hk: "如突然出現意識混亂、發燒、大汗、顫抖、心跳過快或肌肉抽搐，請立即尋求緊急醫療協助。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:benzo_opioid_respiratory_depression
    source_id: drug_class:benzodiazepine
    relation: INTERACTS_WITH
    target_id: drug_class:opioid
    bidirectional: true
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Co-prescribing benzodiazepines with opioids causes synergistic CNS and fatal respiratory depression, overdose, and falls."
      zh_hk: "同時處方苯二氮平類鎮靜劑與鴉片類止痛藥會引致協同中樞神經及致命性呼吸抑制。"
    clinician_action_prompt:
      en: "Hard-block concurrent benzodiazepine + opioid draft; require direct clinician review, deprescribing/tapering plan, and take-home naloxone consideration if unavoidable."
      zh_hk: "禁止自動同時處方鎮靜劑與鴉片類藥物；必須由醫生直接評估、制定減藥方案及考慮安全措施。"
    patient_safety_net:
      en: "Combining sedative and strong opioid medicines can dangerously slow breathing. If extreme drowsiness, slurred speech, or slow/shallow breathing occurs, seek emergency medical help immediately."
      zh_hk: "同時服用鎮靜安眠藥與鴉片類止痛藥可引致危險的呼吸抑制；如出現極度嗜睡、口齒不清或呼吸緩慢微弱，請立即尋求緊急救援。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:colchicine_macrolide_toxicity
    source_id: drug:colchicine
    relation: INTERACTS_WITH
    target_id: drug_class:macrolide_antibiotic
    bidirectional: true
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Strong CYP3A4 / P-gp inhibition by macrolides (especially clarithromycin) causes rapid, potentially fatal colchicine accumulation (pancytopenia, multiorgan failure, myoneuropathy)."
      zh_hk: "大環內酯類抗生素（特別是克拉黴素）強力抑制 CYP3A4 及 P-gp，與秋水仙鹼併用可引致致命性藥物積聚中毒（全血細胞減少、多器官衰竭）。"
    clinician_action_prompt:
      en: "Hard-block colchicine + clarithromycin combination; select non-interacting antibiotic or alternative acute gout therapy (e.g. short prednisolone course)."
      zh_hk: "嚴禁併用秋水仙鹼與克拉黴素；應由醫生改選無相互作用的抗生素或以短期類固醇替代處理急性痛風。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:colchicine_renal_ci
    source_id: drug:colchicine
    relation: CONTRAINDICATED_IN
    target_id: cond:ckd
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    when:
      fact: egfr_ml_min
      op: lt
      value: 30
    clinician_rationale:
      en: "Colchicine clearance is severely reduced when eGFR <30 mL/min/1.73m2, carrying high risk of fatal toxicity (bone marrow suppression, rhabdomyolysis, GI haemorrhage)."
      zh_hk: "當腎小球過濾率 eGFR 低於 30 mL/min 時，秋水仙鹼排泄顯著下降，極易引致致命性中毒（骨髓抑制、橫紋肌溶解）。"
    clinician_action_prompt:
      en: "Block colchicine in stage 4-5 CKD (eGFR <30); propose short course oral prednisolone (or intra-articular steroid) for acute gout flare."
      zh_hk: "eGFR <30 禁用秋水仙鹼；建議醫生改用短期口服類固醇或關節內注射處理急性痛風。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:alendronate_renal_ci
    source_id: drug:alendronate
    relation: CONTRAINDICATED_IN
    target_id: cond:ckd
    severity: hard_block
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      fact: egfr_ml_min
      op: lt
      value: 35
    clinician_rationale:
      en: "Oral bisphosphonates (alendronate) are contraindicated when eGFR <35 mL/min/1.73m2 due to impaired renal excretion, nephrotoxicity, and adynamic bone disease / severe hypocalcaemia risk."
      zh_hk: "當 eGFR 低於 35 mL/min 時禁用口服雙膦酸鹽（阿侖膦酸鈉），以免引起藥物積聚、腎損傷及低血鈣風險。"
    clinician_action_prompt:
      en: "Block alendronate; check serum calcium, Vitamin D, and PTH, and consider specialist/renal-safe osteoporosis management."
      zh_hk: "停用或避免處方阿侖膦酸鈉；檢查血鈣、維他命D及副甲狀腺素，由醫生評估腎病適用之骨質疏鬆方案。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:lithium_monitored_by_level
    source_id: drug:lithium
    relation: MONITORED_BY
    target_id: obs:lithium
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 7
      repeat_interval_days: 90
      grace_days: 7
      applies_on: both
    clinician_rationale:
      en: "Lithium has a narrow therapeutic index (0.6-0.8 mmol/L): requires 12-hour post-dose trough serum lithium 5-7 days after initiation/dose change and every 3 months once stable, plus 6-monthly RFT, TSH, and serum calcium."
      zh_hk: "碳酸鋰治療窗狹窄（0.6–0.8 mmol/L）：開始或調藥後5至7日須驗服藥後12小時血鋰濃度，穩定後每3個月覆檢，並每6個月監察腎功能、TSH及血鈣。"
    clinician_action_prompt:
      en: "Order 12-hour trough serum lithium (+ RFT/TSH/Ca2+ if due); screen for tremor, ataxia, polyuria, and interacting drugs (NSAIDs, ACEi/ARB, thiazides)."
      zh_hk: "安排服藥後12小時血鋰濃度及腎功能／甲狀腺／血鈣檢查，並評估震顫、步態不穩及藥物相互作用。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:lithium_nsaid_toxicity
    source_id: drug:lithium
    relation: INTERACTS_WITH
    target_id: drug_class:nsaid
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "NSAIDs reduce renal prostaglandin-mediated lithium clearance, raising serum lithium levels by 15-60% and precipitating acute neuro- and nephrotoxicity."
      zh_hk: "非類固醇消炎止痛藥 (NSAID) 會減少腎臟排泄鋰劑，令血鋰濃度急升並誘發急性鋰中毒。"
    clinician_action_prompt:
      en: "Avoid systemic NSAIDs (including OTC ibuprofen/naproxen) in patients taking lithium; if exposure occurred, check urgent serum lithium and RFT."
      zh_hk: "服用鋰劑人士應避免口服消炎止痛藥（包括非處方藥物）；如已服用應盡快覆檢血鋰及腎功能。"
    patient_safety_net:
      en: "If you take lithium and develop coarse shaking, slurred speech, severe vomiting/diarrhoea, drowsiness, or unsteadiness, seek urgent emergency medical review immediately."
      zh_hk: "服用鋰劑期間如出現手震加劇、口齒不清、嚴重嘔吐腹瀉、嗜睡或行路不穩，請立即前往急症室作緊急評估。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:cauda_equina_emergency
    source_id: rf:cauda_equina_signs
    relation: RED_FLAG_FOR
    target_id: cond:cauda_equina
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Saddle anaesthesia, new bladder/bowel dysfunction, or bilateral progressive leg weakness with back pain indicates suspected cauda equina syndrome — surgical decompression emergency (<24-48h)."
      zh_hk: "腰痛伴隨會陰麻痺、突發尿瀦留／大小便失禁或雙下肢進行性無力，高度懷疑馬尾綜合症，屬緊急神經外科手術指徵。"
    clinician_action_prompt:
      en: "Immediate emergency department transfer for urgent lumbosacral MRI and neurosurgical/orthopaedic decompression assessment."
      zh_hk: "立即轉送急症室安排緊急腰椎磁力共振 (MRI) 及神經外科／骨科減壓手術評估。"
    patient_safety_net:
      en: "Numbness around the groin/buttocks, difficulty passing urine, loss of bladder or bowel control, or weakness in both legs requires immediate emergency hospital assessment."
      zh_hk: "如出現會陰或臀部麻痺、排尿困難、大小便失禁或雙腳無力，必須立即前往急症室作緊急處理。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:thunderclap_headache_sah
    source_id: rf:thunderclap_headache
    relation: RED_FLAG_FOR
    target_id: cond:sah
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Sudden-onset maximal headache reaching peak within 60 seconds is subarachnoid haemorrhage until proven otherwise (urgent non-contrast CT head +/- LP)."
      zh_hk: "一分鐘內達致頂峰的突發雷擊樣劇烈頭痛必須先排除蛛網膜下腔出血，須即時送院作急診腦部電腦掃描。"
    clinician_action_prompt:
      en: "Immediate ambulance transfer to emergency department for urgent CT brain; do not delay for outpatient imaging."
      zh_hk: "立即安排救護車送往急症室進行緊急腦部電腦掃描，切勿安排門診輪候檢查。"
    patient_safety_net:
      en: "A sudden, explosive 'worst-ever' headache peaking within a minute is a medical emergency — call emergency services immediately."
      zh_hk: "突發如雷擊般的極劇烈頭痛屬緊急醫療情況，請立即致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:focal_neuro_deficit_stroke
    source_id: rf:focal_neuro_deficit_fast
    relation: RED_FLAG_FOR
    target_id: cond:stroke_tia
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Acute focal neurological deficit (FAST positive: facial droop, limb weakness, dysarthria/aphasia, acute ataxia, visual field defect) requires time-critical stroke thrombolysis/thrombectomy evaluation."
      zh_hk: "突發面部歪斜、肢體無力、言語障礙或急性步態不穩屬急性中風警號，須爭分奪秒送院評估溶栓或取栓治療。"
    clinician_action_prompt:
      en: "Record exact 'last known well' time and activate immediate emergency ambulance stroke pathway."
      zh_hk: "記錄最後正常時間並立即啟動緊急救護車急性中風轉送程序。"
    patient_safety_net:
      en: "Sudden face drooping, arm or leg weakness, slurred speech, or sudden loss of balance/vision is a medical emergency — call emergency services right away."
      zh_hk: "如突然出現面部歪斜、手腳無力、說話含糊或視力／平衡驟失，請立即致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:acute_visual_loss_glaucoma
    source_id: rf:acute_visual_loss_painful_eye
    relation: RED_FLAG_FOR
    target_id: cond:acute_glaucoma
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Painful red eye with acute visual decline, rainbow haloes around lights, headache/nausea, or fixed mid-dilated pupil indicates sight-threatening emergency (acute angle-closure glaucoma, microbial keratitis, or endophthalmitis)."
      zh_hk: "眼紅伴隨劇痛、視力驟降、視物見光環、頭痛嘔吐或瞳孔散大固定，高度懷疑急性閉角型青光眼等致盲急症。"
    clinician_action_prompt:
      en: "Immediate same-hour emergency ophthalmology / A&E referral; do not prescribe topical steroids or dilating drops."
      zh_hk: "即時轉介急症室眼科作緊急降眼壓處理；切勿處方外用類固醇眼藥水或散瞳劑。"
    patient_safety_net:
      en: "Sudden loss or blurring of vision, severe eye pain, or seeing rainbow haloes around lights needs immediate emergency eye assessment to protect your sight."
      zh_hk: "如出現突發視力模糊或下降、眼睛劇痛或看燈光時出現彩虹光環，請立即前往急症室作緊急眼科評估以保護視力。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:jaw_claudication_gca
    source_id: rf:jaw_claudication_temporal_pain
    relation: RED_FLAG_FOR
    target_id: cond:gca
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    when:
      fact: age_years
      op: ge
      value: 50
    clinician_rationale:
      en: "New temporal headache with jaw claudication, scalp tenderness, or visual symptoms in an adult >=50y strongly suggests giant cell arteritis (GCA) — high risk of irreversible bilateral blindness if steroid initiation is delayed."
      zh_hk: "五十歲或以上人士新出現太陽穴痛、咀嚼下顎痛、頭皮壓痛或視力異常，高度懷疑巨細胞動脈炎，延誤類固醇治療可致永久失明。"
    clinician_action_prompt:
      en: "Arrange same-day urgent GP/hospital assessment, immediate CRP/ESR/CBC, and immediate high-dose corticosteroid protocol (IV methylprednisolone if visual symptoms) without waiting for temporal artery biopsy."
      zh_hk: "安排即日緊急醫生／急症室評估及即時檢測 CRP/ESR/全血計數，按指引即時啟動高劑量類固醇治療（如有視力症狀須即時急症室靜脈給藥）。"
    patient_safety_net:
      en: "If you are over 50 with new temple pain, jaw pain when chewing, or any sudden blurring/double vision, seek urgent medical assessment today — go to emergency care immediately if vision changes."
      zh_hk: "如年滿五十歲並新出現太陽穴痛、咀嚼時下顎痠痛，請今天內盡快求醫；若出現任何視力模糊、重影或短暫失明，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:hot_swollen_joint_septic
    source_id: rf:hot_swollen_single_joint
    relation: RED_FLAG_FOR
    target_id: cond:septic_arthritis
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "An acute hot, swollen, painful monoarthritis (especially with fever, prosthetic joint, or inability to move/weight-bear) is septic arthritis until proven otherwise by joint aspiration."
      zh_hk: "單一關節急性紅腫熱痛並無法活動或負重（尤伴發燒或人工關節），未經關節液抽驗前必須先排除化膿性關節炎。"
    clinician_action_prompt:
      en: "Same-day emergency orthopaedic/A&E referral for synovial fluid aspiration (Gram stain, culture, crystals) BEFORE starting antibiotics."
      zh_hk: "即日轉送急症室骨科作關節穿刺抽液化驗（細菌培養及結晶體檢查），切勿於抽液前胡亂先處方口服抗生素。"
    patient_safety_net:
      en: "A single hot, red, severely swollen joint — especially with fever or inability to move or stand on it — needs urgent hospital assessment today."
      zh_hk: "如單一關節突然發熱紅腫劇痛、無法郁動或負重，或同時發燒，請立即前往急症室作緊急檢查。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:anaphylaxis_emergency_adrenaline
    source_id: rf:anaphylaxis_airway_swelling
    relation: RED_FLAG_FOR
    target_id: cond:anaphylaxis
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Mucocutaneous hives/angioedema with airway swelling, respiratory compromise, or hypotension is anaphylaxis — immediate IM adrenaline is life-saving; antihistamines/steroids are second-line only."
      zh_hk: "皮疹或面部腫脹伴隨喉頭水腫、呼吸困難或血壓下降屬過敏性休克，即時肌肉注射腎上腺素為唯一救命一線治療。"
    clinician_action_prompt:
      en: "Administer IM adrenaline immediately (or instruct immediate autoinjector use), lay patient flat with legs elevated (sit upright only if severe breathing distress), and call emergency services."
      zh_hk: "立即肌肉注射腎上腺素（或即時使用隨身腎上腺素筆），讓病人平躺（僅於嚴重氣促時微坐）並立即召喚緊急救援。"
    patient_safety_net:
      en: "Swelling of the lips, tongue, or throat, trouble breathing, hoarse voice, or feeling faint with a rash is an emergency — use an adrenaline autoinjector if prescribed, lie flat, and call emergency services immediately."
      zh_hk: "如出現嘴唇、舌頭或喉嚨腫脹、呼吸困難、聲沙或出風癩伴頭暈休克，屬危急情況；如有隨身腎上腺素筆請立即使用，平躺並即時致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: edge:ophthalmic_zoster_urgent_eye
    source_id: rf:ophthalmic_zoster_tip_nose
    relation: RED_FLAG_FOR
    target_id: cond:herpes_zoster
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "Herpes zoster affecting the trigeminal V1 dermatome (forehead, upper eyelid, or nasal tip — Hutchinson's sign) carries high risk of keratitis, uveitis, and permanent visual loss."
      zh_hk: "三叉神經第一分支（額頭、上眼瞼或鼻尖水泡，即 Hutchinson 徵象）生蛇極易波及角膜及葡萄膜，可致視力受損。"
    clinician_action_prompt:
      en: "Initiate oral valaciclovir immediately (even >72h if new vesicles or ocular involvement) and arrange same-day ophthalmology slit-lamp assessment."
      zh_hk: "立即處方口服伐昔洛韋抗病毒治療，並安排即日眼科裂隙燈檢查以排除角膜炎。"
    patient_safety_net:
      en: "A blistering shingles rash on your forehead, eyelid, or tip of your nose needs urgent same-day doctor and eye specialist review — seek emergency care if eye pain or blurry vision develops."
      zh_hk: "如額頭、眼皮或鼻尖生蛇起水泡，必須即日由醫生及眼科評估；如出現眼紅、眼痛或視力模糊，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

# ===========================================================================
# PRESENTATION FRAMES (8) — Murtagh PROMPT + openEHR Positive Exclusions + Safety Netting
# ===========================================================================
frames:
  - id: frame:headache
    rfe_concept_id: rfe:headache
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_tth, concept_id: cond:tension_headache, prevalence_note: "Most common primary headache" }
        - { id: p_migraine, concept_id: cond:migraine, key_discriminators: ["unilateral throbbing", "nausea/photophobia", "aura"] }
        - { id: p_urti, concept_id: cond:urti, prevalence_note: "Viral / sinus headache" }
      serious_not_to_be_missed:
        - { id: s_sah, concept_id: cond:sah, key_discriminators: ["thunderclap onset <1 min", "occipital", "neck stiffness"] }
        - { id: s_meningitis, concept_id: cond:meningitis, key_discriminators: ["fever", "neck stiffness", "photophobia", "non-blanching rash"] }
        - { id: s_gca, concept_id: cond:gca, key_discriminators: ["age >=50", "temporal tenderness", "jaw claudication", "visual loss"] }
        - { id: s_stroke, concept_id: cond:stroke_tia, key_discriminators: ["acute focal deficit", "ataxia"] }
        - { id: s_glaucoma, concept_id: cond:acute_glaucoma, key_discriminators: ["painful red eye", "haloes", "nausea"] }
        - { id: s_malignancy, concept_id: cond:malignancy_occult, key_discriminators: ["progressive morning headache", "new onset >50y", "cancer history"] }
      pitfalls_often_missed:
        - { id: o_moh, concept_id: cond:drug_adverse_effect, key_discriminators: ["medication-overuse headache (>=10-15 analgesic/triptan days/month)"] }
        - { id: o_htn, concept_id: cond:hypertension, key_discriminators: ["severe BP >=180/120 / hypertensive emergency"] }
      masquerades:
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Screen for chronic stress, depression, or sleep disturbance driving daily headaches." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Audit OTC analgesic, triptan, caffeine, and nitrate frequency (medication-overuse headache)." } }
        - { id: mq_spine, tier: primary, masquerade: spinal_dysfunction, concept_id: cond:spinal_dysfunction, clue_prompt: { en: "Assess cervicogenic headache from cervical facet/postural dysfunction." } }
      patient_hidden_agenda_prompts:
        - { en: "Directly ask whether the patient fears a brain tumour or aneurysm, or has high work/family stress." }
    positive_exclusions:
      - id: ex_thunderclap
        finding_concept_id: rf:thunderclap_headache
        question: { en: "Did the headache come on suddenly like a thunderclap, reaching maximum intensity within a minute?", zh_hk: "請問頭痛是否像雷擊一樣突然發作，在一分鐘內達致最劇烈程度？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_meningism
        finding_concept_id: rf:stiff_neck_meningism
        question: { en: "Do you have a fever, stiff neck, confusion, or a new rash that does not fade when pressed?", zh_hk: "請問你有沒有同時發燒、頸部僵硬、意識混亂，或按壓不退色的新皮疹？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_focal_neuro
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Have you noticed any weakness or numbness on one side, slurred speech, facial droop, or sudden vision loss?", zh_hk: "請問你有否出現單側手腳無力或麻痺、口齒不清、面部歪斜或突發視力異常？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_gca_jaw
        finding_concept_id: rf:jaw_claudication_temporal_pain
        question: { en: "Do you have pain in your jaw when chewing, scalp tenderness when brushing hair, or tender temples?", zh_hk: "請問你咀嚼食物時有否下顎痠痛、梳頭時頭皮痛或太陽穴壓痛？" }
        urgency_if_present: 3
        mandatory: true
        when: { fact: age_years, op: ge, value: 50 }
    safety_netting:
      - id: sn_headache_emergency
        trigger_condition: { en: "Sudden thunderclap pain, fever/stiff neck, weakness/slurred speech, confusion, or sudden vision change", zh_hk: "突發雷擊樣劇痛、發燒頸梗、手腳無力／口齒不清、意識混亂或視力驟變" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency medical care if your headache suddenly becomes explosive, or if you develop fever, a stiff neck, confusion, vision changes, or weakness/slurred speech."
          zh_hk: "如頭痛突然劇烈加劇，或伴隨發燒、頸部僵硬、意識混亂、視力變化、肢體無力或口齒不清，請立即尋求緊急醫療協助。"
    provenance: { author: "ontology_pod_w1_c", review_status: "draft" }

  - id: frame:dizziness_vertigo
