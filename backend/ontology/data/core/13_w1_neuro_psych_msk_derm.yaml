        - { id: s_zoster_eye, concept_id: cond:herpes_zoster, key_discriminators: ["V1 shingles / Hutchinson's sign"] }
        - { id: s_cellulitis, concept_id: cond:cellulitis, key_discriminators: ["orbital cellulitis — painful eye movement, proptosis, diplopia, fever"] }
        - { id: s_gca, concept_id: cond:gca, key_discriminators: ["acute painless/painful ischaemic visual loss in age >=50"] }
      pitfalls_often_missed:
        - { id: o_contact_lens, concept_id: cond:conjunctivitis, key_discriminators: ["contact lens wearer with red painful eye = suspect Pseudomonas keratitis until slit-lamp excluded"] }
