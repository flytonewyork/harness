        - { id: mq_hiv, tier: secondary, masquerade: hiv, concept_id: cond:hiv, clue_prompt: { en: "Consider HIV seroconversion rash or secondary syphilis in generalised non-itchy palmoplantar eruption." } }
      patient_hidden_agenda_prompts:
