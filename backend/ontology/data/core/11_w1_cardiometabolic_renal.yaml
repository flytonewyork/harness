      zh_hk: ["氨氯地平", "脈優", "降壓丸"]
    drug_facet:
      max_daily_mg: 10.0
      dosing_pearl:
        en: "Common cause of dose-dependent bilateral pitting ankle oedema (vasodilatory, not heart failure); avoid treating CCB oedema with loop diuretics — consider dose reduction or ACEi/ARB pairing."
        zh_hk: "常見引致劑量相關的雙側足踝水腫，屬血管擴張副作用，切勿單以去水丸處理，可考慮減量或改配 ACEi/ARB。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: drug:nifedipine
