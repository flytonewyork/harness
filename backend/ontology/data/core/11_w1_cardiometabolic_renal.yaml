# ===========================================================================
# DETERMINISTIC CLINICAL EDGES (16) — Cardiometabolic, Endocrine & Renal Safety
# ===========================================================================
edges:
  - id: edge:carbimazole_agranulocytosis_cbc
    source_id: drug:carbimazole
    relation: TRIGGERS_WORKUP
    target_id: panel:cbc
    severity: critical
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: has_concept, op: is_a, value: "rfe:fever" }
        - { fact: has_concept, op: is_a, value: "rfe:sore_throat" }
        - { fact: has_concept, op: is_a, value: "cond:sepsis" }
    clinician_rationale:
      en: "Carbimazole can cause sudden idiosyncratic agranulocytosis (0.1-0.5%, highest in first 3 months): fever, sore throat, or mouth ulcers require immediate drug cessation and urgent same-day CBC with neutrophil count (ANC)."
      zh_hk: "卡比馬唑可引致突發性粒細胞缺乏症（首三個月風險最高）；患者如出現發燒、喉嚨痛或口腔潰瘍，必須即時停藥並即日抽血驗全血細胞計數及嗜中性白血球。"
    clinician_action_prompt:
      en: "Instruct patient to STOP carbimazole immediately and arrange urgent same-day CBC/ANC (or immediate hospital ED transfer if febrile/unwell for empiric neutropenic sepsis management)."
    patient_safety_net:
      en: "While taking carbimazole, if you develop a fever, sore throat, mouth ulcers, or unexplained bruising, stop the tablets straight away and seek urgent same-day medical care for an urgent blood test."
      zh_hk: "服用卡比馬唑期間如出現發燒、喉嚨痛、口腔潰瘍或無故瘀傷，請立即暫停服藥，並於即日前往求醫或急症室抽血檢查白血球。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:nitrofurantoin_renal_ci
    source_id: drug:nitrofurantoin
    relation: CONTRAINDICATED_IN
    target_id: cond:ckd
    severity: hard_block
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      fact: egfr_ml_min
      op: lt
      value: 45
    clinician_rationale:
      en: "Nitrofurantoin is contraindicated when eGFR <45 mL/min/1.73m2 due to subtherapeutic urinary concentrations (high treatment failure) and systemic accumulation risking peripheral neuropathy and pulmonary toxicity."
      zh_hk: "當 eGFR 低於 45 mL/min/1.73m2 時禁用呋喃妥因，因尿液藥物濃度不足易致治療失敗，且藥物蓄積可引致周邊神經病變及肺毒性。"
    clinician_action_prompt:
      en: "Hard-block nitrofurantoin; select renally appropriate UTI antibiotic guided by local antibiogram/MSU culture (e.g. fosfomycin, cefalexin, or renally adjusted alternative)."
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:nitrofurantoin_g6pd_ci
    source_id: drug:nitrofurantoin
    relation: CONTRAINDICATED_IN
    target_id: pgx:g6pd_deficiency
    severity: hard_block
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      fact: g6pd_deficient
      op: eq
      value: true
    clinician_rationale:
      en: "Nitrofurantoin is an oxidative agent contraindicated in G6PD deficiency due to risk of acute intravascular haemolytic anaemia."
      zh_hk: "呋喃妥因屬氧化性藥物，葡萄糖六磷酸去氫酶缺乏症（蠶豆症）患者禁用，以免誘發急性溶血性貧血。"
    clinician_action_prompt:
      en: "Hard-block nitrofurantoin in G6PD-deficient patients; choose G6PD-safe UTI antibiotic (e.g. cefalexin, amoxicillin-clavulanate, or fosfomycin per susceptibility)."
    patient_safety_net:
      en: "If you have G6PD deficiency and accidentally took nitrofurantoin, seek urgent medical assessment for dark tea-coloured urine, yellowing of eyes/skin, pallor, or unusual fatigue."
      zh_hk: "如患有蠶豆症而不慎服用呋喃妥因，並出現茶色小便、眼白或皮膚發黃、面色蒼白或異常疲倦，請立即求醫評估。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:spironolactone_raas_hyperkalaemia
    source_id: drug:spironolactone
    relation: INTERACTS_WITH
    target_id: drug_class:raas_agent
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Co-prescribing spironolactone with an ACE inhibitor or ARB causes additive potassium retention with high risk of life-threatening hyperkalaemia and AKI, especially in CKD, diabetes, older adults, or concurrent NSAID/trimethoprim use."
      zh_hk: "螺內酯與 ACEi/ARB 降血壓藥合用會顯著增加嚴重高血鉀及急性腎損傷風險（尤其長者、慢性腎病或合用消炎止痛藥時）。"
    clinician_action_prompt:
      en: "Verify baseline K+ (<=5.0 mmol/L) and eGFR (>=30); order mandatory RFT/K+ recheck at 7-14 days after start or titration and avoid potassium supplements/NSAIDs."
    patient_safety_net:
      en: "Avoid potassium-containing salt substitutes and over-the-counter anti-inflammatory painkillers while on these medicines; seek urgent care if you develop severe muscle weakness, chest pain, or palpitations."
      zh_hk: "服藥期間請避免食用含鉀代鹽及自行購買消炎止痛藥；如出現嚴重肌肉無力、胸痛或心悸，請立即求醫。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:beta_blocker_asthma_bronchospasm
    source_id: drug_class:beta_blocker
    relation: CONTRAINDICATED_IN
    target_id: cond:asthma_chronic
    severity: hard_block
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Beta-blockers (especially non-selective agents like propranolol) block beta-2 airway receptors and can precipitate severe or refractory bronchospasm in asthma; avoid completely during asthma exacerbation and avoid non-selective agents in all asthma."
      zh_hk: "乙型受體阻滯劑（尤其非選擇性的普萘洛爾）可誘發嚴重支氣管痙攣及哮喘惡化，哮喘發作期間嚴禁處方，所有哮喘患者均忌用非選擇性製劑。"
    clinician_action_prompt:
      en: "Hard-block non-selective beta-blockers in asthma; if rate control or HFrEF therapy is essential in stable asthma, discuss cardioselective beta-1 agent under specialist supervision or use alternative (e.g. CCB/diltiazem where appropriate)."
    patient_safety_net:
      en: "If you have asthma and notice new wheezing, chest tightness, or worsening shortness of breath after starting a heart or blood pressure medicine, seek urgent medical review (or emergency care if breathing is severely difficult)."
      zh_hk: "哮喘患者如在開始服用心臟或血壓藥後出現喘鳴、胸悶或氣促加劇，請盡快聯絡醫生評估；如嚴重呼吸困難請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:anticoagulant_antiplatelet_bleed
    source_id: drug_class:anticoagulant
    relation: INTERACTS_WITH
    target_id: drug_class:antiplatelet
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Combining an oral anticoagulant (warfarin or DOAC) with an antiplatelet (aspirin or clopidogrel) approximately doubles major GI and intracranial haemorrhage risk without benefit in stable CAD >12 months post-ACS/PCI."
      zh_hk: "同時服用口服抗凝血藥（華法林／新一代薄血丸）及抗血小板藥（阿士匹靈／氯吡格雷）會大幅增加消化道及顱內嚴重出血風險，須核實是否有明確心臟科限期適應症。"
    clinician_action_prompt:
      en: "Audit indication and stop-date of dual/triple antithrombotic therapy (confirm cardiology PCI/ACS timeline); add PPI gastroprotection (avoid omeprazole with clopidogrel) and monitor Hb/bleeding symptoms."
    patient_safety_net:
      en: "Taking more than one blood-thinning medicine increases bleeding risk. Do not stop either tablet without doctor advice, and seek immediate emergency care for black tarry stools, vomiting blood, red/clotted urine, severe headache, or uncontrolled bleeding."
      zh_hk: "同時服用多於一種薄血藥會增加出血風險，切勿自行停藥；如出現黑便、吐血、血尿、劇烈頭痛或出血不止，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:digoxin_monitored_by_rft
    source_id: drug:digoxin
    relation: MONITORED_BY
    target_id: panel:rft
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 14
      repeat_interval_days: 180
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Digoxin is predominantly renally eliminated and hypokalaemia/hypomagnesaemia markedly sensitises the myocardium to digoxin toxicity; monitor RFT (Cr, eGFR, K+) at initiation and at least every 6 months (earlier after diuretic/renal changes)."
      zh_hk: "地高辛主要經腎臟排泄，腎功能下降或低血鉀極易引致地高辛中毒，須於起藥後兩週及至少每六個月監測腎功能及血鉀。"
    clinician_action_prompt:
      en: "Order RFT/K+ (plus serum digoxin level >=6h post-dose if toxicity, bradycardia, visual disturbance, nausea, or eGFR drop suspected)."
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:amiodarone_monitored_by_lft
    source_id: drug:amiodarone
    relation: MONITORED_BY
    target_id: panel:lft
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 90
      repeat_interval_days: 180
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Amiodarone causes asymptomatic transaminitis and rare severe hepatotoxicity; monitor LFTs at baseline, 3 months, and every 6 months on maintenance."
      zh_hk: "胺碘酮具肝毒性風險，須於基線、服藥後3個月及每6個月定期覆檢肝功能 (LFT)。"
    clinician_action_prompt:
      en: "Order/review LFT (ALT/AST); escalate to prescribing cardiologist if ALT >2-3x ULN or symptomatic hepatitis."
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:amiodarone_monitored_by_tsh
    source_id: drug:amiodarone
    relation: MONITORED_BY
    target_id: obs:tsh
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 90
      repeat_interval_days: 180
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Amiodarone's high iodine load induces hypothyroidism or thyrotoxicosis (AIT) in up to 15-20% of patients; check TSH (and FT4 if abnormal) at baseline, 3 months, every 6 months, and up to 12 months after cessation."
      zh_hk: "胺碘酮含高量碘質，容易誘發甲狀腺功能減退或亢進，須於基線、3個月及每6個月定期覆檢 TSH（異常時加驗 Free T4）。"
    clinician_action_prompt:
      en: "Order TSH (+ Free T4 if suppressed/elevated); do not abruptly stop amiodarone without cardiology input."
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:levothyroxine_monitored_by_tsh
    source_id: drug:levothyroxine
    relation: MONITORED_BY
    target_id: obs:tsh
    severity: moderate
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 42
      repeat_interval_days: 365
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Levothyroxine is essential no-gap therapy requiring TSH recheck 6-8 weeks after initiation or dose/brand adjustment, then annually once euthyroid (and every 4 weeks in early pregnancy) to avoid under-replacement or over-replacement AF/osteoporosis risk."
      zh_hk: "左甲狀腺素屬不可無故中斷的長期藥物，須於起藥或調藥後6至8週及穩定後每年覆檢 TSH（懷孕初期每4週覆檢），以防劑量不足或過量引致房顫及骨質疏鬆。"
    clinician_action_prompt:
      en: "Verify adherence, fasting administration (separated from iron/calcium/PPIs), and order TSH (plus FT4 if dose-titrating or symptomatic)."
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:insulin_hypoglycaemia_risk
    source_id: drug_class:insulin
    relation: EXPLAINS_OR_CAUSES
    target_id: cond:hypoglycaemia
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Insulin is a high-risk medication causing severe or nocturnal hypoglycaemia (<4.0 mmol/L), particularly after missed meals, alcohol, exercise, dosing mix-ups, or falling eGFR; recurrent hypos impair awareness and driving safety."
      zh_hk: "胰島素屬高危藥物，容易引致嚴重或夜間低血糖（<4.0 mmol/L），特別於漏餐、運動、飲酒或腎功能衰退時；反覆低血糖會減低警覺性並影響駕駛安全。"
    clinician_action_prompt:
      en: "Review glucose log/CGM, injection technique/sites, hypo frequency, driving fitness, and glucagon rescue plan; reduce dose promptly if recurrent <4.0 mmol/L (never omit basal insulin completely in T1DM)."
    patient_safety_net:
      en: "If your blood glucose drops below 4.0 mmol/L or you feel shaky, sweaty, dizzy, or confused, take fast-acting sugar straight away and recheck in 15 minutes. Seek emergency help immediately if someone becomes drowsy, confused, or cannot swallow safely."
      zh_hk: "如血糖低於 4.0 mmol/L 或出現手震、冒冷汗、頭暈心慌，請立即進食速效糖分並於15分鐘後覆測；如出現意識混亂、嗜睡或無法安全吞嚥，請立即致電緊急救援。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:sulfonylurea_hypoglycaemia_risk
    source_id: drug_class:sulfonylurea
    relation: EXPLAINS_OR_CAUSES
    target_id: cond:hypoglycaemia
    severity: high
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Sulfonylureas (e.g. gliclazide) cause prolonged, recurrent hypoglycaemia—especially in older adults >=75y, CKD (eGFR <45), irregular oral intake, or when combined with insulin/SGLT2i."
      zh_hk: "磺胺尿素類降糖藥（如格列齊特）可引致持久及反覆低血糖，長者、慢性腎病或進食不規律人士風險尤高。"
    clinician_action_prompt:
      en: "Review HbA1c target (de-intensify in frail older adults), check recent eGFR, and consider switching to lower-hypo-risk agent (DPP-4i/SGLT2i/GLP-1RA) if hypoglycaemia occurs."
    patient_safety_net:
      en: "Take sulfonylurea tablets with meals and check blood sugar if you feel sweaty, shaky, hungry, or dizzy. Because low blood sugar from these tablets can return, seek urgent medical review after any severe episode."
      zh_hk: "請隨餐服用降糖藥；如出現冒冷汗、手震、頭暈或異常飢餓請即測血糖並補充糖分。因此類藥物引致的低血糖可能反覆出現，嚴重低血糖後請盡快就醫評估。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:painless_haematuria_urologic_malignancy
    source_id: rf:painless_frank_haematuria
    relation: RED_FLAG_FOR
    target_id: cond:urologic_malignancy
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "Painless visible (macroscopic) haematuria carries a ~15-20% risk of urologic malignancy (bladder urothelial or renal cell carcinoma) — even a single self-resolving episode or in anticoagulated patients requires full urgent urology evaluation."
      zh_hk: "無痛肉眼血尿約有15至20%機會為泌尿系統惡性腫瘤（膀胱癌或腎癌），即使僅出現一次或正服用薄血藥，均須安排緊急泌尿科檢查（膀胱鏡及影像檢查）。"
    clinician_action_prompt:
      en: "Arrange urgent urology referral (flexible cystoscopy + upper-tract CT urogram/ultrasound), MSU culture, RFT/eGFR, CBC, and coagulation profile; never attribute frank haematuria solely to anticoagulants."
    patient_safety_net:
      en: "Visible blood in your urine without pain needs prompt medical investigation even if it stops on its own. Seek immediate emergency care if you pass large blood clots, cannot pass urine, or feel faint."
      zh_hk: "無痛肉眼血尿即使自行停止亦必須盡快由醫生安排專科檢查；如排出大塊血塊、無法排尿（尿瀦留）或頭暈虛弱，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:unilateral_calf_swelling_dvt_pe
    source_id: rf:unilateral_calf_swelling
    relation: RED_FLAG_FOR
    target_id: cond:dvt
    severity: critical
    urgency_floor: 3
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Acute unilateral calf/leg swelling, pain, warmth, or erythema indicates suspected deep vein thrombosis (DVT) with immediate risk of potentially fatal pulmonary embolism (PE)."
      zh_hk: "急性單側小腿或下肢腫脹、疼痛、發熱或發紅，須高度懷疑深層靜脈血栓 (DVT)，並有引發致命肺栓塞 (PE) 之風險。"
    clinician_action_prompt:
      en: "Same-day clinical assessment: calculate Wells DVT score, arrange urgent venous duplex Doppler ultrasound (or D-dimer if Wells unlikely), and screen immediately for PE symptoms (dyspnoea, pleuritic chest pain, haemoptysis, tachycardia)."
    patient_safety_net:
      en: "Swelling, pain, warmth, or redness in one calf or leg needs urgent same-day medical assessment. Seek immediate emergency hospital care if you also develop sudden shortness of breath, chest pain, coughing up blood, or fainting."
      zh_hk: "單側小腿或下肢突然腫脹、疼痛、發熱或發紅須於即日緊急求醫；如同時出現突發氣促、胸痛、咳血或暈厥，請立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:flank_pain_fever_pyelonephritis
    source_id: rf:flank_pain_fever
    relation: RED_FLAG_FOR
    target_id: cond:pyelonephritis
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Flank/loin pain with fever, rigors, or vomiting indicates acute pyelonephritis and risks urosepsis or obstructed infected calculus (a surgical/urological emergency requiring urgent decompression)."
      zh_hk: "腰側／腎區痛伴發燒、發冷打震或嘔吐，高度提示急性腎盂腎炎，須即時評估尿源性敗血症或結石梗阻合併感染（泌尿科急症）。"
    clinician_action_prompt:
      en: "Urgent same-day face-to-face or ED evaluation (check vitals/sepsis screen, MSU culture, RFT, CBC/CRP); transfer immediately to ED if haemodynamic instability, vomiting/unable to tolerate oral fluids, pregnancy, diabetes, or suspected obstructing stone. NEVER prescribe nitrofurantoin."
    patient_safety_net:
      en: "Back or side pain with fever, shivering, vomiting, or feeling very unwell requires immediate urgent medical or emergency hospital care."
      zh_hk: "如出現腰側背痛伴發燒、打冷震、嘔吐或極度不適，請立即前往急症室或接受緊急醫療評估。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: edge:orthopnoea_pnd_heart_failure
    source_id: rf:orthopnoea_pnd
    relation: RED_FLAG_FOR
    target_id: cond:heart_failure
    severity: critical
    urgency_floor: 3
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Orthopnoea, paroxysmal nocturnal dyspnoea, or rapidly worsening peripheral oedema/weight gain signals acute decompensated heart failure and impending acute pulmonary oedema."
      zh_hk: "端坐呼吸、夜間陣發性呼吸困難或短期內水腫及體重急升，屬急性失代償心臟衰竭及肺水腫警號。"
    clinician_action_prompt:
      en: "Arrange urgent same-day assessment (SpO2, RR, HR, BP, JVP, lung auscultation, ECG, BNP/NT-proBNP, CXR, RFT); immediate emergency transfer if SpO2 <94%, dyspnoea at rest, chest pain, or pink frothy sputum."
    patient_safety_net:
      en: "If you become breathless when lying flat, wake up gasping for air, cough up pink frothy sputum, or have chest pain or severe breathlessness at rest, seek emergency hospital care immediately."
      zh_hk: "如平躺時氣促加劇、半夜喘氣驚醒、咳出粉紅色泡沫痰，或靜止時嚴重氣促／胸痛，請立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

# ===========================================================================
# PRESENTATION FRAMES (5) — Murtagh PROMPT + openEHR Positive Exclusions + Safety Netting
# ===========================================================================
frames:
  - id: frame:palpitations
    rfe_concept_id: rfe:palpitations
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_af, concept_id: cond:atrial_fibrillation, prevalence_note: "Most common sustained clinically significant arrhythmia in primary care; check CHA2DS2-VA stroke risk" }
        - { id: p_anxiety, concept_id: cond:gad, key_discriminators: ["gradual onset sinus tachycardia", "stress/caffeine/sleep deprivation", "normal 12-lead ECG"] }
        - { id: p_drugs_stim, concept_id: cond:drug_adverse_effect, key_discriminators: ["caffeine, decongestants/pseudoephedrine, salbutamol, levothyroxine over-replacement, alcohol ('holiday heart')"] }
      serious_not_to_be_missed:
        - { id: s_acs, concept_id: cond:acs, key_discriminators: ["palpitations + chest pain/pressure, diaphoresis, ventricular arrhythmia risk"] }
        - { id: s_pe, concept_id: cond:pe, key_discriminators: ["sudden unexplained sinus tachycardia + dyspnoea/pleuritic pain/calf swelling"] }
        - { id: s_hf, concept_id: cond:heart_failure, key_discriminators: ["fast AF precipitating acute decompensation, orthopnoea, ankle oedema"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["fever + persistent tachycardia >=130/min + hypotension"] }
      pitfalls_often_missed:
        - { id: o_hyperthyroid, concept_id: cond:hyperthyroidism, key_discriminators: ["weight loss, heat intolerance, tremor, lid lag — ALWAYS check TSH"] }
        - { id: o_anaemia, concept_id: cond:anaemia, key_discriminators: ["exertional dyspnoea, pallor, fatigue — check CBC & ferritin"] }
        - { id: o_hypoglycaemia, concept_id: cond:hypoglycaemia, key_discriminators: ["adrenergic palpitations + sweating/tremor on insulin or sulfonylurea"] }
      masquerades:
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hyperthyroidism, clue_prompt: { en: "Check TSH (+/- Free T4) in every new presentation of palpitations or AF." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:anaemia, clue_prompt: { en: "Check FBC and electrolytes (K+/Mg2+) — anaemia and hypokalaemia are common reversible triggers." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Audit OTC cold/flu decongestants, caffeine/energy drinks, alcohol, beta-2 agonists, and thyroid hormone dose." } }
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Screen for panic disorder, generalised anxiety, and sleep deprivation after excluding cardiac arrhythmia." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of sudden cardiac death or stroke, smartwatch/wearable ECG alerts, and impact on exercise or work." }
    positive_exclusions:
      - id: ex_palp_chest_pain
        finding_concept_id: rf:chest_pain_cardiac
        question: { en: "Are your palpitations accompanied by any chest pain, pressure, tightness, or pain spreading to your arm, jaw, or back?", zh_hk: "請問心跳快或不規律時，有沒有同時出現胸痛、心口翳悶壓迫感，或痛楚伸延至手臂、下巴或背部？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_palp_syncope
        finding_concept_id: rf:syncope
        question: { en: "Have you fainted, blacked out, or felt close to passing out during the palpitations?", zh_hk: "請問心跳異常期間，有沒有試過暈倒、眼前一黑或差點昏厥？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_palp_dyspnoea
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Are you experiencing shortness of breath at rest, difficulty speaking full sentences, or severe dizziness?", zh_hk: "請問你有沒有在靜止時感到氣促、講唔到完整句子或嚴重頭暈？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_palp_emergency
        trigger_condition: { en: "Palpitations with chest pain, fainting/near-fainting, severe shortness of breath, or sustained very rapid heart rate (>=130/min at rest)", zh_hk: "心悸伴胸痛、暈厥／差點暈倒、嚴重氣促，或靜止時持續極速心跳（每分鐘130次或以上）" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if your racing or irregular heartbeat occurs with chest pain, fainting, severe dizziness, shortness of breath, or does not settle and stays very fast at rest."
          zh_hk: "如心跳加速或不規律伴隨胸痛、暈倒、嚴重頭暈、氣促，或靜止時持續極速跳動未能緩和，請立即前往急症室或致電緊急救援服務。"
      - id: sn_palp_gp_ecg
        trigger_condition: { en: "Recurrent episodes, irregular pulse, or wearable alert without emergency red flags", zh_hk: "反覆心悸、脈搏不規律或智能手錶提示心律異常（暫無急症警號）" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange a prompt doctor appointment for a resting 12-lead ECG and blood tests (thyroid, blood count, electrolytes), and note how long episodes last and any triggers."
          zh_hk: "請盡快預約醫生進行靜息心電圖及抽血檢查（甲狀腺、全血球及電解質），並記錄發作時間及誘因。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: frame:ankle_oedema
    rfe_concept_id: rfe:ankle_oedema
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_hf, concept_id: cond:heart_failure, key_discriminators: ["bilateral pitting oedema + exertional dyspnoea, orthopnoea, raised JVP, basal crackles"] }
        - { id: p_ccb_drug, concept_id: cond:drug_adverse_effect, key_discriminators: ["dose-dependent bilateral oedema after starting/increasing amlodipine/nifedipine, NSAIDs, steroids, pioglitazone"] }
        - { id: p_ckd, concept_id: cond:ckd, key_discriminators: ["frothy urine/nephrotic albuminuria, hypertension, raised creatinine/low eGFR"] }
      serious_not_to_be_missed:
        - { id: s_dvt, concept_id: cond:dvt, key_discriminators: ["UNILATERAL calf/leg swelling, warmth, tenderness, recent immobility/flight/surgery/cancer"] }
        - { id: s_pe, concept_id: cond:pe, key_discriminators: ["leg swelling + acute dyspnoea/pleuritic chest pain/hypoxia"] }
        - { id: s_decompensated_hf, concept_id: cond:heart_failure, key_discriminators: ["rapid weight gain >=2 kg in 2-3 days, orthopnoea, PND, hypoxia"] }
        - { id: s_cellulitis, concept_id: cond:cellulitis, key_discriminators: ["unilateral hot spreading erythema + tenderness + fever"] }
      pitfalls_often_missed:
        - { id: o_hypothyroid, concept_id: cond:hypothyroidism, key_discriminators: ["non-pitting pretibial/generalised myxoedema + fatigue/cold intolerance"] }
        - { id: o_pelvic_mass, concept_id: cond:malignancy_occult, key_discriminators: ["new asymmetric/bilateral venous compression oedema from pelvic/abdominal mass"] }
      masquerades:
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Always check medication list first: dihydropyridine CCBs (amlodipine/nifedipine), NSAIDs, corticosteroids, and pregabalin/gabapentin." } }
        - { id: mq_ckd, tier: primary, masquerade: ckd, concept_id: cond:ckd, clue_prompt: { en: "Check RFT/eGFR, serum albumin, and urine ACR to exclude nephrotic syndrome or CKD fluid overload." } }
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Check TSH if oedema is non-pitting or accompanied by fatigue and weight gain." } }
      patient_hidden_agenda_prompts:
        - { en: "Ask about recent long-haul flights, new blood pressure pills or painkillers, dietary salt intake, and whether the swelling is affecting mobility or shoes." }
    positive_exclusions:
      - id: ex_oedema_unilateral_dvt
        finding_concept_id: rf:unilateral_calf_swelling
        question: { en: "Is the swelling mainly in ONE leg or calf, or is one calf painful, tender, warm, or red?", zh_hk: "請問水腫是否主要集中於單邊小腿或一隻腳，或者單側小腿出現疼痛、壓痛、發熱或發紅？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_oedema_orthopnoea
        finding_concept_id: rf:orthopnoea_pnd
        question: { en: "Do you get short of breath when lying flat, need extra pillows to sleep, or wake up at night gasping for air?", zh_hk: "請問你平躺時會否氣促、需要墊高幾個枕頭才能入睡，或半夜喘氣驚醒？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_oedema_dyspnoea_chest
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Are you having sudden shortness of breath at rest, chest pain, or coughing up blood or pink frothy sputum?", zh_hk: "請問你有沒有靜止時突發氣促、胸痛、咳血或咳出粉紅色泡沫痰？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_oedema_emergency
        trigger_condition: { en: "Sudden shortness of breath, chest pain, coughing blood/pink frothy sputum, severe breathlessness lying flat, or fainting", zh_hk: "突發氣促、胸痛、咳血或粉紅色泡沫痰、平躺嚴重氣促或暈厥" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if leg or ankle swelling is accompanied by sudden shortness of breath, chest pain, difficulty breathing when lying flat, coughing up blood, or fainting."
          zh_hk: "如腳腫伴隨突發氣促、胸痛、平躺嚴重呼吸困難、咳血或暈倒，請立即前往急症室或致電緊急救援服務。"
      - id: sn_oedema_same_day_dvt
        trigger_condition: { en: "One-sided painful/red/warm calf swelling or rapid weight gain (>=2 kg over 2-3 days) in heart/kidney disease", zh_hk: "單側小腿紅腫熱痛，或心臟／腎病患者短期內體重急升（2至3日內增加2公斤或以上）" }
        timeframe_hours: 24
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange same-day medical assessment if only one leg is swollen, painful, warm, or red, or if you have heart/kidney disease and your weight rises rapidly over a few days."
          zh_hk: "如僅單側下肢腫痛發熱，或心臟／腎病患者數日內體重急升、水腫迅速惡化，請安排即日醫生評估。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: frame:dysuria_frequency
    rfe_concept_id: rfe:dysuria_frequency
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_uti, concept_id: cond:uti, prevalence_note: "Uncomplicated acute cystitis (~80% in non-pregnant women); verify dipstick/MSU if atypical, recurrent, male, or pregnant" }
        - { id: p_bph, concept_id: cond:bph, key_discriminators: ["older male", "hesitancy, weak stream, nocturia, incomplete emptying"] }
        - { id: p_sti, concept_id: cond:chlamydia_sti, key_discriminators: ["young sexually active adult", "dysuria + urethral/vaginal discharge", "sterile pyuria"] }
      serious_not_to_be_missed:
        - { id: s_pyelonephritis, concept_id: cond:pyelonephritis, key_discriminators: ["fever >=38.0 C, rigors, flank/loin pain, nausea/vomiting"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["urosepsis in elderly/diabetic/catheterised host: confusion, hypotension, tachypnoea"] }
        - { id: s_urologic_ca, concept_id: cond:urologic_malignancy, key_discriminators: ["persistent irritative LUTS / painless haematuria / smoking history"] }
        - { id: s_cauda_equina, concept_id: cond:cauda_equina, key_discriminators: ["acute urinary retention or overflow incontinence + back pain + saddle numbness"] }
      pitfalls_often_missed:
        - { id: o_renal_colic, concept_id: cond:renal_colic, key_discriminators: ["distal ureteric stone causing frequency/urgency + colicky loin-to-groin pain + microscopic haematuria"] }
        - { id: o_pregnancy_uti, concept_id: cond:pregnancy_normal, key_discriminators: ["UTI in pregnancy ALWAYS requires MSU culture and pregnancy-safe antibiotic (avoid trimethoprim T1 and nitrofurantoin at term)"] }
        - { id: o_sglt2_candida, concept_id: cond:vulvovaginal_candidiasis, key_discriminators: ["external dysuria/vulvovaginal itch in SGLT2 inhibitor user"] }
      masquerades:
        - { id: mq_diabetes, tier: primary, masquerade: diabetes, concept_id: cond:t2dm, clue_prompt: { en: "Recurrent UTIs or frequency/nocturia can be the first sign of undiagnosed diabetes mellitus — check urine/blood glucose." } }
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:urologic_malignancy, clue_prompt: { en: "Persistent 'recurrent UTI' with negative cultures or persistent haematuria in adults >=45y requires cystoscopy." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check SGLT2 inhibitors (glycosuria/genital mycotic infections), diuretics, and anticholinergics (urinary retention)." } }
      patient_hidden_agenda_prompts:
        - { en: "Ask sensitively about STI exposure, pregnancy possibility, recurrent self-medication with leftover antibiotics, and G6PD status before choosing UTI antimicrobials." }
    positive_exclusions:
      - id: ex_dysuria_flank_fever
        finding_concept_id: rf:flank_pain_fever
        question: { en: "Do you have fever, chills/shivering, pain in your lower back or side (flank), or nausea and vomiting?", zh_hk: "請問你有沒有發燒、發冷打震、腰側／腎區痛，或噁心嘔吐？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_dysuria_frank_blood
        finding_concept_id: rf:painless_frank_haematuria
        question: { en: "Are you passing visible red blood or blood clots in your urine, or having difficulty passing urine at all?", zh_hk: "請問小便有沒有明顯鮮血或血塊，或出現完全無法排尿的情況？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_dysuria_confusion
        finding_concept_id: rf:confusion
        question: { en: "Has there been any new confusion, drowsiness, extreme weakness, or fainting (especially in an older adult)?", zh_hk: "請問有沒有新出現的意識混亂、嗜睡、極度虛弱或頭暈昏厥（尤其長者）？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_dysuria_emergency
        trigger_condition: { en: "High fever/rigors, worsening flank/back pain, inability to keep fluids down, inability to pass urine, or new confusion/dizziness", zh_hk: "高燒發冷打震、腰側劇痛加劇、無法進食飲水、無法排尿，或出現意識混亂／頭暈虛弱" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if you develop fever or shivering, back or side pain, vomiting, inability to pass urine, confusion, or feel faint."
          zh_hk: "如出現發燒打冷震、腰側或背痛、持續嘔吐、無法排尿、意識混亂或頭暈虛弱，請立即前往急症室。"
      - id: sn_dysuria_review
        trigger_condition: { en: "Symptoms not improving after 48 hours of treatment, pregnancy, male UTI, or recurrent episodes", zh_hk: "接受治療48小時後徵狀未見改善、懷孕期尿道炎、男性尿道炎或反覆復發" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Contact your doctor for prompt review and urine culture follow-up if symptoms do not start improving within 48 hours, or if you are pregnant or notice blood in your urine."
          zh_hk: "如徵狀於48小時內未見改善，或屬懷孕期間或小便帶血，請盡快聯絡醫生覆診及跟進尿液細菌培養報告。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: frame:haematuria
    rfe_concept_id: rfe:haematuria
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_uti_haem, concept_id: cond:uti, key_discriminators: ["haemorrhagic cystitis with acute dysuria/frequency; MUST recheck urine after clearance to confirm resolution"] }
        - { id: p_stone, concept_id: cond:renal_colic, key_discriminators: ["colicky loin-to-groin pain", "restless patient", "prior stone history"] }
        - { id: p_bph_bleed, concept_id: cond:bph, key_discriminators: ["diagnosis of exclusion in older men ONLY after urologic malignancy excluded"] }
      serious_not_to_be_missed:
        - { id: s_urologic_ca, concept_id: cond:urologic_malignancy, key_discriminators: ["painless visible haematuria, age >=45y, smoking/occupational exposure, clots — urgent cystoscopy + imaging"] }
        - { id: s_pyelonephritis, concept_id: cond:pyelonephritis, key_discriminators: ["fever, rigors, loin tenderness"] }
        - { id: s_ckd_gn, concept_id: cond:ckd, key_discriminators: ["glomerulonephritis: tea-coloured urine, proteinuria/uACR++, hypertension, oedema, raised creatinine, dysmorphic RBCs"] }
      pitfalls_often_missed:
        - { id: o_anticoag_trap, concept_id: cond:drug_adverse_effect, key_discriminators: ["anticoagulants/antiplatelets UNMASK occult urologic malignancy — NEVER dismiss haematuria as 'just from warfarin/DOAC'; also check INR"] }
        - { id: o_pseudo_haem, concept_id: cond:heavy_menstrual_bleeding, key_discriminators: ["menstrual/postmenopausal vaginal contamination — verify with microscopy"] }
      masquerades:
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:urologic_malignancy, clue_prompt: { en: "Any painless visible haematuria requires fast-track urology referral (cystoscopy + upper-tract imaging) regardless of anticoagulant status." } }
        - { id: mq_ckd, tier: primary, masquerade: ckd, concept_id: cond:ckd, clue_prompt: { en: "Check BP, RFT/eGFR, and uACR to detect IgA nephropathy or acute glomerulonephritis (common in East Asian young adults)." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check INR if on warfarin, review DOACs/antiplatelets/NSAIDs, and exclude benign discolouration (rifampicin, beetroot) by urine microscopy." } }
      patient_hidden_agenda_prompts:
        - { en: "Directly acknowledge fear of cancer and explain the structured workup (urine microscopy/culture, kidney function, imaging, and urology review) clearly." }
    positive_exclusions:
      - id: ex_haem_painless_frank
        finding_concept_id: rf:painless_frank_haematuria
        question: { en: "Can you visibly see red/pink blood or blood clots in your urine without burning or pain?", zh_hk: "請問你是否肉眼可見小便呈鮮紅、粉紅色或帶有血塊，而且排尿時並不痛楚？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_haem_flank_fever
        finding_concept_id: rf:flank_pain_fever
        question: { en: "Do you have fever, chills, severe flank/loin pain, or vomiting?", zh_hk: "請問你有沒有同時發燒、發冷、劇烈腰側痛或嘔吐？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_haem_syncope
        finding_concept_id: rf:syncope
        question: { en: "Have you felt faint, dizzy, very weak, or been unable to pass urine because of clots?", zh_hk: "請問你有沒有感到頭暈昏厥、極度虛弱，或因血塊阻塞而無法排尿？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_haem_emergency
        trigger_condition: { en: "Heavy bleeding with clots, inability to pass urine (clot retention), severe flank pain with fever, or dizziness/fainting", zh_hk: "大量血尿伴血塊、無法排尿（血塊尿瀦留）、劇烈腰痛伴發燒，或頭暈昏厥" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if you pass large blood clots, cannot pass urine, develop fever with severe side/back pain, or feel faint or light-headed."
          zh_hk: "如排出大塊血塊、無法排尿、發燒伴劇烈腰側痛，或感到頭暈眼前發黑，請立即前往急症室。"
      - id: sn_haem_urgent_workup
        trigger_condition: { en: "Any visible blood in urine (even a single episode that stops) or persistent blood on urine tests", zh_hk: "任何肉眼血尿（即使只出現一次並自行停止）或覆檢持續發現隱血" }
        timeframe_hours: 72
        escalation_channel: urgent_clinic_callback
        patient_instruction:
          en: "Even if visible blood in your urine clears up on its own, arrange a prompt doctor appointment for urine, blood, and scan/urology assessment — do not ignore a single episode."
          zh_hk: "即使肉眼血尿自行消退，亦請務必盡快預約醫生進行尿液、抽血及影像／泌尿科檢查，切勿忽視單次血尿。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: frame:polyuria_polydipsia
    rfe_concept_id: rfe:polyuria_polydipsia
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_t2dm, concept_id: cond:t2dm, prevalence_note: "Most common cause of new osmotic polyuria/polydipsia in adults (check POC glucose, HbA1c, fasting glucose)" }
        - { id: p_t1dm, concept_id: cond:t1dm, key_discriminators: ["child/young adult (or LADA in older adult)", "rapid weight loss, fatigue, ketonuria/ketonaemia — NEVER delay same-day blood glucose + ketones"] }
        - { id: p_diuretic_sglt2, concept_id: cond:drug_adverse_effect, key_discriminators: ["recent start of loop/thiazide diuretic, SGLT2 inhibitor, or lithium (nephrogenic diabetes insipidus)"] }
      serious_not_to_be_missed:
        - { id: s_dka, concept_id: cond:dka, key_discriminators: ["abdominal pain, nausea/vomiting, Kussmaul deep rapid breathing, drowsiness, blood ketones >=1.5-3.0 mmol/L (note: eDKA on SGLT2i can occur with glucose <11 mmol/L!)"] }
        - { id: s_hypercalcaemia, concept_id: cond:malignancy_occult, key_discriminators: ["hypercalcaemia (malignancy / primary hyperparathyroidism) causing polyuria, constipation, bone pain, confusion — check serum calcium"] }
        - { id: s_ckd, concept_id: cond:ckd, key_discriminators: ["impaired concentrating ability, nocturia, anaemia, hypertension"] }
      pitfalls_often_missed:
        - { id: o_prediabetes, concept_id: cond:prediabetes, key_discriminators: ["subtle nocturia/fatigue with borderline fasting glucose 6.1-6.9 or HbA1c 6.0-6.4%"] }
        - { id: o_lithium_di, concept_id: cond:drug_adverse_effect, key_discriminators: ["lithium-induced nephrogenic diabetes insipidus — check Na+, serum/urine osmolality, lithium level"] }
      masquerades:
        - { id: mq_diabetes, tier: primary, masquerade: diabetes, concept_id: cond:t2dm, clue_prompt: { en: "Perform immediate point-of-care capillary glucose AND blood/urine ketones in anyone presenting with polyuria, polydipsia, and weight loss." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review diuretics, SGLT2 inhibitors, oral corticosteroids (steroid-induced hyperglycaemia), and lithium." } }
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Check corrected calcium + PTH if glucose is normal (hypercalcaemia of malignancy or hyperparathyroidism)." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of needing insulin injections, family history of diabetes complications, or concerns about unintended weight loss." }
    positive_exclusions:
      - id: ex_poly_confusion_dka
        finding_concept_id: rf:confusion
        question: { en: "Are you feeling drowsy, confused, nauseous/vomiting, or having tummy pain or deep fast breathing?", zh_hk: "請問你有沒有感到嗜睡、意識混亂、噁心嘔吐、腹痛或呼吸又深又急？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_poly_weight_loss
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you lost weight rapidly without trying over the past few weeks?", zh_hk: "請問你近幾星期有沒有在沒有刻意減肥的情況下體重急劇下降？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_poly_dyspnoea
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Are you experiencing fast laboured breathing, extreme weakness, or feeling faint?", zh_hk: "請問你有沒有呼吸急促費力、極度乏力或頭暈欲暈？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_poly_dka_emergency
        trigger_condition: { en: "Vomiting, tummy pain, fast deep breathing, fruity breath, drowsiness/confusion, or very high blood glucose (>=15 mmol/L) with ketones", zh_hk: "嘔吐、腹痛、呼吸急促深長、口氣帶果香味、嗜睡／意識混亂，或血糖極高（>=15 mmol/L）伴酮體升高" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if excessive thirst and urination are accompanied by vomiting, tummy pain, fast deep breathing, drowsiness, confusion, or high ketones."
          zh_hk: "如多尿口渴伴隨嘔吐、腹痛、呼吸急促深長、嗜睡、意識混亂或酮體偏高，請立即前往急症室或致電緊急救援服務。"
      - id: sn_poly_same_day
        trigger_condition: { en: "Rapid weight loss with extreme thirst/urination (especially in children or young adults) to exclude new Type 1 diabetes", zh_hk: "極度口渴多尿伴體重急降（尤其兒童或年輕人），須即日排除新發一型糖尿病" }
        timeframe_hours: 24
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange same-day medical assessment for a finger-prick blood glucose and ketone test, especially if a child or young adult has new extreme thirst, frequent urination, and weight loss."
          zh_hk: "如出現突發極度口渴、多尿及體重下降（尤其兒童或年輕人），請安排即日由醫生檢測血糖及酮體。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

# ===========================================================================
# OBSERVATION RULES (8) — LOINC + UCUM + Intervals + Bands + Templates
# Critical thresholds strictly aligned with backend/safety/kernel.py:THRESHOLDS
# ===========================================================================
observation_rules:
  - id: obs_rule:fasting_glucose
    observation_concept_id: obs:fasting_glucose
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    reference_intervals:
      - { id: ri_adult_fasting, low: 3.9, high: 5.5, priority: 0, source_note: "Normal fasting plasma glucose <5.6 mmol/L (ADA/WHO); IFG 5.6-6.9 or 6.1-6.9; DM >=7.0" }
    severity_bands:
      significant: { ge: 7.0 }
      urgent: { ge: 11.1 }
      critical: { lt: 4.0, ge: 15.0 }
    direction_templates:
      L:
        working_problem: { en: "hypoglycaemia (<4.0 mmol/L — '4 is the floor')", zh_hk: "低血糖（<4.0 mmol/L）" }
        plan_template:
          en: "Treat immediately if <4.0 mmol/L with fast-acting carbohydrate (emergency escalation if <3.0 mmol/L or neuroglycopenia); review insulin/sulfonylurea dosing, renal function, meals, and alcohol."
        relevant_med_class_ids: ["drug_class:insulin", "drug_class:sulfonylurea"]
      H:
        working_problem: { en: "hyperglycaemia / diabetes range fasting glucose", zh_hk: "空腹高血糖／糖尿病範圍" }
        plan_template:
          en: "If >=15.0 mmol/L or symptomatic, check blood/urine ketones immediately to exclude DKA/HHS; otherwise confirm diabetes with repeat FPG/HbA1c or OGTT and review glycaemic regimen."
        relevant_med_class_ids: ["drug_class:biguanide", "drug_class:sglt2_inhibitor", "drug_class:dpp4_inhibitor", "drug_class:glp1_ra", "drug_class:insulin", "drug_class:sulfonylurea"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:ldl
    observation_concept_id: obs:ldl
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    reference_intervals:
      - { id: ri_general_adult, low: null, high: 3.0, priority: 0, source_note: "Individualise target by absolute CVD risk (<1.4-1.8 mmol/L secondary prevention/very high risk; <2.6 high risk)" }
    severity_bands:
      significant: { ge: 4.1 }
      urgent: { ge: 4.9 }
    direction_templates:
      H:
        working_problem: { en: "elevated LDL cholesterol / hyperlipidaemia", zh_hk: "低密度脂蛋白膽固醇偏高（高血脂）" }
        plan_template:
          en: "Calculate absolute CVD risk, exclude secondary causes (hypothyroidism, nephrotic syndrome, cholestasis), and if LDL >=4.9 mmol/L evaluate Familial Hypercholesterolaemia (Dutch Lipid Clinic Network score); review statin intensity and adherence."
        relevant_med_class_ids: ["drug_class:statin"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:triglycerides
    observation_concept_id: obs:triglycerides
    canonical_ucum: "mmol/L"
    display_ucum: "mmol/L"
    reference_intervals:
      - { id: ri_fasting_adult, low: null, high: 1.7, priority: 0 }
    severity_bands:
      significant: { ge: 2.3 }
      urgent: { ge: 5.6 }
      critical: { ge: 10.0 }
    direction_templates:
      H:
        working_problem: { en: "hypertriglyceridaemia", zh_hk: "三酸甘油酯過高" }
        plan_template:
          en: "Confirm fasting status; screen alcohol, poorly controlled T2DM/HbA1c, obesity/MASLD, hypothyroidism, and culprit drugs (oral oestrogen, steroids); if >=10.0 mmol/L URGENT acute pancreatitis prevention (strict low-fat diet, zero alcohol, fibrate/specialist review)."
        relevant_med_class_ids: ["drug_class:statin", "drug_class:hormonal_contraception", "drug_class:oral_corticosteroid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:uacr
    observation_concept_id: obs:uacr
    canonical_ucum: "mg/mmol{creat}"
    display_ucum: "mg/mmol{creat}"
    reference_intervals:
      - { id: ri_kdigo_a1, low: null, high: 2.9, priority: 0, source_note: "KDIGO A1 <3.0; A2 moderately increased 3.0-30; A3 severely increased >30 mg/mmol" }
    severity_bands:
      significant: { ge: 3.0 }
      urgent: { ge: 30.0 }
      critical: { ge: 220.0 }
    direction_templates:
      H:
        working_problem: { en: "albuminuria (KDIGO A2/A3 kidney injury marker)", zh_hk: "蛋白尿／白蛋白尿（腎臟受損指標）" }
        plan_template:
          en: "Exclude transient causes (UTI, fever, heavy exercise, menstruation) and confirm persistence with 2 of 3 early-morning uACR samples over 3 months; optimise BP, ACEi/ARB, and SGLT2i; if >=30 (especially >=220 nephrotic range) or haematuria present, arrange nephrology review."
        relevant_med_class_ids: ["drug_class:raas_agent", "drug_class:sglt2_inhibitor", "drug_class:nsaid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:free_t4
    observation_concept_id: obs:free_t4
    canonical_ucum: "pmol/L"
    display_ucum: "pmol/L"
    reference_intervals:
      - { id: ri_adult_default, low: 11.0, high: 22.0, priority: 0, source_note: "Typical adult SI interval (verify local laboratory assay range alongside TSH)" }
    severity_bands:
      significant: { lt: 10.0, gt: 24.0 }
      urgent: { lt: 7.0, gt: 40.0 }
      critical: { lt: 5.0, gt: 60.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated Free T4 (thyrotoxicosis / over-replacement)", zh_hk: "游離甲狀腺素偏高（甲亢或劑量過高）" }
        plan_template:
          en: "Correlate with TSH (suppressed in primary hyperthyroidism) and screen thyroid storm red flags (fever, HR >=130, AF, agitation/confusion); order TRAb/TPO antibodies and check levothyroxine or amiodarone use."
        relevant_med_class_ids: ["drug_class:thyroid_hormone", "drug_class:antithyroid", "drug_class:beta_blocker"]
      L:
        working_problem: { en: "low Free T4 (overt hypothyroidism / over-suppression)", zh_hk: "游離甲狀腺素偏低（甲減）" }
        plan_template:
          en: "Correlate with TSH (high in primary hypothyroidism; low/normal suggests central pituitary cause or non-thyroidal illness); assess levothyroxine adherence or carbimazole over-treatment; screen myxoedema coma if severe drowsiness/hypothermia."
        relevant_med_class_ids: ["drug_class:thyroid_hormone", "drug_class:antithyroid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:psa
    observation_concept_id: obs:psa
    canonical_ucum: "ug/L"
    display_ucum: "ug/L"
    reference_intervals:
      - { id: ri_male_default, low: null, high: 3.0, priority: 0, source_note: "Age-adjusted upper limits vary by guideline (commonly >3.0 ug/L triggers repeat/evaluation in 50-69y)" }
      - { id: ri_male_70plus, low: null, high: 5.0, priority: 10, when: { fact: age_years, op: ge, value: 70 }, source_note: "Higher age-adjusted threshold in men >=70y; individualise by life expectancy" }
    severity_bands:
      significant: { gt: 3.0 }
      urgent: { gt: 10.0 }
      critical: { gt: 20.0 }
    trend_rules:
      - id: tr_psa_rapid_rise
        direction: rise
        delta_abs: 0.75
        window_days: 365
        urgency_floor: 2
        clinician_rationale:
          en: "PSA velocity >=0.75 ug/L/year or doubling — exclude UTI/prostatitis and arrange urology assessment (multiparametric MRI / biopsy decision)."
    direction_templates:
      H:
        working_problem: { en: "raised prostate-specific antigen (PSA)", zh_hk: "前列腺特異抗原 (PSA) 偏高" }
        plan_template:
          en: "Exclude transient confounders (active UTI, acute prostatitis, urinary retention, catheterisation, ejaculation/vigorous cycling within 48h); repeat PSA (+ free/total ratio) in 1-3 months if mild, or arrange prompt urology/mpMRI referral if persistently elevated, abnormal DRE, >10 ug/L, or bony pain."
        relevant_med_class_ids: ["drug_class:alpha_blocker"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:heart_rate
    observation_concept_id: obs:heart_rate
    canonical_ucum: "/min"
    display_ucum: "/min"
    reference_intervals:
      - { id: ri_adult_resting, low: 60.0, high: 100.0, priority: 0 }
    severity_bands:
      significant: { lt: 50.0, ge: 100.0 }
      urgent: { lt: 45.0, ge: 115.0 }
      critical: { lt: 40.0, ge: 130.0 }
    direction_templates:
      H:
        working_problem: { en: "tachycardia (critical >=130/min)", zh_hk: "心動過速（危急 >=130次/分）" }
        plan_template:
          en: "Immediate 12-lead ECG and haemodynamic/sepsis/PE/thyrotoxicosis assessment; HR >=130/min triggers emergency floor (matches safety kernel THRESHOLDS.hr_emergency_gte)."
        relevant_med_class_ids: ["drug_class:beta_blocker", "drug_class:saba_bronchodilator", "drug_class:thyroid_hormone"]
      L:
        working_problem: { en: "bradycardia (critical <40/min)", zh_hk: "心搏過緩（危急 <40次/分）" }
        plan_template:
          en: "Assess symptoms (syncope, hypotension, chest pain, confusion) and perform urgent 12-lead ECG to exclude high-grade AV block; review beta-blockers, digoxin, amiodarone, rate-limiting CCBs, and hyperkalaemia."
        relevant_med_class_ids: ["drug_class:beta_blocker"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

  - id: obs_rule:diastolic_bp
    observation_concept_id: obs:diastolic_bp
    canonical_ucum: "mm[Hg]"
    display_ucum: "mm[Hg]"
    reference_intervals:
      - { id: ri_adult, low: 60.0, high: 89.0, priority: 0 }
    severity_bands:
      significant: { ge: 90.0 }
      urgent: { ge: 100.0 }
      critical: { ge: 110.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated diastolic BP / hypertensive crisis (>=110 mmHg)", zh_hk: "舒張壓偏高／高血壓危象（>=110 mmHg）" }
        plan_template:
          en: "Repeat BP after 5 min rest; if DBP >=110 mmHg (matches safety kernel THRESHOLDS.dbp_hypertensive_gte) immediately screen for acute target-organ damage (chest pain, dyspnoea, focal neuro deficit, severe headache/visual change, AKI) to exclude hypertensive emergency; otherwise arrange prompt titration/ABPM."
        relevant_med_class_ids: ["drug_class:raas_agent", "drug_class:ccb", "drug_class:diuretic", "drug_class:beta_blocker"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

