    drug_facet:
      pregnancy_caution: "contraindicated"
      dosing_pearl:
        en: "Gradual titration minimises GI side effects; stop >=2 months before planned pregnancy; evaluate severe persistent abdominal pain (pancreatitis/gallbladder) and peri-procedural aspiration risk."
        zh_hk: "須按醫生指示逐步加量以減少腸胃不適；計劃懷孕前至少2個月停藥；如出現持續劇烈腹痛須盡快求醫排除胰臟炎或膽囊問題。"
