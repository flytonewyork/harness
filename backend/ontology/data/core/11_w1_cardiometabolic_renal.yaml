        en: "Use modified-release formulations only for chronic hypertension (avoid immediate-release sublingual nifedipine due to precipitous hypotension/ischaemia); brand/release-profile consistent; pregnancy-compatible option."
        zh_hk: "慢性高血壓僅應使用緩釋劑（避免即釋舌下含服引致血壓驟降）；懷孕期高血壓可用選項之一。"
