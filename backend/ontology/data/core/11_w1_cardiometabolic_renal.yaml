    drug_facet:
      high_risk: true
      no_gap: true
      dosing_pearl:
        en: "Always verify concentration (100 units/mL vs 300 units/mL — not interchangeable unit-for-unit without dose review); never omit basal insulin entirely in T1DM during sick days (DKA risk)."
        zh_hk: "處方及核對時必須確認濃度（100單位/毫升與300單位/毫升不可隨意互換）；一型糖尿病患病期間切勿完全停打基礎胰島素，以免誘發酮症酸中毒。"
    provenance: { author: "ontology_pod_w1_a", review_status: "draft" }

