# ===========================================================================
# DETERMINISTIC CLINICAL EDGES (14)
# ===========================================================================
edges:
  - id: edge:ectopic_rupture_emergency
    source_id: rf:ectopic_rupture_signs
    relation: RED_FLAG_FOR
    target_id: cond:ectopic_pregnancy
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Unilateral pelvic pain with syncope, hypotension, or shoulder-tip pain in any reproductive-age woman indicates potential ruptured ectopic pregnancy with intra-abdominal haemorrhage."
      zh_hk: "育齡女性出現單側下腹劇痛伴暈厥、低血壓或肩尖痛，須高度懷疑子宮外孕破裂及腹腔內出血。"
    clinician_action_prompt:
      en: "Immediate emergency transfer to hospital ED/early pregnancy emergency unit; check urine/serum beta-hCG and vital signs without delaying transfer."
    patient_safety_net:
      en: "Severe one-sided lower tummy pain, dizziness, fainting, or shoulder-tip pain when pregnancy is possible needs immediate emergency hospital assessment. Call emergency services now."
      zh_hk: "如可能懷孕並出現單側下腹劇痛、頭暈昏厥或肩尖痛，須立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:preeclampsia_obstetric_emergency
    source_id: rf:preeclampsia_signs
    relation: RED_FLAG_FOR
    target_id: cond:preeclampsia
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    when:
      fact: pregnant
      op: eq
      value: true
    clinician_rationale:
      en: "Severe headache, visual scotomata/flashes, epigastric/RUQ pain, or sudden oedema in pregnancy (>=20 weeks) signals severe pre-eclampsia / HELLP / imminent eclampsia."
      zh_hk: "懷孕20週後出現劇烈頭痛、視力異常、上腹痛或突發水腫，屬嚴重妊娠毒血症／HELLP綜合症警號。"
    clinician_action_prompt:
      en: "Immediate same-day obstetric emergency referral / ED transfer; check BP (>=140/90 or >=160/110), urine protein/PCR, platelets, ALT, creatinine."
    patient_safety_net:
      en: "If you are pregnant and develop a severe headache, flashing lights or blurred vision, upper tummy pain, or sudden swelling of your face or hands, go to emergency hospital care immediately."
      zh_hk: "懷孕期間如出現劇烈頭痛、視力模糊或閃光、上腹痛，或面部及手部突發水腫，請立即前往急症室或產科急症評估。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:postmenopausal_bleeding_endometrial
    source_id: rf:postmenopausal_bleeding
    relation: RED_FLAG_FOR
    target_id: cond:endometrial_cancer
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "Any postmenopausal vaginal bleeding (>=12 months amenorrhoea) carries ~5-10% risk of endometrial carcinoma and requires urgent gynaecological workup."
      zh_hk: "收經滿12個月後出現任何陰道出血，約有5至10%機會為子宮內膜癌，必須作緊急婦科檢查排除惡性病變。"
    clinician_action_prompt:
      en: "Arrange urgent transvaginal pelvic ultrasound (endometrial thickness) and fast-track gynaecology referral for endometrial sampling/hysteroscopy."
    patient_safety_net:
      en: "Any bleeding or spotting after menopause should be assessed urgently by a doctor; if bleeding becomes heavy or you feel faint, seek immediate emergency care."
      zh_hk: "收經後出現任何陰道出血或血絲均須盡快由醫生評估及跟進；如出血量大增或感到頭暈，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:dengue_nsaid_haemorrhage_ci
    source_id: drug_class:nsaid
    relation: CONTRAINDICATED_IN
    target_id: cond:dengue
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Systemic NSAIDs and aspirin are contraindicated in suspected or confirmed dengue fever due to platelet dysfunction, GI haemorrhage, and Reye syndrome risk."
      zh_hk: "懷疑或確診登革熱時嚴禁使用非類固醇消炎止痛藥 (NSAID) 及阿士匹靈，以免加劇血小板功能障礙及嚴重出血風險。"
    clinician_action_prompt:
      en: "Hard-block NSAID/aspirin; use paracetamol within weight/daily limits only; monitor serial CBC (platelets/haematocrit) and dengue warning signs."
    patient_safety_net:
      en: "Do not take ibuprofen, aspirin, or anti-inflammatory painkillers while dengue is possible. Seek immediate emergency care for persistent vomiting, severe tummy pain, bleeding gums/nose, or drowsiness."
      zh_hk: "懷疑登革熱期間切勿服用布洛芬、阿士匹靈或其他消炎止痛藥。如出現持續嘔吐、劇烈腹痛、牙齦或鼻出血，或嗜睡，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:coc_age35_thrombosis_caution
    source_id: drug:combined_oral_contraceptive
    relation: RED_FLAG_FOR
    target_id: cond:pe
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    when:
      fact: age_years
      op: ge
      value: 35
    clinician_rationale:
      en: "Oestrogen-containing combined oral contraceptives carry elevated venous thromboembolism (VTE/PE) and arterial thrombosis risk in age >=35y — contraindicated (MEC 4) if smoking >=15/day, migraine with aura, uncontrolled HTN, or prior VTE."
      zh_hk: "35歲或以上女性服用含雌激素混合避孕丸，靜脈血栓（肺栓塞）及動脈血栓風險上升；如有吸煙、先兆偏頭痛、血壓未受控或血栓史則屬禁忌。"
    clinician_action_prompt:
      en: "Verify smoking status, BP, BMI, migraine with aura, and personal/family VTE history before prescribing or renewing COC; discuss progestogen-only or LARC alternatives if MEC 3/4."
    patient_safety_net:
      en: "Seek urgent medical care if you develop sudden leg swelling or calf pain, shortness of breath, chest pain, or severe sudden headache while using combined hormonal contraception."
      zh_hk: "服用混合避孕丸期間如出現單側小腿腫痛、突發氣促、胸痛或劇烈頭痛，請立即求醫評估。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:fluconazole_warfarin_inr_spike
    source_id: drug:fluconazole
    relation: INTERACTS_WITH
    target_id: drug:warfarin
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Fluconazole strongly inhibits CYP2C9 (S-warfarin metabolism), causing major INR spikes and serious bleeding even after a single 150 mg oral dose."
      zh_hk: "氟康唑強烈抑制 CYP2C9 代謝酵素，即使單次口服150毫克亦可引致華法林 INR 急劇飆升及嚴重出血風險。"
    clinician_action_prompt:
      en: "Prefer topical antifungal (e.g. clotrimazole) for VVC in warfarinised patients; if systemic fluconazole unavoidable, alert doctor to reduce warfarin dose and recheck INR in 3-5 days."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:metronidazole_warfarin_inr_spike
    source_id: drug:metronidazole
    relation: INTERACTS_WITH
    target_id: drug:warfarin
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Metronidazole inhibits CYP2C9 clearance of S-warfarin, markedly elevating INR and major bleeding risk."
      zh_hk: "甲硝唑抑制 S-華法林代謝，顯著推高 INR 並大幅增加嚴重出血風險。"
    clinician_action_prompt:
      en: "Flag prescriber to consider topical/alternative therapy if suitable, or pre-emptively adjust warfarin and order repeat INR within 3-5 days."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:paed_rash_lethargy_meningitis_sepsis
    source_id: rf:paed_non_blanching_rash_lethargy
    relation: RED_FLAG_FOR
    target_id: cond:meningitis
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Non-blanching petechial/purpuric rash, extreme lethargy/floppiness, or inconsolable high-pitched crying in a febrile child signals potential meningococcal disease, bacterial meningitis, or paediatric sepsis."
      zh_hk: "發燒兒童出現按壓不退色皮疹、極度嗜睡軟弱無力或持續尖聲哭鬧，為腦膜炎雙球菌感染、細菌性腦膜炎或兒童敗血症極危警號。"
    clinician_action_prompt:
      en: "Immediate emergency ambulance transfer to paediatric ED; consider IM/IV benzylpenicillin/ceftriaxone per local guideline only if transfer delayed and clinician on-site."
    patient_safety_net:
      en: "If your child has a rash that does not fade when pressed with a clear glass, is unusually floppy or hard to wake, or has fast laboured breathing, seek emergency hospital care immediately."
      zh_hk: "如小朋友出現以透明玻璃杯按壓後不退色的皮疹、異常軟弱或叫唔醒、或呼吸急促費力，請立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:acute_delirium_urgent_workup
    source_id: rf:acute_delirium_fluctuating
    relation: RED_FLAG_FOR
    target_id: cond:delirium
    severity: critical
    urgency_floor: 3
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Acute fluctuating confusion in an older adult is a medical emergency until reversible precipitants are excluded (infection/UTI/pneumonia, anticholinergic/sedative drugs, electrolyte/glycaemic derangement, hypoxia, stroke/subdural)."
      zh_hk: "長者出現急性起伏性意識混亂屬急症警號，須緊急排查可逆轉誘因（泌尿道或肺部感染、藥物副作用、電解質／血糖異常、缺氧或中風／硬膜下血腫）。"
    clinician_action_prompt:
      en: "Arrange urgent same-day medical/ED evaluation: vitals/SpO2/BGL, focused neuro exam, medication reconciliation (anticholinergics/opioids/benzos), CBC, RFT/electrolytes, calcium, urinalysis, and CXR/CT head if indicated."
    patient_safety_net:
      en: "Sudden new confusion, drowsiness, or agitation in an older adult needs urgent medical assessment today — go to emergency care immediately if there is fever, weakness on one side, a recent head knock, or trouble breathing."
      zh_hk: "長者如突然出現意識混亂、異常嗜睡或躁動，必須即日緊急求醫；如伴發燒、單側無力、近期撞傷頭部或呼吸困難，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:heavy_bleeding_bruising_thrombocytopenia
    source_id: rf:heavy_bleeding_bruising
    relation: RED_FLAG_FOR
    target_id: cond:thrombocytopenia
    severity: critical
    urgency_floor: 3
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Unexplained petechiae, mucosal bleeding, or severe acute haemorrhage requires urgent CBC, coagulation profile, and review of anticoagulants/antiplatelets/NSAIDs to exclude severe thrombocytopenia or coagulopathy."
      zh_hk: "無故瘀點、黏膜出血或大量急性出血，須緊急檢查全血細胞計數及凝血功能，並覆核薄血藥／消炎藥，排除嚴重血小板減少或凝血障礙。"
    clinician_action_prompt:
      en: "Order urgent same-day CBC + coagulation screen (PT/INR/APTT); transfer to ED immediately if haemodynamically unstable, active mucosal/CNS bleeding, or platelets <20 x10^9/L."
    patient_safety_net:
      en: "Unexplained spreading bruises, pinprick red spots, ongoing gum/nose bleeding, or soaking pads every hour requires urgent medical assessment today; seek emergency care immediately if you feel faint or breathless."
      zh_hk: "如出現無故擴散的瘀青、針點紅斑、流牙血／鼻血不止或每小時浸透衛生巾，請即日緊急求醫；如感頭暈氣促，請立即前往急症室。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:screen_crc_fit_malignancy
    source_id: screen:crc_fit
    relation: PREVENTIVE_SCREEN_FOR
    target_id: cond:malignancy_occult
    severity: info
    urgency_floor: 1
    clinic_port_family: positive_screen
    when:
      fact: age_years
      op: ge
      value: 45
    clinician_rationale:
      en: "Population bowel cancer screening (biennial FIT/iFOBT) detects asymptomatic colorectal neoplasia early; any positive FIT requires timely diagnostic colonoscopy (never repeat FIT to dismiss a positive screen)."
      zh_hk: "每兩年大便隱血篩查有助及早發現無徵狀大腸癌或瘜肉；陽性篩查結果必須轉介大腸鏡檢查，切勿單以重驗大便排除。"
    clinician_action_prompt:
      en: "Verify jurisdiction eligibility age/interval (HK 50-75y; AU NBCSP 45-74y) and recall/refer promptly if positive FIT."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:screen_cervical_hpv_cancer
    source_id: screen:cervical_hpv
    relation: PREVENTIVE_SCREEN_FOR
    target_id: cond:cervical_cancer
    severity: info
    urgency_floor: 1
    clinic_port_family: positive_screen
    when:
      all:
        - { fact: sex, op: eq, value: "F" }
        - { fact: age_years, op: ge, value: 25 }
        - { fact: age_years, op: le, value: 74 }
    clinician_rationale:
      en: "Primary HPV cervical screening identifies high-risk HPV (16/18 and non-16/18) and precancerous CIN lesions; symptomatic bleeding requires diagnostic speculum exam regardless of prior negative screen."
      zh_hk: "子宮頸癌HPV篩查可及早識別高危型HPV及癌前病變；但如有異常陰道出血徵狀，不論過往篩查是否陰性，均須直接作臨床診斷檢查。"
    clinician_action_prompt:
      en: "Check jurisdiction schedule (HK 25-64y; AU 25-74y 5-yearly with self-collection option); track HPV+ results to colposcopy/follow-up."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:screen_breast_mammogram_cancer
    source_id: screen:breast_mammogram
    relation: PREVENTIVE_SCREEN_FOR
    target_id: cond:breast_cancer
    severity: info
    urgency_floor: 1
    clinic_port_family: positive_screen
    when:
      all:
        - { fact: sex, op: eq, value: "F" }
        - { fact: age_years, op: ge, value: 44 }
        - { fact: age_years, op: le, value: 74 }
    clinician_rationale:
      en: "Biennial screening mammography reduces breast cancer mortality in eligible asymptomatic women; any palpable breast lump or nipple/skin change requires diagnostic triple assessment rather than routine screening."
      zh_hk: "定期乳房X光造影篩查有助及早發現無徵狀乳癌；但如觸及乳房硬塊或乳頭皮膚變化，必須作診斷性三聯檢查而非一般篩查。"
    clinician_action_prompt:
      en: "Assess personal/family breast cancer risk and offer jurisdiction-aligned screening mammogram (HK risk-based 44-69y; AU BreastScreen 50-74y target, eligible >=40y)."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: edge:screen_hbv_adult_chronic
    source_id: screen:hbv_adult
    relation: PREVENTIVE_SCREEN_FOR
    target_id: cond:chronic_hbv
    severity: info
    urgency_floor: 1
    clinic_port_family: positive_screen
    when:
      fact: age_years
      op: ge
      value: 18
    clinician_rationale:
      en: "Targeted/universal adult HBsAg + anti-HBs + anti-HBc screening identifies undiagnosed chronic HBV for HCC surveillance and antiviral eligibility, and identifies non-immune adults for vaccination."
      zh_hk: "成人乙型肝炎篩查有助找出隱性帶菌者以安排定期肝癌監察及抗病毒治療評估，並為無抗體人士安排疫苗接種。"
    clinician_action_prompt:
      en: "Order HBsAg, anti-HBs, and anti-HBc (mandatory in HK adults born <=1988, high-prevalence migrants, First Nations AU adults, pregnant women, and prior to immunosuppression)."
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

# ===========================================================================
# PRESENTATION FRAMES (5) — Murtagh PROMPT + openEHR Positive Exclusions + Safety Netting
# ===========================================================================
frames:
  - id: frame:pelvic_pain
    rfe_concept_id: rfe:pelvic_pain
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_dysmen, concept_id: cond:dysmenorrhoea, prevalence_note: "Most common cyclic pelvic pain in reproductive-age women" }
        - { id: p_uti, concept_id: cond:uti, key_discriminators: ["dysuria", "frequency", "suprapubic tenderness"] }
        - { id: p_bv_candida, concept_id: cond:bacterial_vaginosis, key_discriminators: ["abnormal discharge", "odour/itch"] }
      serious_not_to_be_missed:
        - { id: s_ectopic, concept_id: cond:ectopic_pregnancy, key_discriminators: ["reproductive age + missed/abnormal period", "unilateral pain", "syncope/shoulder-tip pain — ALWAYS urine beta-hCG"] }
        - { id: s_pid_sti, concept_id: cond:chlamydia_sti, key_discriminators: ["cervical motion tenderness", "fever", "mucopurulent discharge", "new partner"] }
        - { id: s_endometrial, concept_id: cond:endometrial_cancer, key_discriminators: ["postmenopausal", "abnormal bleeding", "pelvic mass"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["high fever", "tachycardia", "rigors", "peritonism"] }
      pitfalls_often_missed:
        - { id: o_pcos, concept_id: cond:pcos, key_discriminators: ["oligomenorrhoea", "hyperandrogenism", "ovarian cyst pain"] }
        - { id: o_cervical, concept_id: cond:cervical_cancer, key_discriminators: ["postcoital bleeding", "deep dyspareunia", "overdue cervical screening"] }
      masquerades:
        - { id: mq_uti, tier: primary, masquerade: uti, concept_id: cond:uti, clue_prompt: { en: "Exclude UTI with dipstick/MSU even when pain is described as 'period-like'." } }
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Chronic pelvic pain frequently co-exists with depression, anxiety, or trauma history — screen sensitively after organic causes addressed." } }
        - { id: mq_spine, tier: primary, masquerade: spinal_dysfunction, concept_id: cond:spinal_dysfunction, clue_prompt: { en: "Lumbosacral / pelvic girdle dysfunction can refer pain to the lower abdomen and groin." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore unvoiced concerns about fertility, endometriosis, STI exposure, intimate partner safety, or unintended pregnancy." }
    positive_exclusions:
      - id: ex_ectopic_rupture
        finding_concept_id: rf:ectopic_rupture_signs
        question: { en: "Could you possibly be pregnant, and are you having severe one-sided lower tummy pain, dizziness, fainting, or shoulder-tip pain?", zh_hk: "請問你有沒有可能懷孕，以及有沒有單側下腹劇痛、頭暈昏厥或肩尖痛？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_syncope
        finding_concept_id: rf:syncope
        question: { en: "Have you fainted, collapsed, or felt light-headed when standing?", zh_hk: "請問你有沒有暈倒，或站立時感到嚴重頭暈眼前發黑？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_heavy_bleed
        finding_concept_id: rf:heavy_bleeding_bruising
        question: { en: "Are you experiencing very heavy vaginal bleeding (soaking a pad every hour or passing large clots)?", zh_hk: "請問你有沒有大量陰道出血（例如每小時浸透衛生巾或排出大塊血塊）？" }
        urgency_if_present: 3
        mandatory: true
    safety_netting:
      - id: sn_pelvic_emergency
        trigger_condition: { en: "Sudden severe or worsening one-sided lower abdominal pain, fainting, dizziness, shoulder-tip pain, high fever, or heavy bleeding", zh_hk: "突發或加劇的單側下腹劇痛、頭暈昏厥、肩尖痛、高燒或大量出血" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "If your lower tummy pain becomes severe or sudden, or if you feel faint, dizzy, feverish, or bleed heavily, seek immediate emergency hospital care."
          zh_hk: "如下腹痛突然加劇，或出現頭暈昏厥、發高燒或大量出血，請立即前往急症室或致電緊急救援服務。"
      - id: sn_pelvic_review
        trigger_condition: { en: "Pain not improving within 48 hours or positive pregnancy test with any pain/spotting", zh_hk: "痛楚於48小時內未見改善，或驗孕呈陽性並伴任何腹痛／見紅" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange same-day doctor review if a pregnancy test is positive with any tummy pain or spotting, or if symptoms do not start settling within 48 hours."
          zh_hk: "如驗孕呈陽性並伴有任何腹痛或見紅，或痛楚於48小時內未有改善，請安排即日醫生評估。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: frame:vaginal_bleeding
    rfe_concept_id: rfe:vaginal_bleeding
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_hmb, concept_id: cond:heavy_menstrual_bleeding, prevalence_note: "PALM-COEIN structural/ovulatory causes in reproductive years" }
        - { id: p_pcos, concept_id: cond:pcos, key_discriminators: ["anovulatory irregular heavy bleeding", "oligomenorrhoea"] }
        - { id: p_menopause, concept_id: cond:menopause, key_discriminators: ["perimenopausal cycle irregularity", "atrophic vaginitis"] }
      serious_not_to_be_missed:
        - { id: s_ectopic, concept_id: cond:ectopic_pregnancy, key_discriminators: ["ANY reproductive-age woman with bleeding — do urine beta-hCG"] }
        - { id: s_endometrial, concept_id: cond:endometrial_cancer, key_discriminators: ["postmenopausal bleeding", "age >=45y with intermenstrual/persistent HMB", "high BMI / PCOS"] }
        - { id: s_cervical, concept_id: cond:cervical_cancer, key_discriminators: ["postcoital bleeding", "intermenstrual bleeding", "overdue HPV screening"] }
        - { id: s_thrombocytopenia, concept_id: cond:thrombocytopenia, key_discriminators: ["bleeding from menarche", "bruising/petechiae", "mucosal bleeding"] }
      pitfalls_often_missed:
        - { id: o_chlamydia, concept_id: cond:chlamydia_sti, key_discriminators: ["intermenstrual or postcoital bleeding from cervicitis"] }
        - { id: o_ida, concept_id: cond:iron_deficiency_anaemia, key_discriminators: ["fatigue/dyspnoea secondary to chronic HMB — check CBC + ferritin"] }
      masquerades:
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Hypothyroidism is a classic reversible cause of menorrhagia — check TSH." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:iron_deficiency_anaemia, clue_prompt: { en: "Check Hb and ferritin in all persistent heavy menstrual bleeding." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review anticoagulants (warfarin/DOAC), missed COC/progestogen pills, copper IUD, or herbal/TCM products." } }
      patient_hidden_agenda_prompts:
        - { en: "Ask about fear of gynaecological cancer, impact on work/daily life, desire for future fertility, and contraception needs." }
    positive_exclusions:
      - id: ex_ectopic_bleed
        finding_concept_id: rf:ectopic_rupture_signs
        question: { en: "Is there any chance you could be pregnant, and do you have one-sided lower tummy pain or dizziness?", zh_hk: "請問你有沒有機會懷孕，或伴隨單側下腹痛或頭暈？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_pmb
        finding_concept_id: rf:postmenopausal_bleeding
        question: { en: "Has this bleeding occurred after you have already gone 12 months or more without a period (after menopause)?", zh_hk: "請問今次出血是否發生於已停經／收經滿12個月或以上之後？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_flooding_bruising
        finding_concept_id: rf:heavy_bleeding_bruising
        question: { en: "Are you soaking through a pad or tampon every hour, passing large clots, or noticing unexplained bruising or gum bleeding?", zh_hk: "請問你有沒有每小時浸透衛生巾、排出大血塊，或無故出現瘀青／流牙血？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_syncope
        finding_concept_id: rf:syncope
        question: { en: "Have you felt faint, dizzy, or short of breath with the bleeding?", zh_hk: "請問出血期間有沒有感到頭暈欲暈或氣促？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_bleed_emergency
        trigger_condition: { en: "Soaking >=1 pad/hour for >=2 consecutive hours, fainting/dizziness, severe tummy pain, or heavy bleeding in pregnancy", zh_hk: "連續兩小時每小時浸透衛生巾、頭暈昏厥、劇烈腹痛或懷孕期大量出血" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "If you are soaking through a pad every hour, feel faint or breathless, have severe tummy pain, or are pregnant with heavy bleeding, seek emergency hospital care immediately."
          zh_hk: "如每小時浸透衛生巾、感到頭暈氣促、劇烈腹痛，或懷孕期間大量出血，請立即前往急症室。"
      - id: sn_bleed_urgent_gp
        trigger_condition: { en: "Any postmenopausal bleeding, bleeding after sex, or persistent intermenstrual bleeding", zh_hk: "任何收經後出血、性交後出血或持續非經期出血" }
        timeframe_hours: 72
        escalation_channel: urgent_clinic_callback
        patient_instruction:
          en: "Any bleeding after menopause, after sex, or between periods needs prompt doctor review and assessment — contact the clinic to arrange an urgent appointment."
          zh_hk: "任何收經後出血、性交後出血或非經期出血均須盡快安排醫生檢查，請聯絡診所預約優先診症。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: frame:missed_period_pregnancy
    rfe_concept_id: rfe:missed_period_pregnancy
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_preg, concept_id: cond:pregnancy_normal, prevalence_note: "Confirm gestation by LMP + urine/serum beta-hCG; start folic acid & iodine" }
        - { id: p_pcos, concept_id: cond:pcos, key_discriminators: ["secondary amenorrhoea/oligomenorrhoea", "negative beta-hCG"] }
        - { id: p_menopause, concept_id: cond:menopause, key_discriminators: ["age >=45y", "vasomotor symptoms", "negative beta-hCG"] }
      serious_not_to_be_missed:
        - { id: s_ectopic, concept_id: cond:ectopic_pregnancy, key_discriminators: ["positive beta-hCG + unilateral pain / spotting / prior ectopic / IUD"] }
        - { id: s_preeclampsia, concept_id: cond:preeclampsia, key_discriminators: ["gestation >=20w", "BP >=140/90", "headache/visual/epigastric symptoms"] }
        - { id: s_pe, concept_id: cond:pe, key_discriminators: ["hypercoagulable state in pregnancy — unilateral leg swelling / dyspnoea"] }
      pitfalls_often_missed:
        - { id: o_teratogen, concept_id: cond:drug_adverse_effect, key_discriminators: ["urgent med reconciliation: stop ACEi/ARB, warfarin, methotrexate, oral fluconazole, valproate, retinoids"] }
        - { id: o_hbv, concept_id: cond:chronic_hbv, key_discriminators: ["mandatory antenatal HBsAg/HIV/syphilis/rubella/thalassaemia screening"] }
      masquerades:
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Hypothyroidism causes amenorrhoea and increases miscarriage/neurodevelopmental risk in pregnancy." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:iron_deficiency_anaemia, clue_prompt: { en: "Screen FBC, ferritin, and thalassaemia carrier status (MCV) early in pregnancy." } }
        - { id: mq_diabetes, tier: primary, masquerade: diabetes, concept_id: cond:t2dm, clue_prompt: { en: "Screen early for overt/gestational diabetes in high-risk mothers (Asian ancestry, PCOS, BMI, prior GDM)." } }
      patient_hidden_agenda_prompts:
        - { en: "Sensitively establish whether the pregnancy is planned/wanted, discuss all options non-judgementally, and screen for intimate partner safety and perinatal mental health." }
    positive_exclusions:
      - id: ex_ectopic_preg
        finding_concept_id: rf:ectopic_rupture_signs
        question: { en: "Are you having any one-sided lower tummy pain, vaginal spotting/bleeding, dizziness, or shoulder-tip pain?", zh_hk: "請問你有沒有單側下腹痛、陰道見紅、頭暈或肩尖痛？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_preeclampsia
        finding_concept_id: rf:preeclampsia_signs
        question: { en: "If you are 20 or more weeks pregnant, have you had a severe headache, flashing lights/blurred vision, upper tummy pain, or sudden swelling of your face or hands?", zh_hk: "如已懷孕20週或以上，請問有沒有劇烈頭痛、視力模糊或閃光、上腹痛，或面部手部突發水腫？" }
        urgency_if_present: 4
        mandatory: true
        when:
          fact: pregnant
          op: eq
          value: true
      - id: ex_dyspnoea_preg
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Are you having any sudden shortness of breath, chest pain, or swelling/pain in one calf?", zh_hk: "請問你有沒有突發氣促、胸痛，或單側小腿腫痛？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_preg_emergency
        trigger_condition: { en: "Severe tummy pain, heavy vaginal bleeding, fainting, severe headache/visual changes (>=20w), or sudden shortness of breath", zh_hk: "劇烈腹痛、大量陰道出血、頭暈昏厥、20週後劇烈頭痛／視力異常或突發氣促" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if you experience severe lower tummy pain, heavy bleeding, fainting, sudden breathlessness, or (later in pregnancy) severe headache, vision changes, or reduced baby movements."
          zh_hk: "如出現劇烈下腹痛、大量出血、頭暈昏厥、突發氣促，或懷孕中後期出現劇烈頭痛、視力異常或胎動明顯減少，請立即前往急症室。"
      - id: sn_preg_med_review
        trigger_condition: { en: "Taking regular prescription medicines while newly pregnant or planning pregnancy", zh_hk: "新近懷孕或計劃懷孕期間正服用長期處方藥物" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Contact your doctor promptly to review any regular medications before stopping or continuing them, and arrange early antenatal blood tests and dating review."
          zh_hk: "如正服用任何長期藥物，請盡快聯絡醫生核對用藥安全（切勿自行停服高危慢性病藥），並安排早期產前檢查。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: frame:falls_elderly
    rfe_concept_id: rfe:falls_elderly
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_frailty, concept_id: cond:frailty_falls, prevalence_note: "Multifactorial gait/balance impairment, sarcopenia, orthostatic hypotension, home hazards" }
        - { id: p_drugs, concept_id: cond:drug_adverse_effect, key_discriminators: ["FRIDs: antihypertensives, diuretics, sedatives, anticholinergics, sulfonylurea hypoglycaemia"] }
        - { id: p_uti, concept_id: cond:uti, key_discriminators: ["acute functional decline or fall as atypical infection presentation"] }
      serious_not_to_be_missed:
        - { id: s_delirium, concept_id: cond:delirium, key_discriminators: ["acute fluctuating confusion/drowsiness", "infection/metabolic/drug trigger"] }
        - { id: s_acs, concept_id: cond:acs, key_discriminators: ["syncopal fall", "silent ischaemia/arrhythmia — ECG mandatory in unexplained fall"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["fall + fever/hypothermia/tachypnoea/hypotension"] }
        - { id: s_pe, concept_id: cond:pe, key_discriminators: ["sudden collapse + dyspnoea/hypoxia"] }
      pitfalls_often_missed:
        - { id: o_anticoag_head, concept_id: cond:drug_adverse_effect, key_discriminators: ["head strike on warfarin/DOAC -> urgent CT head even if initially alert"] }
        - { id: o_b12, concept_id: cond:b12_deficiency, key_discriminators: ["peripheral neuropathy, proprioceptive ataxia, metformin long-term use"] }
      masquerades:
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Medication review is mandatory after every fall (diuretics, RAAS, sedatives, sulfonylureas, anticoagulants)." } }
        - { id: mq_uti, tier: primary, masquerade: uti, concept_id: cond:uti, clue_prompt: { en: "Check for occult infection (UTI, pneumonia) precipitating acute 'off legs' or delirium." } }
        - { id: mq_neuro, tier: secondary, masquerade: neurological_dilemma, concept_id: cond:neurological_dilemma, clue_prompt: { en: "Screen for Parkinsonism, TIA/stroke, peripheral neuropathy, or normal-pressure hydrocephalus." } }
        - { id: mq_anaemia, tier: primary, masquerade: anaemia, concept_id: cond:anaemia, clue_prompt: { en: "Check FBC, B12, electrolytes (hyponatraemia), glucose, and postural BP." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of losing independence or residential care placement, caregiver burnout, and home environmental hazards." }
    positive_exclusions:
      - id: ex_delirium_fall
        finding_concept_id: rf:acute_delirium_fluctuating
        question: { en: "Has the person developed sudden new confusion, unusual drowsiness, or fluctuating alertness?", zh_hk: "請問長者有否突然出現意識混亂、異常嗜睡或神智時清時懵？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_syncope_fall
        finding_concept_id: rf:syncope
        question: { en: "Did they lose consciousness, black out, hit their head (especially if taking blood thinners), or have chest pain/palpitations before falling?", zh_hk: "請問跌倒前有否失去知覺、眼前一黑、胸痛心悸，或跌倒時撞傷頭部（尤其正服用薄血藥）？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_bleeding_fall
        finding_concept_id: rf:heavy_bleeding_bruising
        question: { en: "Are they taking blood thinners (warfarin/DOAC) with significant bruising, bleeding, or inability to bear weight on a hip/leg?", zh_hk: "請問長者有否服用薄血藥並出現明顯瘀傷出血，或跌倒後無法站立／髖部劇痛？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_fall_emergency
        trigger_condition: { en: "Head injury (especially on blood thinners), loss of consciousness, new confusion/drowsiness, chest pain, focal weakness, or inability to walk/hip pain", zh_hk: "撞傷頭部（尤其正服薄血藥）、失去知覺、新發意識混亂或嗜睡、胸痛、單側無力或無法行走／髖部劇痛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if there was a head knock (especially while taking blood thinners), loss of consciousness, new confusion or drowsiness, severe hip/limb pain, or weakness on one side."
          zh_hk: "如跌倒時撞傷頭部（尤其正服用薄血藥）、曾經昏迷、出現新發意識混亂或嗜睡、髖部／肢體劇痛無法站立，或單側無力，請立即前往急症室。"
      - id: sn_fall_review
        trigger_condition: { en: "Any fall in an older adult without emergency red flags", zh_hk: "長者跌倒後暫無即時急症警號，但須排查原因及預防再跌" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange a prompt doctor review within 48 hours to check blood pressure, medications, balance, and bone health so future falls can be prevented."
          zh_hk: "請於48小時內安排醫生覆診，檢查血壓、檢視藥物、評估平衡力及骨骼健康，減低再次跌倒風險。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: frame:paediatric_fever_unwell
    rfe_concept_id: rfe:paediatric_fever_unwell
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_urti, concept_id: cond:urti, prevalence_note: "Most common cause of acute paediatric fever" }
        - { id: p_hfmd, concept_id: cond:hfmd, key_discriminators: ["mouth ulcers", "vesicles on palms/soles/buttocks", "poor oral intake", "watch EV71 neuro signs"] }
        - { id: p_croup, concept_id: cond:croup, key_discriminators: ["barking cough", "inspiratory stridor", "worse at night"] }
        - { id: p_bronchiolitis, concept_id: cond:bronchiolitis, key_discriminators: ["infant <12m", "coryza -> wheeze/crackles/tachypnoea", "feeding difficulty"] }
      serious_not_to_be_missed:
        - { id: s_meningitis, concept_id: cond:meningitis, key_discriminators: ["non-blanching rash", "lethargy/floppiness", "bulging fontanelle", "stiff neck/photophobia"] }
        - { id: s_sepsis, concept_id: cond:sepsis, key_discriminators: ["infant <3m with T>=38.0 C", "mottled/pale/cyanotic", "cap refill >3s", "persistent tachycardia"] }
        - { id: s_cap, concept_id: cond:cap, key_discriminators: ["tachypnoea", "grunting", "chest recessions", "SpO2 <94%"] }
        - { id: s_febrile_conv, concept_id: cond:febrile_convulsion, key_discriminators: ["seizure >5 min or focal/recurrent within 24h -> complex, urgent hospital"] }
        - { id: s_dengue, concept_id: cond:dengue, key_discriminators: ["travel/local cluster", "thrombocytopenia", "NO NSAIDs"] }
      pitfalls_often_missed:
        - { id: o_uti_paed, concept_id: cond:uti, key_discriminators: ["unexplained fever without source in infant/child -> clean-catch urine microscopy/culture"] }
        - { id: o_flu_paed, concept_id: cond:influenza, key_discriminators: ["high abrupt fever", "myalgia", "encephalopathy watch"] }
      masquerades:
        - { id: mq_uti, tier: primary, masquerade: uti, concept_id: cond:uti, clue_prompt: { en: "UTI is the most commonly missed serious bacterial infection in a febrile child without a clear source." } }
        - { id: mq_baffling_viral, tier: secondary, masquerade: baffling_viral, concept_id: cond:hfmd, clue_prompt: { en: "In HK/East Asia HFMD outbreaks (EV71), screen for myoclonic jerks, persistent vomiting, lethargy, and tachycardia (brainstem encephalitis warning)." } }
      patient_hidden_agenda_prompts:
        - { en: "Address parental fear of fever brain damage ('fever phobia'), verify exact weight-based paracetamol dosing, and check childcare/school exclusion needs." }
    positive_exclusions:
      - id: ex_paed_rash_lethargy
        finding_concept_id: rf:paed_non_blanching_rash_lethargy
        question: { en: "Does your child have a rash that does not fade when pressed with a clear glass, seem unusually floppy/drowsy/hard to wake, or cry inconsolably?", zh_hk: "請問小朋友有沒有以玻璃杯按壓不退色的皮疹、異常軟弱嗜睡叫唔醒，或持續無法安撫地哭鬧？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_paed_breathing
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Is your child breathing very fast, working hard to breathe (ribs sucking in or grunting), having noisy breathing at rest (stridor), or turning pale/blue?", zh_hk: "請問小朋友有沒有呼吸非常急促、肋骨凹陷或發出呻吟聲、靜止時呼吸有喘鳴聲，或面色／嘴唇發白發紫？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_paed_meningism
        finding_concept_id: rf:stiff_neck_meningism
        question: { en: "Does your child have a stiff neck, sensitivity to bright light, a seizure/fit, or is this a baby under 3 months old with a temperature of 38.0 C or higher?", zh_hk: "請問小朋友有沒有頸部僵硬、畏光、抽筋，或屬於三個月以下嬰兒發燒達攝氏38度或以上？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_paed_emergency
        trigger_condition: { en: "Infant <3 months with fever >=38.0 C, non-blanching rash, difficulty breathing/stridor at rest, extreme drowsiness/floppiness, seizure, or signs of dehydration (no wet nappies >8-12h)", zh_hk: "三個月以下嬰兒發燒達38度或以上、按壓不退色皮疹、呼吸困難或靜止時喘鳴、極度嗜睡軟弱、抽筋，或嚴重脫水（8至12小時無濕尿片）" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if your child is under 3 months with a fever of 38.0 C or higher, has a non-blanching rash, struggles to breathe, has a seizure, is floppy or hard to wake, or cannot keep fluids down."
          zh_hk: "如屬三個月以下嬰兒發燒達38度或以上，或小朋友出現按壓不退色皮疹、呼吸困難、抽筋、異常軟弱叫唔醒或完全無法進食飲水，請立即前往急症室。"
      - id: sn_paed_review
        trigger_condition: { en: "Fever persisting >48 hours, worsening irritability, reduced fluid intake (<50% usual), or parental concern that the child is getting worse", zh_hk: "發燒持續超過48小時、精神轉差、飲水／飲奶量少於平日一半，或家長覺得病情惡化" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange same-day doctor review if fever persists beyond 48 hours, your child is drinking less than half their usual fluids, or you feel they are worsening — trust your instincts as a parent."
          zh_hk: "如發燒持續超過48小時、飲奶或飲水量少於平日一半，或你察覺小朋友精神轉差，請即日安排醫生覆診。"
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

# ===========================================================================
# OBSERVATION RULES (5) — LOINC + UCUM + Reference Intervals + Bands + Templates
# ===========================================================================
observation_rules:
  - id: obs_rule:wbc
    observation_concept_id: obs:wbc
    canonical_ucum: "10*9/L"
    display_ucum: "10*9/L"
    reference_intervals:
      - { id: ri_adult_default, low: 4.0, high: 11.0, priority: 0 }
      - { id: ri_pregnancy, low: 5.5, high: 15.0, priority: 10, when: { fact: pregnant, op: eq, value: true }, source_note: "Physiological neutrophilia in pregnancy" }
    severity_bands:
      significant: { lt: 3.0, gt: 15.0 }
      urgent: { lt: 1.5, gt: 30.0 }
      critical: { lt: 1.0, gt: 50.0 }
    direction_templates:
      L:
        working_problem: { en: "leukopenia / neutropenia risk", zh_hk: "白血球偏低／嗜中性白血球減少風險" }
        plan_template:
          en: "Check differential (absolute neutrophil count — ANC <1.0 or febrile neutropenia is an emergency); review culprit drugs (methotrexate, carbimazole, clozapine, viral suppression)."
        relevant_med_class_ids: ["drug_class:dmard"]
      H:
        working_problem: { en: "leukocytosis", zh_hk: "白血球偏高" }
        plan_template:
          en: "Inspect differential and blood film; evaluate acute bacterial infection, systemic steroids, smoking, pregnancy, or haematological malignancy if >30 x10^9/L or blasts present."
        relevant_med_class_ids: ["drug_class:oral_corticosteroid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: obs_rule:platelets
    observation_concept_id: obs:platelets
    canonical_ucum: "10*9/L"
    display_ucum: "10*9/L"
    reference_intervals:
      - { id: ri_adult_default, low: 150.0, high: 450.0, priority: 0 }
    severity_bands:
      significant: { lt: 100.0, gt: 600.0 }
      urgent: { lt: 50.0, gt: 1000.0 }
      critical: { lt: 20.0, gt: 1500.0 }
    trend_rules:
      - id: tr_plt_rapid_drop
        direction: drop
        delta_pct: 50.0
        window_days: 14
        urgency_floor: 3
        clinician_rationale:
          en: "Platelet count dropped >=50% within 14 days — urgently exclude dengue haemorrhagic phase, HIT, ITP, HELLP (if pregnant), or marrow suppression."
    direction_templates:
      L:
        working_problem: { en: "thrombocytopenia", zh_hk: "血小板減少" }
        plan_template:
          en: "Exclude EDTA pseudothrombocytopenia (blood film + citrate tube); check bleeding red flags, pregnancy/HELLP, dengue, liver disease, B12/folate, and review anticoagulants/NSAIDs; urgent ED if <20 x10^9/L or active bleeding."
        relevant_med_class_ids: ["drug_class:anticoagulant", "drug_class:nsaid", "drug_class:dmard"]
      H:
        working_problem: { en: "thrombocytosis", zh_hk: "血小板偏高" }
        plan_template:
          en: "Check ferritin/CRP (reactive iron deficiency or inflammation is most common); if persistent >450-600 x10^9/L without reactive cause, evaluate myeloproliferative neoplasm (JAK2) and occult malignancy."
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: obs_rule:folate
    observation_concept_id: obs:folate
    canonical_ucum: "nmol/L"
    display_ucum: "nmol/L"
    reference_intervals:
      - { id: ri_default, low: 7.0, high: null, priority: 0 }
    severity_bands:
      significant: { lt: 7.0 }
      urgent: { lt: 4.5 }
    direction_templates:
      L:
        working_problem: { en: "folate deficiency", zh_hk: "葉酸缺乏" }
        plan_template:
          en: "ALWAYS check serum Vitamin B12 before starting folic acid monotherapy (prevents subacute combined degeneration); assess diet, alcohol, coeliac/malabsorption, pregnancy, and methotrexate."
        relevant_med_class_ids: ["drug_class:dmard", "drug_class:haematinic"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: obs_rule:bhcg_urine
    observation_concept_id: obs:bhcg_urine
    canonical_ucum: "{Ordinal}"
    display_ucum: "{Ordinal}"
    reference_intervals: []
    severity_bands:
      significant: { ge: 1.0 }
    direction_templates:
      positive:
        working_problem: { en: "positive urine pregnancy test (beta-hCG)", zh_hk: "尿液驗孕測試呈陽性" }
        plan_template:
          en: "Confirm LMP/gestation; immediately exclude ectopic red flags (pain/bleeding/syncope -> urgent quantitative serum beta-hCG + TVUS); reconcile teratogenic medicines (ACEi/ARB, warfarin, methotrexate, fluconazole) and start folic acid."
        relevant_med_class_ids: ["drug_class:raas_agent", "drug_class:anticoagulant", "drug_class:dmard", "drug_class:antifungal", "drug_class:hormonal_contraception"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

  - id: obs_rule:tsat
    observation_concept_id: obs:tsat
    canonical_ucum: "%"
    display_ucum: "%"
    reference_intervals:
      - { id: ri_default, low: 20.0, high: 45.0, priority: 0 }
    severity_bands:
      significant: { lt: 16.0, gt: 45.0 }
      urgent: { gt: 60.0 }
    direction_templates:
      L:
        working_problem: { en: "low transferrin saturation (iron deficiency)", zh_hk: "轉鐵蛋白飽和度偏低（缺鐵）" }
        plan_template:
          en: "TSAT <20% supports true or functional iron deficiency even when ferritin is 30-100 ug/L with raised CRP; investigate source of blood loss or malabsorption."
        relevant_med_class_ids: ["drug_class:anticoagulant", "drug_class:nsaid", "drug_class:haematinic"]
      H:
        working_problem: { en: "elevated transferrin saturation (iron overload screen)", zh_hk: "轉鐵蛋白飽和度偏高（鐵質負荷過多篩查）" }
        plan_template:
          en: "Repeat fasting morning TSAT + ferritin; if persistently >45% with elevated ferritin, evaluate hereditary haemochromatosis (HFE genotyping), thalassaemia/dyserythropoiesis, or liver disease."
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w1_d", review_status: "draft" }

