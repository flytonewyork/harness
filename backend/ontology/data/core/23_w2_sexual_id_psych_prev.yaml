# ===========================================================================
# DETERMINISTIC CLINICAL EDGES (18) — High-Risk DDIs, Red Flags & Monitoring
# ===========================================================================
edges:
  - id: edge:sildenafil_nitrate_fatal_hypotension
    source_id: drug_class:pde5_inhibitor
    relation: INTERACTS_WITH
    target_id: drug_class:nitrate
    bidirectional: true
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Co-administration of PDE5 inhibitors (e.g. sildenafil) with organic nitrates (e.g. GTN sublingual/spray) causes synergistic cGMP-mediated vasodilation and potentially fatal refractory hypotension, MI, or cardiovascular collapse."
      zh_hk: "PDE5抑制劑（如西地那非）與硝酸酯類藥物（如硝酸甘油／脷底丸）併用會引致嚴重協同血管擴張，可造成致命性難治低血壓及心血管休克，屬絕對禁忌。"
    clinician_action_prompt:
      en: "HARD-BLOCK co-prescribing; verify patient has not used sildenafil within 24h (tadalafil 48h) before any nitrate administration, and screen for recreational amyl nitrite ('poppers')."
      zh_hk: "嚴禁同時處方；使用任何硝酸甘油前必須確認24小時內未服用西地那非（他達拉非為48小時）。"
    patient_safety_net:
      en: "Never use erectile dysfunction medicines such as sildenafil together with GTN heart spray/tablets or nitrates. If both were taken and you feel dizzy, faint, or have chest pain, seek emergency hospital care immediately."
      zh_hk: "切勿將西地那非等助勃藥物與硝酸甘油（脷底丸／心絞痛噴霧）併用。如不慎同服並出現頭暈、昏厥或胸痛，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:cotrimoxazole_g6pd_haemolysis
    source_id: drug:co_trimoxazole
    relation: CONTRAINDICATED_IN
    target_id: pgx:g6pd_deficiency
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: g6pd_deficient, op: eq, value: true }
        - { fact: has_concept, op: is_a, value: "pgx:g6pd_deficiency" }
    clinician_rationale:
      en: "Sulfamethoxazole in co-trimoxazole is a potent oxidative agent contraindicated in G6PD deficiency due to risk of severe acute intravascular haemolysis."
      zh_hk: "複方新諾明含磺胺甲噁唑，屬強氧化性藥物，蠶豆症 (G6PD) 患者禁用，以免誘發嚴重急性溶血性貧血。"
    clinician_action_prompt:
      en: "HARD-BLOCK co-trimoxazole in G6PD-deficient patients; select G6PD-safe alternative antimicrobial per indication and local antibiogram."
      zh_hk: "蠶豆症患者嚴禁處方複方新諾明，須改用安全替代抗生素。"
    patient_safety_net:
      en: "If you have G6PD deficiency and took co-trimoxazole, seek urgent medical care immediately if you notice dark tea-coloured urine, yellowing of the eyes/skin, extreme paleness, or shortness of breath."
      zh_hk: "如患有蠶豆症並曾服用複方新諾明，一旦出現茶色小便、眼白或皮膚發黃、面色蒼白或氣促，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:cotrimoxazole_warfarin_inr_spike
    source_id: drug:co_trimoxazole
    relation: INTERACTS_WITH
    target_id: drug:warfarin
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Sulfamethoxazole strongly inhibits CYP2C9 clearance of S-warfarin and displaces protein binding, causing rapid dangerous INR elevation and major haemorrhage."
      zh_hk: "複方新諾明強烈抑制 S-華法林的 CYP2C9 代謝，可於數日內引致 INR 急劇飆升及嚴重內出血風險。"
    clinician_action_prompt:
      en: "Avoid co-trimoxazole in warfarinised patients wherever an alternative exists; if unavoidable, proactively reduce warfarin dose and recheck INR within 3-4 days."
      zh_hk: "服用華法林患者應盡量避免使用複方新諾明；如無法替代，須預先調整華法林劑量並於3至4日內覆驗 INR。"
    patient_safety_net:
      en: "If prescribed antibiotics while taking warfarin, alert your doctor/pharmacist immediately and seek urgent care for unusual bruising, nose/gum bleeding, black stools, or red/pink urine."
      zh_hk: "服用華法林期間如獲處方抗生素，請立即通知醫生／藥劑師；如出現異常瘀青、流牙血／鼻血、黑便或血尿，請立即求醫。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:cotrimoxazole_methotrexate_pancytopenia
    source_id: drug:co_trimoxazole
    relation: INTERACTS_WITH
    target_id: drug:methotrexate
    bidirectional: true
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Co-trimoxazole + methotrexate causes synergistic folate antagonism and reduced renal methotrexate clearance, leading to fatal pancytopenia, agranulocytosis, and mucositis."
      zh_hk: "複方新諾明與甲氨蝶呤合用會造成雙重葉酸拮抗及減慢甲氨蝶呤腎臟排泄，可引致致命全血細胞減少症及口腔潰瘍，屬絕對禁忌。"
    clinician_action_prompt:
      en: "HARD-BLOCK co-trimoxazole in patients taking methotrexate (even low-dose weekly RA/psoriasis regimens); if co-dispensed, check urgent CBC/RFT and consider folinic acid rescue with specialist."
      zh_hk: "服用甲氨蝶呤者嚴禁處方複方新諾明；如已不慎併用，須立即檢驗全血細胞計數及聯絡專科考慮亞葉酸解救。"
    patient_safety_net:
      en: "Do not take co-trimoxazole (Bactrim/Septrin) while taking methotrexate. If both were taken, contact a doctor urgently and seek emergency care for fever, sore throat, mouth ulcers, or unexplained bruising."
      zh_hk: "服用甲氨蝶呤期間切勿服用複方新諾明。如已誤服，請立即聯絡醫生；若出現發燒、喉嚨痛、嚴重口瘡或異常瘀傷，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:cotrimoxazole_raas_hyperkalaemia
    source_id: drug:co_trimoxazole
    relation: INTERACTS_WITH
    target_id: drug_class:raas_agent
    bidirectional: true
    severity: high
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Trimethoprim acts like amiloride on collecting duct ENaC channels; combined with ACEi/ARBs (especially in older adults or CKD) it significantly increases severe hyperkalaemia and sudden cardiac death risk."
      zh_hk: "複方新諾明內的甲氧苄啶會抑制腎臟排鉀，與 ACEi/ARB 降血壓藥合用（尤見於長者或慢性腎病患者）會顯著增加嚴重高血鉀及心律失常風險。"
    clinician_action_prompt:
      en: "Select a non-hyperkalaemic alternative antibiotic where possible; if co-trimoxazole required, monitor serum K+ and creatinine within 3-7 days."
      zh_hk: "宜改選其他抗生素；如必須使用，須於3至7日內覆檢血鉀及腎功能。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:ciprofloxacin_tb_masking_and_tendon
    source_id: drug_class:fluoroquinolone
    relation: CONTRAINDICATED_IN
    target_id: cond:pulmonary_tb
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: has_concept, op: is_a, value: "cond:pulmonary_tb" }
        - { fact: has_concept, op: is_a, value: "cond:cap" }
        - { fact: has_concept, op: is_a, value: "rfe:cough" }
    clinician_rationale:
      en: "Empiric fluoroquinolone (ciprofloxacin/levofloxacin) in suspected pulmonary TB or uninvestigated subacute cough transiently suppresses M. tuberculosis, delaying TB diagnosis, causing false-negative sputum smears/cultures, and promoting fluoroquinolone-resistant MDR/XDR-TB; also carries Achilles tendon rupture, QTc prolongation, and aortic aneurysm cautions."
      zh_hk: "在未排除肺結核或持續咳嗽情況下經驗性處方氟喹諾酮（如環丙沙星），會暫時抑制結核菌而掩蓋病情、延誤診斷及誘發耐藥結核；亦須留意跟腱斷裂及QT間期延長風險。"
    clinician_action_prompt:
      en: "Do NOT prescribe empiric fluoroquinolone for cough/respiratory infection until pulmonary TB is excluded (CXR + sputum AFB/NAAT); verify age/steroid tendon risk and QTc before any fluoroquinolone."
      zh_hk: "在完成胸肺X光及痰液結核菌排查前，切勿處方氟喹諾酮治療咳嗽或肺炎；同時評估跟腱炎及QT延長風險。"
    patient_safety_net:
      en: "If prescribed a fluoroquinolone antibiotic (such as ciprofloxacin), stop and contact your doctor promptly if you develop ankle/heel tendon pain or swelling, sudden severe chest/back pain, or nerve tingling."
      zh_hk: "服用環丙沙星等喹諾酮抗生素期間，如出現腳跟／跟腱疼痛腫脹、突發劇烈胸背痛或手腳麻痺，請暫停並盡快聯絡醫生。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:entecavir_no_gap_hbv_flare
    source_id: drug:entecavir
    relation: MONITORED_BY
    target_id: panel:lft
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 90
      repeat_interval_days: 180
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Entecavir is a NO-GAP nucleoside analogue: abrupt interruption or supply gap triggers severe HBV viral rebound, acute hepatic flare, and potentially fatal hepatic decompensation (especially in cirrhosis)."
      zh_hk: "恩替卡韋屬不可中斷用藥：突然停服或斷藥會引致乙肝病毒反彈、嚴重急性肝炎爆發甚至致命肝衰竭（肝硬化患者風險極高）。"
    clinician_action_prompt:
      en: "Ensure uninterrupted prescription continuity and adherence check; NEVER stop entecavir without hepatology direction; monitor ALT, HBV DNA, and 6-monthly HCC surveillance (USG + AFP)."
      zh_hk: "確保藥物供應無縫銜接，未經肝臟專科指示切勿停藥；定期監察肝酵素、乙肝病毒量及每半年肝癌超聲波／AFP篩查。"
    patient_safety_net:
      en: "Never stop taking entecavir on your own or let your supply run out, as sudden stopping can cause a dangerous hepatitis B liver flare. Seek urgent care if you develop yellowing of the eyes/skin, dark urine, severe fatigue, or tummy swelling."
      zh_hk: "切勿自行停服恩替卡韋或讓藥物斷供，以免誘發危險的乙肝爆發。如出現眼白或皮膚發黃、茶色小便、極度疲倦或腹脹，請立即求醫。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:ssri_bipolar_mania_switch
    source_id: drug_class:ssri
    relation: CONTRAINDICATED_IN
    target_id: cond:bipolar_disorder
    severity: high
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Unopposed SSRI monotherapy in bipolar disorder carries high risk of antidepressant-induced affective switch to mania/hypomania, mixed states, agitation, and rapid cycling."
      zh_hk: "躁鬱症患者單獨使用血清素抗抑鬱藥 (SSRI) 易誘發躁狂／輕躁症轉相、混合狀態激動及快速循環發作。"
    clinician_action_prompt:
      en: "Avoid unopposed SSRI monotherapy in confirmed/suspected bipolar disorder; confirm mood stabiliser/antipsychotic cover and consult psychiatry for bipolar depression management."
      zh_hk: "避免於躁鬱症單獨處方SSRI；應核實情緒穩定劑或非典型抗精神病藥覆蓋，並諮詢精神科意見。"
    patient_safety_net:
      en: "Seek prompt medical review if you notice racing thoughts, needing much less sleep than usual, unusual energy/irritability, impulsive spending, or worsening distress after starting or changing mood medication."
      zh_hk: "服藥或調藥後如出現思維奔逸、睡眠需求驟減、異常亢奮暴躁、衝動行為或情緒急劇困擾，請盡快聯絡醫生評估。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:scrotal_torsion_surgical_emergency
    source_id: rf:acute_scrotal_pain_torsion
    relation: RED_FLAG_FOR
    target_id: cond:testicular_torsion
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Acute severe unilateral scrotal pain is testicular torsion until proven otherwise: salvage rate drops sharply after 6 hours of ischaemia — immediate surgical exploration takes priority over outpatient imaging."
      zh_hk: "突發單側陰囊／睪丸劇痛在未排除前一律視作睪丸扭轉處理：缺血超過6小時睪丸壞死風險急升，必須即時轉送急症室作緊急外科手術探查，切勿因等候門診超聲波而延誤。"
    clinician_action_prompt:
      en: "Immediate ED transfer for emergency urology/surgical assessment (nil by mouth; DO NOT delay transfer for outpatient Doppler ultrasound)."
      zh_hk: "立即安排轉送急症室作緊急泌尿外科評估及禁食準備，切勿安排門診超聲波延誤救治。"
    patient_safety_net:
      en: "Sudden severe testicle or scrotal pain — especially with tummy pain, nausea, or vomiting — is a time-critical emergency. Go to emergency hospital care immediately and do not eat or drink on the way."
      zh_hk: "突發劇烈睪丸或陰囊疼痛（尤其伴作悶嘔吐或下腹痛）屬爭分奪秒的外科急症，請立即前往急症室，途中切勿進食或飲水。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:breast_lump_red_flag_triple_assessment
    source_id: rf:breast_lump_skin_dimpling_nipple
    relation: RED_FLAG_FOR
    target_id: cond:breast_cancer
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "Hard/fixed breast lump, skin dimpling/peau d'orange, new nipple inversion, unilateral bloody discharge, or axillary lymphadenopathy requires urgent diagnostic triple assessment (clinical exam + diagnostic imaging + tissue biopsy) — never defer to routine screening mammography."
      zh_hk: "堅硬固定乳房腫塊、皮膚凹陷／橙皮紋、新發乳頭內陷、單側血性分泌物或腋下淋巴腫大，必須盡快安排診斷性三聯評估（臨床檢查、診斷影像及組織活檢），不可單靠一般篩查處理。"
    clinician_action_prompt:
      en: "Arrange urgent diagnostic breast imaging (mammogram + ultrasound if >=35y; targeted ultrasound +/- mammogram if <35y) and fast-track breast clinic/surgical referral for core biopsy."
      zh_hk: "盡快安排診斷性乳房造影／超聲波檢查，並優先轉介乳腺外科作三聯評估及穿刺活檢。"
    patient_safety_net:
      en: "A new breast lump, skin dimpling, nipple retraction, bloody nipple discharge, or armpit lump needs prompt face-to-face doctor assessment and diagnostic scans — arrange an urgent clinic review."
      zh_hk: "新發乳房硬塊、皮膚凹陷、乳頭內陷、血性分泌物或腋下硬塊均須盡快由醫生面診及安排診斷檢查，請盡快預約優先診症。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:post_travel_malaria_emergency
    source_id: rf:post_travel_malaria_fever
    relation: RED_FLAG_FOR
    target_id: cond:malaria
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Fever in a traveller returning from a malaria-endemic area (within 3-12 months) is Plasmodium falciparum malaria until excluded by same-day thick/thin blood films + RDT — deterioration to cerebral malaria or shock can occur within hours."
      zh_hk: "曾到訪瘧疾流行地區返抵後出現發燒，必須視作惡性瘧疾急症，即日安排急症室厚薄血片及快速抗原檢測；惡性瘧疾可於數小時內惡化至腦型瘧疾或休克。"
    clinician_action_prompt:
      en: "Immediate same-day ED referral for urgent malaria thick/thin blood films + RDT (repeat x3 over 48h if initially negative), CBC/platelets, LFT, RFT, lactate, blood cultures (enteric fever/melioidosis), and dengue NS1/PCR."
      zh_hk: "立即即日轉送急症室作緊急瘧疾血片及快速測試（初陰性須48小時內重驗）、血常規、肝腎功能、血培養及登革熱排查。"
    patient_safety_net:
      en: "Fever after returning from tropical or malaria-risk travel requires urgent same-day hospital assessment — go to emergency hospital care immediately, especially if you have shaking chills, severe headache, yellowing eyes, confusion, or bleeding."
      zh_hk: "外遊熱帶或瘧疾風險地區後發燒必須即日緊急評估，請立即前往急症室（尤其出現發冷打震、劇烈頭痛、黃疸、神志不清或出血）。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:severe_alcohol_withdrawal_dt_emergency
    source_id: rf:severe_alcohol_withdrawal_dt
    relation: RED_FLAG_FOR
    target_id: cond:alcohol_use_disorder
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Severe alcohol withdrawal (marked autonomic hyperactivity, hallucinations, withdrawal seizures, or delirium tremens) carries significant mortality and risk of Wernicke encephalopathy — requires immediate hospital management with parenteral thiamine BEFORE glucose and symptom-triggered benzodiazepines."
      zh_hk: "嚴重酒精戒斷（劇烈震顫、幻覺、戒斷抽筋或震顫性譫妄）具致命風險，並易併發韋尼克腦病變，必須立即送院於輸注葡萄糖前先給予靜脈維他命B1（硫胺素）及苯二氮平類戒斷治療。"
    clinician_action_prompt:
      en: "Immediate ED transfer for inpatient alcohol withdrawal protocol: IV/IM thiamine BEFORE any IV dextrose, CIWA-Ar guided diazepam/lorazepam, electrolytes (K+/Mg2+/PO4), and seizure monitoring."
      zh_hk: "立即轉送急症室啟動住院戒斷方案：先給予高劑量靜脈／肌肉注射硫胺素 (Thiamine)，配合鎮靜戒斷藥物及電解質監察。"
    patient_safety_net:
      en: "Stopping heavy alcohol use suddenly can be life-threatening. If you or someone with you has severe shaking, heavy sweating, confusion, seeing or hearing things, or a seizure, seek emergency hospital care immediately."
      zh_hk: "長期大量飲酒者突然戒酒可危及生命。如出現劇烈手震、大汗、意識混亂、幻覺或抽筋，請立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:acute_psychosis_harm_risk_crisis
    source_id: rf:acute_psychosis_harm_risk
    relation: RED_FLAG_FOR
    target_id: cond:acute_psychosis_schizophrenia
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Acute psychosis with command hallucinations, severe persecutory delusions, marked disorganisation, or imminent risk of harm to self/others requires urgent psychiatric crisis assessment and medical exclusion of organic/substance-induced delirium."
      zh_hk: "急性思覺失調伴指令性幻聽、嚴重妄想、思維混亂或即時自傷／傷人風險，必須立即啟動緊急精神科危機評估及排查器質性或藥物誘發譫妄。"
    clinician_action_prompt:
      en: "Immediate safety escalation: keep patient/staff safe, involve urgent psychiatric crisis team / ED transfer per local mental health statutory pathway, and exclude organic/toxic precipitants."
      zh_hk: "立即啟動安全及緊急精神科危機轉介／急症室評估，確保患者及在場人士安全並排查器質性誘因。"
    patient_safety_net:
      en: "If you or someone with you is experiencing distressing voices, intense fear, severe confusion, or thoughts of harming yourself or anyone else, seek emergency hospital care or contact a 24-hour mental health crisis service immediately."
      zh_hk: "如你或身邊人士出現困擾的幻聽、極度恐懼混亂，或有自傷或傷害他人的念頭，請立即前往急症室或致電24小時精神健康危機支援熱線。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:varicella_pregnancy_vzig_urgent
    source_id: cond:varicella_chickenpox
    relation: RED_FLAG_FOR
    target_id: cond:pregnancy_normal
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    when:
      any:
        - { fact: pregnant, op: eq, value: true }
        - { fact: has_concept, op: is_a, value: "cond:pregnancy_normal" }
    clinician_rationale:
      en: "Primary varicella (chickenpox) in pregnancy carries high maternal risk of life-threatening varicella pneumonitis (especially >=20 weeks) and fetal/neonatal risks (congenital varicella syndrome <20w; severe neonatal varicella if maternal rash within 5 days before to 2 days after delivery)."
      zh_hk: "孕婦感染水痘具極高母體水痘肺炎風險（尤見於懷孕20週後）及胎兒／新生兒併發症風險（先天性水痘綜合症或嚴重圍產期新生兒水痘）。"
    clinician_action_prompt:
      en: "Urgent same-day obstetric/infectious diseases consultation: confirm immunity/exposure timing (VZIG within 10 days for non-immune exposed pregnant women); start oral aciclovir within 24h of rash onset if active disease, or immediate ED transfer for IV aciclovir if respiratory/neuro/haemorrhagic symptoms."
      zh_hk: "即日緊急轉介產科／感染科評估：未具免疫力而曾接觸水痘之孕婦須評估10日內注射水痘免疫球蛋白 (VZIG)；已出疹者須24小時內評估抗病毒治療，如有氣促咳嗽立即送急症室。"
    patient_safety_net:
      en: "Chickenpox or close contact with chickenpox during pregnancy needs urgent same-day medical advice. Do not sit in a general waiting room without calling ahead; go to emergency hospital care immediately if you develop a cough, shortness of breath, chest pain, or severe rash."
      zh_hk: "懷孕期間感染或密切接觸水痘均須即日緊急聯絡醫生（求診前請先致電通知診所安排隔離，切勿直接進入普通候診室）；如出現咳嗽、氣促或胸痛，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:olanzapine_monitored_by_hba1c
    source_id: drug:olanzapine
    relation: MONITORED_BY
    target_id: obs:hba1c
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 90
      repeat_interval_days: 180
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Olanzapine carries the highest cardiometabolic risk among common primary care antipsychotics (rapid weight gain, dyslipidaemia, insulin resistance, and new-onset T2DM/DKA) — requires structured baseline, 3-month, and 6-12 monthly HbA1c, fasting lipids, weight/waist, and BP monitoring."
      zh_hk: "奧氮平具顯著心血管代謝風險（體重急增、高血脂及新發糖尿病），必須於用藥前、首3個月及之後每6至12個月監察糖化血紅素 (HbA1c)、血脂、體重及血壓。"
    clinician_action_prompt:
      en: "Order HbA1c/fasting glucose + fasting lipids + weight/BMI/BP; initiate early lifestyle intervention or metformin/specialist review if rapid weight gain (>5-7%) or dysglycaemia develops."
      zh_hk: "安排檢測糖化血紅素、空腹血脂、體重及血壓；如體重急增或血糖升高，及早介入生活干預及與專科檢視用藥。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:severe_anorexia_medical_emergency
    source_id: rf:severe_anorexia_bradycardia_hypok
    relation: RED_FLAG_FOR
    target_id: cond:anorexia_nervosa
    severity: critical
    urgency_floor: 4
    clinic_port_family: abnormal_result
    clinician_rationale:
      en: "Bradycardia (<50 bpm), postural hypotension/syncope, hypothermia, hypokalaemia (<3.0 mmol/L), hypoglycaemia, or severe malnutrition (BMI <14) in an eating disorder signals imminent cardiac arrhythmia and refeeding syndrome risk."
      zh_hk: "厭食症或進食失調患者出現心搏過緩（<50次/分）、低血壓昏厥、低體溫、低血鉀（<3.0）或極度營養不良，屬致命心律失常及再餵養綜合症高危急症。"
    clinician_action_prompt:
      en: "Immediate ED transfer for inpatient medical stabilisation: ECG (QTc/bradycardia), electrolytes (K+/Mg2+/PO4), BGL, LFT/FBC, thiamine, and supervised refeeding protocol."
      zh_hk: "立即轉送急症室作內科穩定及監護：安排心電圖、血鉀／血鎂／血磷、血糖及專科再餵養方案。"
    patient_safety_net:
      en: "Fainting, severe dizziness on standing, chest pain, very slow or racing heartbeat, or severe weakness with restricted eating or purging is a medical emergency — seek emergency hospital care immediately."
      zh_hk: "進食極少或扣喉期間如出現昏厥、站立嚴重頭暈、胸痛、心跳過慢／心悸或極度乏力，屬內科急症，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:naltrexone_opioid_precipitated_withdrawal
    source_id: drug:naltrexone
    relation: INTERACTS_WITH
    target_id: drug_class:opioid
    bidirectional: true
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Naltrexone is a competitive mu-opioid receptor antagonist: co-use with opioids precipitates severe acute opioid withdrawal in dependent patients and blocks analgesia in acute pain/surgery."
      zh_hk: "納曲酮為鴉片受體拮抗劑，與鴉片類藥物合用會在依賴者身上誘發劇烈急性戒斷反應，並阻斷止痛藥效。"
    clinician_action_prompt:
      en: "HARD-BLOCK concurrent naltrexone and opioids; confirm >=7-10 days opioid-free before starting naltrexone, and warn patient against attempting to override blockade with high-dose opioids (fatal overdose risk)."
      zh_hk: "嚴禁併用納曲酮與鴉片類藥物；開始納曲酮前必須確認停用鴉片類至少7至10日，並提醒患者切勿自行加量止痛藥以防過量致命。"
    patient_safety_net:
      en: "Do not take any opioid painkillers (including codeine or tramadol) while taking naltrexone, and never try to take extra opioid doses to overcome the block. Tell emergency or surgical staff that you take naltrexone."
      zh_hk: "服用納曲酮期間切勿服用任何含可待因、曲馬多等鴉片類止痛藥，亦切勿自行增加止痛藥劑量以免致命過量；就醫或手術前請主動告知醫護人員。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: edge:estradiol_mht_unopposed_endometrial_risk
    source_id: drug:estradiol_mht
    relation: CONTRAINDICATED_IN
    target_id: cond:endometrial_cancer
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: has_concept, op: is_a, value: "cond:endometrial_cancer" }
        - { fact: has_concept, op: is_a, value: "cond:breast_cancer" }
        - { fact: has_concept, op: is_a, value: "rf:postmenopausal_bleeding" }
        - not: { fact: has_concept, op: is_a, value: "drug_class:progestogen" }
    clinician_rationale:
      en: "Systemic oestrogen MHT is contraindicated in oestrogen-sensitive malignancy (endometrial or breast cancer) and uninvestigated vaginal bleeding; in women with an intact uterus, unopposed systemic estradiol significantly raises endometrial carcinoma risk."
      zh_hk: "系統性雌激素更年期治療禁用於子宮內膜癌、乳癌及未明陰道出血患者；凡保留子宮女性必須合併黃體酮以防子宮內膜癌。"
    clinician_action_prompt:
      en: "Hard-stop systemic estradiol in endometrial/breast cancer; verify concurrent progestogen (e.g. micronised progesterone or LNG-IUS) for every MHT patient with an intact uterus."
      zh_hk: "子宮內膜癌或乳癌患者停用系統性雌激素；所有保留子宮之更年期治療患者必須核實已配搭黃體酮保護內膜。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

# ===========================================================================
# PRESENTATION FRAMES (5) — Murtagh PROMPT + openEHR Positive Exclusions + Safety Netting
# ===========================================================================
frames:
  - id: frame:breast_lump_pain
    rfe_concept_id: rfe:breast_lump_pain
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_fibroadenoma, concept_id: cond:breast_fibroadenoma_benign, prevalence_note: "Most common cause of discrete mobile lump in women <35y; cysts/fibrocystic change 35-50y" }
        - { id: p_mastitis, concept_id: cond:mastitis, key_discriminators: ["lactating mother", "erythema", "warmth", "tenderness", "fever"] }
        - { id: p_msk_chest, concept_id: cond:msk_chest_wall_pain, key_discriminators: ["non-cyclic focal chest wall / costochondral tenderness", "normal breast exam"] }
      serious_not_to_be_missed:
        - { id: s_breast_ca, concept_id: cond:breast_cancer, key_discriminators: ["hard/irregular/fixed lump", "skin dimpling/peau d'orange", "new nipple inversion", "unilateral bloody discharge", "axillary node", "ANY new lump >=35y or male breast lump"] }
        - { id: s_abscess_sepsis, concept_id: cond:sepsis, key_discriminators: ["fluctuant painful mass with high fever/rigors (breast abscess / severe mastitis)"] }
      pitfalls_often_missed:
        - { id: o_preg_lact, concept_id: cond:pregnancy_normal, key_discriminators: ["early pregnancy breast tenderness/nodularity — never assume pregnancy lump is benign without ultrasound"] }
        - { id: o_drugs_gynae, concept_id: cond:drug_adverse_effect, key_discriminators: ["COC/MHT mastalgia; spironolactone/antipsychotics/cimetidine gynaecomastia or galactorrhoea"] }
      masquerades:
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review exogenous hormones (COC/MHT), antipsychotics (hyperprolactinaemia), and spironolactone." } }
        - { id: mq_malignancy, tier: primary, masquerade: malignancy, concept_id: cond:breast_cancer, clue_prompt: { en: "Inflammatory breast cancer can masquerade as non-resolving mastitis — if erythema/oedema fails to clear after antibiotics, mandate urgent biopsy." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of breast cancer, family history (BRCA/first-degree relatives), and impact on breastfeeding if postpartum." }
    positive_exclusions:
      - id: ex_breast_red_flags
        finding_concept_id: rf:breast_lump_skin_dimpling_nipple
        question: { en: "Have you noticed a hard or fixed lump, skin dimpling or orange-peel texture, newly inverted nipple, bloody discharge from one nipple, or a lump in your armpit?", zh_hk: "請問你有否察覺堅硬或固定的乳房硬塊、皮膚凹陷或橙皮紋、新發乳頭內陷、單側乳頭流出帶血分泌物，或腋下有硬塊？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_breast_weight_loss
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you had unexplained weight loss, persistent bone pain, or night sweats?", zh_hk: "請問你近期有沒有無故體重下降、持續骨痛或夜間盜汗？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_breast_sepsis
        finding_concept_id: rf:confusion
        question: { en: "If the breast is red, hot, and painful, do you have a high fever, shaking chills, rapid heartbeat, or feel faint/unwell?", zh_hk: "如乳房紅腫熱痛，請問你有否發高燒、發冷打震、心跳急促或感到頭暈極度不適？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_breast_sepsis
        trigger_condition: { en: "Spreading breast redness/swelling with high fever, rigors, dizziness, or rapidly worsening severe pain", zh_hk: "乳房紅腫擴散並伴高燒、發冷打震、頭暈或劇痛迅速惡化" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "If a red, painful breast is accompanied by a high fever, shaking chills, dizziness, or feeling severely unwell, seek immediate emergency hospital care."
          zh_hk: "如乳房紅腫熱痛伴隨高燒、發冷打震、頭暈或全身極度不適，請立即前往急症室。"
      - id: sn_breast_triple_review
        trigger_condition: { en: "Any new breast lump, skin/nipple change, or breast redness not improving within 48 hours of antibiotics", zh_hk: "任何新發現乳房硬塊、皮膚／乳頭變化，或乳腺炎服藥48小時後未見改善" }
        timeframe_hours: 48
        escalation_channel: urgent_clinic_callback
        patient_instruction:
          en: "Every new breast lump or nipple/skin change requires in-person clinical examination and diagnostic imaging. Contact the clinic promptly for a face-to-face review, or sooner if mastitis symptoms do not improve within 48 hours."
          zh_hk: "任何新發乳房硬塊或乳頭／皮膚變化均須由醫生面診及安排診斷影像檢查；請盡快預約診症，若乳腺炎服藥48小時未見改善亦請立即覆診。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: frame:scrotal_pain_swelling
    rfe_concept_id: rfe:scrotal_pain_swelling
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_epididymo, concept_id: cond:epididymo_orchitis, prevalence_note: "Gradual-onset unilateral pain/swelling with dysuria/discharge (STI <35y; enteric UTI >=35y)" }
        - { id: p_prostatitis, concept_id: cond:prostatitis, key_discriminators: ["perineal/suprapubic pain", "fever", "dysuria", "tender boggy prostate"] }
        - { id: p_renal_colic, concept_id: cond:renal_colic, key_discriminators: ["loin-to-groin colicky pain radiating to testis", "normal scrotal exam", "microscopic haematuria"] }
      serious_not_to_be_missed:
        - { id: s_torsion, concept_id: cond:testicular_torsion, key_discriminators: ["sudden severe pain (often waking from sleep)", "nausea/vomiting", "high-riding transverse testis", "absent cremasteric reflex — 6-HOUR SURGICAL EMERGENCY"] }
        - { id: s_uro_ca, concept_id: cond:urologic_malignancy, key_discriminators: ["painless firm intratesticular lump/heaviness in young men 15-45y -> urgent scrotal ultrasound"] }
        - { id: s_sepsis_fournier, concept_id: cond:sepsis, key_discriminators: ["rapidly spreading scrotal erythema/crepitus/severe pain out of proportion + fever/diabetes -> Fournier gangrene emergency"] }
      pitfalls_often_missed:
        - { id: o_chlamydia_ng, concept_id: cond:gonorrhoea, key_discriminators: ["STI epididymo-orchitis in sexually active men — send first-void urine CT/NG NAAT"] }
        - { id: o_aortic, concept_id: cond:aortic_dissection, key_discriminators: ["older male with acute flank/groin/scrotal pain + hypotension (ruptured AAA / aortic emergency)"] }
      masquerades:
        - { id: mq_uti, tier: primary, masquerade: uti, concept_id: cond:uti, clue_prompt: { en: "Always collect first-void urine for CT/NG NAAT plus MSU culture before antibiotics in suspected epididymo-orchitis." } }
        - { id: mq_malignancy, tier: primary, masquerade: malignancy, concept_id: cond:urologic_malignancy, clue_prompt: { en: "Up to 10-15% of testicular tumours present with acute pain or mimic epididymitis — re-examine and ultrasound if swelling does not fully resolve." } }
      patient_hidden_agenda_prompts:
        - { en: "Address embarrassment, fear of testicular cancer or infertility, and sensitively screen sexual/STI exposure." }
    positive_exclusions:
      - id: ex_torsion
        finding_concept_id: rf:acute_scrotal_pain_torsion
        question: { en: "Did the testicle pain start suddenly and severely (within minutes to hours), or do you have nausea, vomiting, or severe lower tummy pain?", zh_hk: "請問睪丸痛是否突然劇烈發作，或伴隨作悶、嘔吐或嚴重下腹痛？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_scrotal_syncope
        finding_concept_id: rf:syncope
        question: { en: "Do you have a high fever, shaking chills, spreading skin redness/darkening, or feel faint or light-headed?", zh_hk: "請問你有否發高燒、發冷打震、陰囊皮膚迅速紅腫發黑，或感到頭暈欲暈？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_scrotal_emergency
        trigger_condition: { en: "Sudden severe testicle pain, nausea/vomiting, high fever/chills, spreading redness, or faintness", zh_hk: "突發劇烈睪丸痛、作悶嘔吐、高燒打震、皮膚紅腫擴散或頭暈" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Sudden or severe testicular pain can be a surgical emergency where every hour matters. Go to emergency hospital care immediately and avoid eating or drinking until assessed."
          zh_hk: "突發或劇烈睪丸痛可能是爭分奪秒的外科急症，請立即前往急症室，評估前請勿進食或飲水。"
      - id: sn_scrotal_review
        trigger_condition: { en: "Any painless testicular lump/swelling, or scrotal infection not improving within 48 hours of treatment", zh_hk: "任何無痛睪丸硬塊／腫脹，或感染治療48小時內未見改善" }
        timeframe_hours: 48
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange prompt face-to-face doctor review for any new testicular lump or swelling, and return urgently within 48 hours if pain or swelling worsens or fails to settle."
          zh_hk: "任何新發睪丸硬塊或腫脹均須盡快面診及檢查；如疼痛或腫脹惡化或於48小時內未見好轉，請立即覆診。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: frame:urethral_vaginal_discharge
    rfe_concept_id: rfe:urethral_vaginal_discharge
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_bv, concept_id: cond:bacterial_vaginosis, prevalence_note: "Thin grey-white malodorous vaginal discharge without marked itch/inflammation" }
        - { id: p_vvc, concept_id: cond:vulvovaginal_candidiasis, key_discriminators: ["vulval itch/soreness", "thick curdy white discharge", "recent antibiotics/diabetes/pregnancy"] }
        - { id: p_chlamydia, concept_id: cond:chlamydia_sti, key_discriminators: ["often asymptomatic", "mucopurulent discharge", "dysuria", "postcoital/intermenstrual bleeding", "new partner"] }
        - { id: p_gonorrhoea, concept_id: cond:gonorrhoea, key_discriminators: ["purulent urethral/cervical discharge", "dysuria", "extragenital pharyngeal/rectal exposure"] }
      serious_not_to_be_missed:
        - { id: s_pid, concept_id: cond:pelvic_inflammatory_disease, key_discriminators: ["lower abdominal/pelvic pain", "deep dyspareunia", "fever", "cervical motion tenderness — treat empirically early to protect fertility"] }
        - { id: s_ectopic, concept_id: cond:ectopic_pregnancy, key_discriminators: ["reproductive-age female with pelvic pain or spotting -> ALWAYS exclude pregnancy"] }
        - { id: s_syphilis, concept_id: cond:syphilis, key_discriminators: ["painless genital/oral ulcer (chancre)", "palmoplantar rash", "lymphadenopathy — rising rates in HK & AU; ALWAYS test blood serology + HIV"] }
        - { id: s_hiv, concept_id: cond:hiv, key_discriminators: ["seroconversion flu-like rash/fever", "offer full opt-out HIV Ag/Ab + syphilis serology at every STI check"] }
      pitfalls_often_missed:
        - { id: o_hsv, concept_id: cond:genital_herpes, key_discriminators: ["painful grouped vesicles/ulcers", "dysuria/urinary retention", "first-episode systemic malaise -> swab PCR + start aciclovir/valaciclovir"] }
        - { id: o_cervical_ca, concept_id: cond:cervical_cancer, key_discriminators: ["persistent blood-stained/offensive discharge or postcoital bleeding -> speculum exam"] }
      masquerades:
        - { id: mq_hiv, tier: secondary, masquerade: hiv, concept_id: cond:hiv, clue_prompt: { en: "Every STI presentation is a high-yield opportunity for full STI panel (CT/NG NAAT at exposed sites, HIV Ag/Ab, syphilis serology, HBV/HCV if indicated) and partner notification." } }
        - { id: mq_diabetes, tier: primary, masquerade: diabetes, concept_id: cond:t2dm, clue_prompt: { en: "Recurrent vulvovaginal candidiasis or balanitis — check HbA1c/glucose (and SGLT2 inhibitor use)." } }
      patient_hidden_agenda_prompts:
        - { en: "Ensure strict confidentiality and non-judgemental care; ask about partner notification support, contraception/PrEP, and sexual safety/coercion." }
    positive_exclusions:
      - id: ex_sti_ectopic_pid
        finding_concept_id: rf:ectopic_rupture_signs
        question: { en: "Are you having severe lower tummy or pelvic pain, high fever, pain during deep intercourse, or could you possibly be pregnant with pain or bleeding?", zh_hk: "請問你有沒有劇烈下腹／盆腔痛、發高燒、深層性交痛，或有可能懷孕並伴隨腹痛／見紅？" }
        urgency_if_present: 4
        mandatory: true
        when:
          fact: sex
          op: ne
          value: "M"
      - id: ex_sti_scrotal
        finding_concept_id: rf:acute_scrotal_pain_torsion
        question: { en: "If male, are you having sudden or severe testicle pain or swelling?", zh_hk: "如為男性，請問你有沒有突發或劇烈睪丸疼痛或腫脹？" }
        urgency_if_present: 4
        mandatory: true
        when:
          fact: sex
          op: eq
          value: "M"
      - id: ex_sti_bleed
        finding_concept_id: rf:heavy_bleeding_bruising
        question: { en: "Are you having unexplained heavy bleeding, bleeding after sex, or painful sores making it hard to pass urine?", zh_hk: "請問你有沒有異常大量出血、性交後出血，或陰部潰瘍疼痛致無法小便？" }
        urgency_if_present: 3
        mandatory: true
    safety_netting:
      - id: sn_sti_emergency
        trigger_condition: { en: "Severe pelvic/abdominal pain, high fever, vomiting, faintness, unable to pass urine, or sudden severe testicle pain", zh_hk: "劇烈下腹／盆腔痛、高燒、嘔吐、頭暈、無法排尿或突發劇烈睪丸痛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency hospital care if you develop severe lower tummy or testicle pain, high fever, vomiting, faintness, or cannot pass urine."
          zh_hk: "如出現劇烈下腹痛或睪丸痛、發高燒、嘔吐、頭暈或無法排尿，請立即前往急症室。"
      - id: sn_sti_followup
        trigger_condition: { en: "Awaiting STI test results, starting treatment, or symptoms not settling within 48-72 hours", zh_hk: "等候性病化驗結果、治療期間或徵狀於48至72小時內未見改善" }
        timeframe_hours: 72
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Avoid sexual contact until testing and any required treatment (including for partners) are completed, and arrange prompt doctor review if symptoms worsen or fail to improve within 48-72 hours."
          zh_hk: "在完成化驗、治療及伴侶同步評估前請暫停性接觸；如徵狀惡化或於48至72小時內未見改善，請盡快覆診。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: frame:travel_fever_illness
    rfe_concept_id: rfe:travel_fever_illness
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_dengue, concept_id: cond:dengue, prevalence_note: "Southeast Asia / tropical urban travel (incubation 3-14d): high fever, retro-orbital headache, myalgia, rash, thrombocytopenia — NO NSAIDs" }
        - { id: p_gastro, concept_id: cond:gastroenteritis, key_discriminators: ["watery/bacterial traveller diarrhoea", "food/water exposure"] }
        - { id: p_flu_urti, concept_id: cond:influenza, key_discriminators: ["cosmopolitan respiratory infection acquired on flights/transit"] }
        - { id: p_rrv, concept_id: cond:ross_river_virus, key_discriminators: ["AU regional/coastal mosquito exposure", "polyarthralgia + rash + fatigue"] }
      serious_not_to_be_missed:
        - { id: s_malaria, concept_id: cond:malaria, key_discriminators: ["ANY fever after malaria-endemic travel (Africa, South/SE Asia, PNG, Oceania) -> URGENT same-day blood film + RDT"] }
        - { id: s_typhoid, concept_id: cond:enteric_fever_typhoid, key_discriminators: ["South/SE Asia travel", "stepwise fever", "relative bradycardia", "abdominal pain/constipation or diarrhoea -> blood cultures"] }
        - { id: s_melioidosis, concept_id: cond:melioidosis, key_discriminators: ["HK (post-typhoon/soil/water) or Northern AU wet season + diabetes/CKD/alcohol -> fulminant pneumonia/sepsis/abscesses"] }
        - { id: s_sepsis_mening, concept_id: cond:sepsis, key_discriminators: ["rigors", "hypotension", "jaundice", "confusion", "petechiae — immediate ED transfer"] }
        - { id: s_measles, concept_id: cond:measles, key_discriminators: ["unvaccinated/unknown MMR + fever + 3Cs (cough/coryza/conjunctivitis) + cephalocaudal rash -> AIRBORNE ISOLATION + public health notification"] }
      pitfalls_often_missed:
        - { id: o_qfever, concept_id: cond:q_fever, key_discriminators: ["rural AU/livestock/abattoir/kangaroo aerosol exposure", "fever + severe headache + transaminitis/pneumonia"] }
        - { id: o_tb_hiv, concept_id: cond:pulmonary_tb, key_discriminators: ["prolonged fever/cough/weight loss; acute HIV seroconversion after travel sexual exposure"] }
      masquerades:
        - { id: mq_baffling_bact, tier: secondary, masquerade: baffling_bacterial, concept_id: cond:melioidosis, clue_prompt: { en: "Take exact geographic itinerary, freshwater/soil/animal/mosquito/sexual exposures, and incubation timeline; notify CHP (HK) or PHU (AU) for notifiable diseases." } }
        - { id: mq_baffling_viral, tier: secondary, masquerade: baffling_viral, concept_id: cond:dengue, clue_prompt: { en: "Avoid NSAIDs/aspirin in all undifferentiated post-travel fever until dengue is excluded." } }
      patient_hidden_agenda_prompts:
        - { en: "Ask about household/travel companions with similar symptoms, unmentioned rural/animal/sexual exposures, and pre-travel vaccination/antimalarial adherence." }
    positive_exclusions:
      - id: ex_travel_malaria
        finding_concept_id: rf:post_travel_malaria_fever
        question: { en: "Have you travelled to a malaria-risk or tropical region in the past 12 months and developed fever, chills/rigors, severe headache, jaundice, or bleeding?", zh_hk: "請問你在過去12個月內有否曾到訪瘧疾或熱帶傳染病流行地區，並出現發燒、發冷打震、劇烈頭痛、黃疸或出血？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_travel_meningism
        finding_concept_id: rf:stiff_neck_meningism
        question: { en: "Do you have a stiff neck, severe headache with sensitivity to bright light, confusion, or a non-blanching skin rash?", zh_hk: "請問你有沒有頸部僵硬、劇烈頭痛畏光、意識混亂或按壓不退色的皮疹？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_travel_bleed_jaundice
        finding_concept_id: rf:jaundice
        question: { en: "Have you noticed yellowing of your eyes/skin, bleeding from gums/nose, persistent vomiting, severe tummy pain, or bloody diarrhoea?", zh_hk: "請問你有沒有眼白／皮膚發黃、流牙血／鼻血、持續嘔吐、劇烈腹痛或血便？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_travel_dyspnoea
        finding_concept_id: rf:dyspnoea_at_rest
        question: { en: "Are you short of breath at rest, having chest pain, or coughing up blood?", zh_hk: "請問你靜止時有沒有氣促、胸痛或咳血？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_travel_emergency
        trigger_condition: { en: "Fever after malaria-endemic travel, confusion, stiff neck, bleeding gums/bruising, persistent vomiting, jaundice, severe abdominal pain, or breathlessness", zh_hk: "曾到瘧疾地區後發燒、意識混亂、頸僵、牙齦／皮膚出血、持續嘔吐、黃疸、劇烈腹痛或氣促" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Go to emergency hospital care immediately and tell triage your exact travel countries and dates. Do not take ibuprofen or aspirin while tropical fever such as dengue is possible. If you have a fever and widespread rash (possible measles), call ahead and wear a mask."
          zh_hk: "請立即前往急症室並清楚告知最近外遊國家及日期。在排除登革熱等熱帶發燒前切勿服用布洛芬或阿士匹靈。如發燒伴全身紅疹（疑似麻疹），求診前請先致電通知並佩戴口罩。"
      - id: sn_travel_review
        trigger_condition: { en: "Persistent fever >48 hours, worsening fatigue/rash/diarrhoea, or fever returning after briefly settling", zh_hk: "發燒持續超過48小時、疲倦／紅疹／腹瀉惡化，或退燒後再次發燒" }
        timeframe_hours: 24
        escalation_channel: same_day_gp
        patient_instruction:
          en: "Arrange urgent same-day doctor review if fever persists, returns after briefly settling, or new symptoms develop — repeat blood tests are often needed in post-travel illness."
          zh_hk: "如持續發燒、退燒後反覆或出現新徵狀，請安排即日醫生覆診及跟進血液化驗。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: frame:substance_alcohol_concern
    rfe_concept_id: rfe:substance_alcohol_concern
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_aud, concept_id: cond:alcohol_use_disorder, prevalence_note: "Screen with AUDIT-C / AUDIT; assess daily units, morning drinking, prior withdrawal seizures/DTs" }
        - { id: p_nicotine, concept_id: cond:nicotine_dependence, key_discriminators: ["Ask-Advise-Help", "Fagerstrom dependence", "offer varenicline / combination NRT + behavioural support"] }
        - { id: p_oud, concept_id: cond:opioid_use_disorder, key_discriminators: ["prescription opioids / codeine / heroin", "offer OAT (buprenorphine/methadone) + take-home naloxone"] }
      serious_not_to_be_missed:
        - { id: s_dt_withdrawal, concept_id: cond:alcohol_use_disorder, key_discriminators: ["tremor, sweats, tachycardia, hallucinations, seizures, delirium tremens — EMERGENCY parenteral thiamine + medical detox"] }
        - { id: s_psychosis_harm, concept_id: cond:acute_psychosis_schizophrenia, key_discriminators: ["substance-induced or primary psychosis, severe agitation, suicidal/homicidal ideation"] }
        - { id: s_cirrhosis_gib, concept_id: cond:cirrhosis, key_discriminators: ["jaundice, ascites, variceal GI bleed, hepatic encephalopathy, acute pancreatitis (lipase)"] }
        - { id: s_anorexia_instab, concept_id: cond:anorexia_nervosa, key_discriminators: ["co-occurring eating disorder / severe electrolyte derangement / Wernicke encephalopathy"] }
      pitfalls_often_missed:
        - { id: o_bipolar_ptsd, concept_id: cond:bipolar_disorder, key_discriminators: ["self-medication of underlying bipolar disorder, PTSD, depression, or chronic pain"] }
        - { id: o_bbv, concept_id: cond:chronic_hcv, key_discriminators: ["screen HIV, HBV, HCV in injecting/high-risk drug use; check GGT/LFT/MCV/lipase in alcohol excess"] }
      masquerades:
        - { id: mq_depression, tier: primary, masquerade: depression, concept_id: cond:depression, clue_prompt: { en: "Screen for co-morbid depression, PTSD, bipolar disorder, and suicide risk — dual diagnosis is the rule rather than the exception." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Check concurrent sedatives (benzodiazepines + opioids -> respiratory depression) and hepatotoxic drugs." } }
      patient_hidden_agenda_prompts:
        - { en: "Use motivational interviewing and non-stigmatising language; explore readiness to change, family/work stressors, financial strain, and domestic safety." }
    positive_exclusions:
      - id: ex_alc_dt
        finding_concept_id: rf:severe_alcohol_withdrawal_dt
        question: { en: "Have you recently cut down or stopped heavy drinking and developed severe shaking, heavy sweating, seeing/hearing things, confusion, or fits/seizures?", zh_hk: "請問你最近有否突然減酒或停酒，並出現劇烈手震、大汗、幻覺、意識混亂或抽筋？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_sub_suicide
        finding_concept_id: rf:suicidal_ideation
        question: { en: "Have you had any thoughts of hurting yourself, ending your life, or feeling unable to stay safe?", zh_hk: "請問你近期有沒有傷害自己、輕生或覺得自己無法保持安全的念頭？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_sub_psychosis
        finding_concept_id: rf:acute_psychosis_harm_risk
        question: { en: "Are you hearing voices, feeling intensely paranoid, or worried you might lose control and hurt yourself or someone else?", zh_hk: "請問你有沒有出現幻聽、嚴重被害恐懼，或擔心失控傷害自己或他人？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_sub_jaundice_bleed
        finding_concept_id: rf:gi_bleeding
        question: { en: "Have you vomited blood, passed black tarry stools, developed yellowing of your eyes/skin, or had severe upper tummy pain?", zh_hk: "請問你有沒有嘔血、排出黑色柏油狀大便、眼白／皮膚發黃，或劇烈上腹痛？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_substance_emergency
        trigger_condition: { en: "Severe shaking/sweating/hallucinations/seizures after stopping alcohol, thoughts of self-harm or harm to others, overdose/extreme drowsiness, vomiting blood, or severe upper abdominal pain", zh_hk: "停酒後劇烈手震／大汗／幻覺／抽筋、自傷或傷人念頭、藥物過量極度昏睡、嘔血或劇烈上腹痛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "If you have severe alcohol withdrawal symptoms (shaking, confusion, hallucinations, or seizures), thoughts of harming yourself or others, vomiting blood, or suspected drug overdose, seek emergency hospital care immediately. Do not abruptly stop heavy daily alcohol without medical supervision."
          zh_hk: "如出現嚴重酒精戒斷徵狀（劇烈手震、混亂、幻覺或抽筋）、自傷或傷人念頭、嘔血或懷疑藥物過量，請立即前往急症室。長期大量飲酒者切勿在無醫生監護下突然完全停酒。"
      - id: sn_substance_crisis
        trigger_condition: { en: "Overwhelming distress, intense cravings with hopelessness, or needing immediate emotional/crisis support", zh_hk: "情緒極度困擾、強烈渴求伴絕望感或需要即時危機支援" }
        escalation_channel: crisis_hotline
        patient_instruction:
          en: "If you feel overwhelmed or unsafe, contact a 24-hour mental health crisis helpline immediately and arrange a supportive same-day review with your doctor to plan safe withdrawal and ongoing treatment."
          zh_hk: "如感到情緒崩潰或安全受威脅，請立即致電24小時精神健康危機支援熱線，並安排即日醫生評估以制定安全戒斷及治療計劃。"
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

# ===========================================================================
# OBSERVATION RULES (7) — LOINC + UCUM + Intervals + Bands + Templates
# ===========================================================================
observation_rules:
  - id: obs_rule:hiv_ag_ab
    observation_concept_id: obs:hiv_ag_ab
    canonical_ucum: "{Ordinal}"
    display_ucum: "{Ordinal}"
    reference_intervals: []
    severity_bands:
      significant: { ge: 1.0 }
      urgent: { ge: 1.0 }
    direction_templates:
      positive:
        working_problem: { en: "reactive HIV 1/2 Ag/Ab screening test (requires confirmatory testing)", zh_hk: "HIV抗原／抗體初步篩查呈陽性（須作確認測試）" }
        plan_template:
          en: "Deliver result sensitively face-to-face; order confirmatory HIV-1/2 differentiation immunoassay + HIV RNA viral load (and CD4 count, resistance genotype, HBV/HCV/syphilis); arrange urgent HIV specialist/clinic linkage for rapid ART initiation (U=U counselling) and partner notification."
          zh_hk: "必須安排面診並以保密同理態度交代結果；即時安排確認性HIV分型檢測、病毒載量及CD4淋巴細胞檢測，並緊急轉介HIV專科診所及早展開抗逆轉錄病毒治療及伴侶通知。"
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:syphilis_serology
    observation_concept_id: obs:syphilis_serology
    canonical_ucum: "{Ordinal}"
    display_ucum: "{Ordinal}"
    reference_intervals: []
    severity_bands:
      significant: { ge: 1.0 }
      urgent: { ge: 1.0 }
    direction_templates:
      positive:
        working_problem: { en: "reactive syphilis serology", zh_hk: "梅毒血清測試呈陽性" }
        plan_template:
          en: "Interpret treponemal (EIA/TPPA) alongside quantitative non-treponemal titre (RPR/VDRL) and prior treatment history to stage early vs late/latent vs past treated infection; screen for neuro/ocular/otic symptoms and pregnancy (URGENT benzathine penicillin G to prevent congenital syphilis); test HIV + full STI panel and notify public health/partners."
          zh_hk: "須結合梅毒螺旋體抗體及定量非螺旋體滴度 (RPR/VDRL) 判斷屬早期、晚期潛伏或過往已治療感染；排查神經／眼部徵狀及懷孕（孕婦屬急症須立即盤尼西林治療以防先天性梅毒）；同步檢測HIV及其他性病並跟進伴侶及呈報。"
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:ct_ng_naat
    observation_concept_id: obs:ct_ng_naat
    canonical_ucum: "{Ordinal}"
    display_ucum: "{Ordinal}"
    reference_intervals: []
    severity_bands:
      significant: { ge: 1.0 }
    direction_templates:
      positive:
        working_problem: { en: "detected Chlamydia trachomatis and/or Neisseria gonorrhoeae (NAAT)", zh_hk: "衣原體及／或淋病核酸測試呈陽性" }
        plan_template:
          en: "Treat promptly per local STI guideline (chlamydia: doxycycline 100 mg BD x7d or azithromycin in pregnancy; gonorrhoea: IM ceftriaxone + oral azithromycin/doxycycline + pre-treatment culture for antimicrobial susceptibility); screen HIV & syphilis; counsel 7-day abstinence, partner testing/treatment, and 3-month retest (plus test-of-cure for pharyngeal/rectal NG or pregnancy)."
          zh_hk: "按地區性病指引盡快治療（衣原體多西環素7日；淋病肌肉注射頭孢曲松配口服藥及留取培養檢驗抗藥性）；同步篩查HIV及梅毒，指導伴侶同步治療、7日內避免性接觸及安排3個月覆檢。"
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:ggt
    observation_concept_id: obs:ggt
    canonical_ucum: "U/L"
    display_ucum: "U/L"
    reference_intervals:
      - { id: ri_default, low: 0.0, high: 50.0, priority: 0 }
      - { id: ri_male, low: 0.0, high: 60.0, priority: 10, when: { fact: sex, op: eq, value: "M" } }
      - { id: ri_female, low: 0.0, high: 40.0, priority: 10, when: { fact: sex, op: eq, value: "F" } }
    severity_bands:
      significant: { gt: 60.0 }
      urgent: { gt: 200.0 }
      critical: { gt: 500.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated GGT (hepatobiliary / alcohol / metabolic / enzyme induction)", zh_hk: "GGT 肝酵素偏高" }
        plan_template:
          en: "Review full LFT (ALP, ALT, AST, bilirubin) to distinguish cholestatic biliary obstruction (raised ALP + GGT -> liver/biliary ultrasound) from isolated GGT elevation (alcohol excess -> AUDIT-C, MASLD/metabolic syndrome, or enzyme-inducing drugs such as carbamazepine/phenytoin/statins)."
          zh_hk: "配合完整肝功能（ALP/ALT/AST/膽紅素）區分膽道阻塞（ALP與GGT同升須照超聲波）或孤立GGT偏高（評估飲酒量、脂肪肝及藥物酵素誘導）。"
        relevant_med_class_ids: ["drug_class:anticonvulsant", "drug_class:statin"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:lipase
    observation_concept_id: obs:lipase
    canonical_ucum: "U/L"
    display_ucum: "U/L"
    reference_intervals:
      - { id: ri_default, low: null, high: 60.0, priority: 0 }
    severity_bands:
      significant: { gt: 60.0 }
      urgent: { ge: 180.0 }
      critical: { ge: 300.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated serum lipase (acute pancreatitis screen)", zh_hk: "血清脂肪酶偏高（急性胰臟炎排查）" }
        plan_template:
          en: "Lipase >=3x ULN (>=180 U/L) with epigastric pain radiating to back meets diagnostic criteria for acute pancreatitis -> IMMEDIATE ED transfer for IV fluids, analgesia, severity scoring, and aetiology workup (gallstones/ultrasound, alcohol, triglycerides >11 mmol/L, hypercalcaemia, culprit drugs e.g. GLP-1 RA/azathioprine/valproate)."
          zh_hk: "脂肪酶達正常上限3倍或以上（>=180 U/L）並伴上腹痛放射至背部，符合急性胰臟炎診斷，必須立即轉送急症室住院輸液及排查病因（膽石、飲酒、嚴重高三酸甘油酯、高血鈣或藥物誘發）。"
        relevant_med_class_ids: ["drug_class:glp1_ra", "drug_class:dpp4_inhibitor"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:cortisol_am
    observation_concept_id: obs:cortisol_am
    canonical_ucum: "nmol/L"
    display_ucum: "nmol/L"
    reference_intervals:
      - { id: ri_default, low: 140.0, high: 550.0, priority: 0, source_note: "08:00-09:00 AM fasting serum cortisol" }
    severity_bands:
      significant: { lt: 140.0, gt: 550.0 }
      urgent: { lt: 100.0, gt: 700.0 }
      critical: { lt: 50.0 }
    direction_templates:
      L:
        working_problem: { en: "low morning serum cortisol (suspected adrenal insufficiency)", zh_hk: "早上血清皮質醇偏低（疑似腎上腺功能不足）" }
        plan_template:
          en: "Morning cortisol <100 nmol/L strongly suggests adrenal insufficiency (exogenous steroid HPA suppression including oral/inhaled/topical/TCM steroids, or primary Addison disease). Check paired ACTH, Na+/K+, glucose, and postural BP; if unwell/hypotensive/hyponatraemic/cortisol <50 nmol/L -> IMMEDIATE ED transfer for IV hydrocortisone (adrenal crisis); otherwise urgent endocrine/short Synacthen test."
          zh_hk: "早上皮質醇低於100 nmol/L 高度提示腎上腺功能不足（排查外源性類固醇抑制或原發性愛迪生氏病）；立即覆核電解質（低血鈉／高血鉀）、血糖及血壓，如臨床不穩或<50 nmol/L須立即送急症室靜脈補充類固醇防腎上腺危象。"
        relevant_med_class_ids: ["drug_class:oral_corticosteroid"]
      H:
        working_problem: { en: "elevated morning serum cortisol", zh_hk: "早上血清皮質醇偏高" }
        plan_template:
          en: "Random/AM cortisol alone cannot diagnose Cushing syndrome (confounded by acute stress, illness, depression, alcohol, or oestrogen/COC raising CBG). If Cushingoid features present, perform screening with 1 mg overnight dexamethasone suppression test, late-night salivary cortisol, or 24h urinary free cortisol."
          zh_hk: "單次早上皮質醇升高常見於壓力、疾病或雌激素干擾；如具庫欣氏症候群臨床特徵，須以過夜1毫克地塞米松抑制測試或24小時尿液游離皮質醇篩查。"
        relevant_med_class_ids: ["drug_class:hormonal_contraception", "drug_class:mht_oestrogen"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_3", review_status: "draft" }

  - id: obs_rule:afp
    observation_concept_id: obs:afp
    canonical_ucum: "ug/L"
    display_ucum: "ug/L"
    reference_intervals:
      - { id: ri_non_pregnant_adult, low: null, high: 10.0, priority: 0, source_note: "Non-pregnant adult upper reference limit ~10 ug/L (physiologically elevated in pregnancy)" }
      - { id: ri_pregnant, low: 0.0, high: 250.0, priority: 20, when: { fact: pregnant, op: eq, value: true }, source_note: "Physiologically elevated maternal serum AFP during normal pregnancy" }
    severity_bands:
      significant: { gt: 10.0 }
      urgent: { gt: 20.0 }
      critical: { gt: 200.0 }
    trend_rules:
      - id: tr_afp_rising_hcc
        direction: rise
        delta_abs: 10.0
        window_days: 180
        urgency_floor: 3
        clinician_rationale:
          en: "Rising AFP (>=10 ug/L increase within 6 months) in chronic HBV, HCV, or cirrhosis strongly warrants urgent multiphasic liver CT/MRI to exclude hepatocellular carcinoma (HCC) even if ultrasound is equivocal."
          zh_hk: "慢性乙肝、丙肝或肝硬化患者半年內甲胎蛋白上升 >=10 ug/L，即使超聲波未見明顯異常亦須緊急安排多期肝臟電腦掃描或磁力共振排除肝癌。"
    direction_templates:
      H:
        working_problem: { en: "elevated serum alpha-fetoprotein (AFP)", zh_hk: "血清甲胎蛋白 (AFP) 偏高" }
        plan_template:
          en: "Exclude pregnancy first. In chronic HBV/HCV or cirrhosis, AFP >20 ug/L or rising trend mandates urgent liver ultrasound + multiphasic CT/MRI and hepatology referral to rule out hepatocellular carcinoma (HCC); also evaluate active hepatitis flare or germ-cell tumour (testicular/ovarian) in younger adults."
