      renal_note: "Reduce dose by 50% if eGFR <30 mL/min; avoid in pregnancy, children (cartilage risk), myasthenia gravis, and aneurysm history."
      dosing_pearl:
        en: "Reserve fluoroquinolones for targeted indications (e.g. bacterial prostatitis, Pseudomonas, severe pyelonephritis). AVOID in undiagnosed subacute cough/CAP (masks pulmonary TB and drives MDR-TB). Counsel on Achilles tendinopathy, QTc prolongation, CNS effects, and divalent cation chelation (separate Fe/Ca/Mg/antacids by >=2h)."
        zh_hk: "須嚴格保留作針對性感染使用；切勿用於未確診持續咳嗽（會掩蓋肺結核及引致抗藥性）。須留意跟腱炎／斷裂、QT延長及避免與鐵／鈣／胃藥同服。"
