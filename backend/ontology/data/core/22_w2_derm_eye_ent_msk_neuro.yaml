# ===========================================================================
# DETERMINISTIC CLINICAL EDGES (14) — Teratogens, Monitoring, DDIs & Red Flags
# ===========================================================================
edges:
  - id: edge:isotretinoin_pregnancy_teratogen_ci
    source_id: drug:isotretinoin
    relation: CONTRAINDICATED_IN
    target_id: cond:pregnancy_normal
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: pregnant, op: eq, value: true }
        - { fact: planning_pregnancy, op: eq, value: true }
        - { fact: has_concept, op: is_a, value: "cond:pregnancy_normal" }
    clinician_rationale:
      en: "Isotretinoin is a Category X severe human teratogen (~20-35% risk of major craniofacial, cardiac, thymic, and CNS malformations plus spontaneous abortion) — strictly contraindicated in pregnancy or women planning pregnancy."
      zh_hk: "異維A酸屬極高度致畸胎藥物 (Category X)，懷孕期間接觸可致嚴重顱面、心臟及中樞神經畸形或流產，懷孕及備孕人士絕對禁用。"
    clinician_action_prompt:
      en: "Hard-block isotretinoin; confirm negative urine/serum beta-hCG and reliable dual contraception (continuing >=1 month post-cessation) before any prescription; if pregnant on exposure, stop immediately and arrange urgent obstetric/teratology counselling."
      zh_hk: "絕對禁止處方異維A酸；任何處方前須確認陰性驗孕結果及有效雙重避孕（停藥後仍須避孕至少1個月）；如懷孕期已誤服須立即停藥並緊急轉介產科評估。"
    patient_safety_net:
      en: "Isotretinoin can cause severe harm to an unborn baby. Do not take this medicine if you are pregnant or trying to conceive — if you miss a period or have a positive pregnancy test, stop taking it and contact your doctor urgently."
      zh_hk: "異維A酸會嚴重損害胎兒發育。懷孕或計劃懷孕期間切勿服用；如停經或驗孕呈陽性，請立即停藥並緊急聯絡醫生。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:sodium_valproate_pregnancy_teratogen_ci
    source_id: drug:sodium_valproate
    relation: CONTRAINDICATED_IN
    target_id: cond:pregnancy_normal
    severity: hard_block
    urgency_floor: 4
    clinic_port_family: drug_monitoring
    when:
      any:
        - { fact: pregnant, op: eq, value: true }
        - { fact: planning_pregnancy, op: eq, value: true }
        - { fact: has_concept, op: is_a, value: "cond:pregnancy_normal" }
    clinician_rationale:
      en: "Sodium valproate carries the highest teratogenic risk of all antiepileptics (~10% major congenital malformations including neural tube defects; ~30-40% neurodevelopmental delay/autism spectrum disorder) — contraindicated for migraine/bipolar in pregnancy and avoid in epilepsy whenever alternatives exist."
      zh_hk: "丙戊酸鈉致畸胎風險極高（約10%神經管缺陷及重大先天畸形；約30至40%兒童神經發育障礙），孕婦及備孕女性原則上禁用。"
    clinician_action_prompt:
      en: "Hard-block new valproate initiation in pregnancy/pregnancy planning; if already taking valproate for epilepsy and pregnant, NEVER stop abruptly (status epilepticus risk) — initiate immediate urgent neurology/obstetric transition (e.g. levetiracetam) and high-dose folic acid 5 mg/day."
      zh_hk: "禁止於懷孕或備孕期新處方丙戊酸鈉；如因癲癇正服藥而發現懷孕，切勿突然自行停藥，須即時緊急轉介神經科及產科轉換安全方案並處方高劑量葉酸 5 mg/日。"
    patient_safety_net:
      en: "Sodium valproate carries high risks in pregnancy. If you take it for epilepsy and think you might be pregnant, DO NOT stop it abruptly on your own — contact your doctor or specialist urgently to arrange a safe plan."
      zh_hk: "丙戊酸鈉於懷孕期具高致畸風險。如因癲癇正服用此藥而懷疑懷孕，切勿自行突然停藥，請立即緊急聯絡醫生安排安全換藥計劃。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:terbinafine_monitored_by_lft
    source_id: drug:terbinafine
    relation: MONITORED_BY
    target_id: panel:lft
    severity: moderate
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 42
      repeat_interval_days: 42
      grace_days: 14
      applies_on: both
    clinician_rationale:
      en: "Oral terbinafine rarely causes severe idiosyncratic cholestatic/hepatocellular liver injury (usually within 4-6 weeks of starting) — check baseline LFT before initiating and repeat at 4-6 weeks during prolonged courses (e.g. onychomycosis)."
      zh_hk: "口服特比萘芬罕見但可引致嚴重特異性肝損傷（多於服藥後4至6星期出現），開始治療前及療程達4至6星期時須監察肝功能 (LFT)。"
    clinician_action_prompt:
      en: "Confirm baseline LFT is normal prior to oral terbinafine (avoid in active/chronic liver disease) and schedule 4-6 week LFT check for courses >6 weeks; counsel on early hepatitis warning symptoms."
      zh_hk: "處方口服特比萘芬前核實基線肝功能正常，療程超過6星期須於第4至6星期覆檢肝功能，並提醒病人留意肝炎警號。"
    patient_safety_net:
      en: "If you develop yellowing of the skin or eyes, dark tea-coloured urine, pale stools, persistent nausea, loss of appetite, or right upper tummy pain while taking oral terbinafine, stop the tablets and see a doctor promptly."
      zh_hk: "服用口服特比萘芬期間如出現皮膚或眼白發黃、深茶色尿、持續噁心、食慾不振或右上腹痛，請暫停服藥並盡快求醫。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:hydroxychloroquine_retinal_monitoring
    source_id: drug:hydroxychloroquine
    relation: MONITORED_BY
    target_id: proc:ophthalmic_retinal_screening
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    monitoring_spec:
      initiation_due_days: 365
      repeat_interval_days: 365
      grace_days: 30
      applies_on: both
    clinician_rationale:
      en: "Cumulative hydroxychloroquine exposure risks irreversible retinal pigment epithelial toxicity (bull's-eye maculopathy), especially at doses >5 mg/kg/day, duration >5 years, eGFR <60, or concurrent tamoxifen — requires baseline ophthalmology review within 1 year and annual SD-OCT + automated visual fields."
      zh_hk: "長期累積服用羥氯喹可引致不可逆轉之視網膜黃斑毒性（特別是劑量 >5 mg/kg/日、用藥逾5年或腎功能下降者），須作首年基線眼科評估及定期每年 SD-OCT 與視野篩查。"
    clinician_action_prompt:
      en: "Verify daily dose <=5 mg/kg real body weight, check eGFR, and confirm ophthalmology retinal screening (SD-OCT + automated visual fields; include 24-2/30-2 in East Asian patients due to pericentral retinopathy pattern)."
      zh_hk: "核實每日劑量不超過 5 mg/kg 實際體重及腎功能，並安排眼科視網膜毒性篩查（東亞裔患者宜同時涵蓋周邊黃斑區 SD-OCT 及 24-2/30-2 視野檢查）。"
    patient_safety_net:
      en: "Regular eye check-ups are essential while taking hydroxychloroquine. Arrange prompt review if you notice blurred central vision, difficulty reading, faded colours, or missing patches in your vision."
      zh_hk: "服用羥氯喹期間須定期接受眼科視網膜檢查；如察覺視力模糊、閱讀困難、色覺變淡或視野出現盲點，請盡快覆診。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:amitriptyline_elderly_stopp_anticholinergic
    source_id: drug:amitriptyline
    relation: CONTRAINDICATED_IN
    target_id: cond:frailty_falls
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    when:
      fact: age_years
      op: ge
      value: 65
    clinician_rationale:
      en: "STOPP/Beers Criteria: Amitriptyline carries high anticholinergic burden in adults >=65y, markedly increasing risk of falls, orthostatic hypotension, delirium/cognitive decline, urinary retention, constipation, and QTc prolongation/arrhythmia."
      zh_hk: "STOPP／Beers 長者用藥安全準則：65歲或以上人士服用阿米替林具強烈抗膽鹼副作用，顯著增加跌倒、姿勢性低血壓、譫妄、認知退化、尿瀦留及心律不整風險。"
    clinician_action_prompt:
      en: "Avoid initiating amitriptyline in adults >=65y (propose lower-risk neuropathic/preventive alternatives and review total anticholinergic burden); if already chronic, consider gradual supervised deprescribing."
      zh_hk: "避免為65歲或以上長者新處方阿米替林，檢視整體抗膽鹼藥物負荷；如長期服用宜由醫生評估逐步安全減藥。"
    patient_safety_net:
      en: "This medicine can cause drowsiness, dizziness on standing, confusion, or falls in older adults. Seek medical advice if you feel lightheaded, unusually drowsy, confused, or have difficulty passing urine."
      zh_hk: "此藥在長者身上較易引起頭暈、企起身眼前發黑、嗜睡、意識混亂或排尿困難，增加跌倒風險；如有上述情況請聯絡醫生檢視用藥。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:pregabalin_opioid_respiratory_depression
    source_id: drug:pregabalin
    relation: INTERACTS_WITH
    target_id: drug_class:opioid
    bidirectional: true
    severity: critical
    urgency_floor: 3
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "Concurrent pregabalin + opioid causes additive CNS depression, potentially fatal respiratory depression, falls, and overdose mortality (especially in elderly, CKD, COPD/OSA, or concurrent benzodiazepine use)."
      zh_hk: "同時服用普瑞巴林與鴉片類藥物會產生協同中樞神經及致命性呼吸抑制，顯著增加跌倒及過量風險（長者、腎病及慢阻肺患者風險尤高）。"
    clinician_action_prompt:
      en: "Avoid co-prescribing pregabalin with opioids wherever possible; verify eGFR-adjusted dose, screen sedative polypharmacy, and establish a clinician-supervised tapering/de-escalation plan."
      zh_hk: "盡量避免同時處方普瑞巴林與鴉片類止痛藥；核實腎功能劑量及評估減藥方案，切勿疊加其他鎮靜劑。"
    patient_safety_net:
      en: "Taking pregabalin together with opioid pain medicines can cause severe drowsiness and dangerously slow breathing. Seek emergency medical care immediately if you or a carer notice extreme sleepiness, confusion, or slow/shallow breathing."
      zh_hk: "同時服用普瑞巴林及鴉片類止痛藥可引致嚴重嗜睡及危險的呼吸抑制；如出現極度昏睡、意識模糊或呼吸緩慢微弱，請立即尋求緊急救援。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:sjs_ten_mucosal_blistering_emergency
    source_id: rf:sjs_ten_mucosal_blistering
    relation: RED_FLAG_FOR
    target_id: cond:sjs_ten_scar
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Painful dusky skin eruption with epidermal detachment/blistering or mucosal erosions (oral, ocular, genital) + fever after a recent medication (especially allopurinol, carbamazepine, sulfonamides, lamotrigine, NSAIDs, antibiotics) is suspected SJS/TEN — life-threatening dermatologic emergency."
      zh_hk: "用藥後出現痛性暗紅皮疹、表皮起水泡脫落、多處黏膜潰爛（口、眼、生殖器）及發燒，高度懷疑 SJS/TEN 嚴重藥物皮膚反應，屬致命皮膚急症。"
    clinician_action_prompt:
      en: "IMMEDIATELY cease all suspected culprit medications (reconcile Rx, OTC & TCM started within 8 weeks) and arrange immediate emergency department / ICU / burns-unit transfer with urgent ophthalmology input; document lifelong drug-class allergy."
      zh_hk: "立即停用所有懷疑誘發藥物（核查過去8星期所有處方藥、成藥及中藥），即時轉送急症室／深切治療部並同步通知眼科保護角膜。"
    patient_safety_net:
      en: "A painful blistering or peeling skin rash with fever or sores in your mouth, eyes, or genital area is a medical emergency — stop any newly started non-essential medicine only as advised and go to an emergency department immediately."
      zh_hk: "如出現疼痛的水泡或脫皮皮疹，並伴隨發燒或口腔、眼睛、生殖器潰爛，屬危急醫療情況，請立即前往急症室並帶備近期服用的所有藥物。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:flashes_floaters_retinal_detachment
    source_id: rf:flashes_floaters_visual_curtain
    relation: RED_FLAG_FOR
    target_id: cond:retinal_detachment
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Acute onset photopsia (flashes), sudden shower of new floaters, or a progressive dark curtain/shadow over the visual field indicates retinal tear or retinal detachment — urgent same-day dilated ophthalmology assessment is essential to preserve macula-on vision."
      zh_hk: "突發閃光感、大量新飛蚊湧現或視野出現黑影／黑幕遮擋，高度懷疑視網膜裂孔或視網膜脫落，必須即日緊急眼科散瞳檢查以把握黃斑點未受累前之搶救視力黃金期。"
    clinician_action_prompt:
      en: "Arrange immediate same-day emergency ophthalmology / eye A&E referral for dilated fundoscopy (especially high myopia, recent cataract surgery, or ocular trauma)."
      zh_hk: "立即安排即日緊急眼科／急症室散瞳眼底檢查（高度近視、近期白內障手術或眼部外傷者風險更高）。"
    patient_safety_net:
      en: "Sudden flashes of light, a sudden shower of new floaters, or a dark curtain or shadow moving across your vision needs urgent same-day emergency eye assessment to protect your sight."
      zh_hk: "如突然出現閃光、大量新飛蚊，或視野出現黑影／黑幕遮擋，請立即於今日前往急症室作緊急眼科檢查以挽救視力。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:contact_lens_red_eye_corneal_ulcer
    source_id: rf:contact_lens_painful_red_eye
    relation: RED_FLAG_FOR
    target_id: cond:corneal_ulcer_keratitis
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Painful red eye with photophobia, tearing, or reduced acuity in a contact lens wearer is microbial keratitis / corneal ulcer (high risk of rapidly destructive Pseudomonas aeruginosa or Acanthamoeba) until excluded on slit-lamp examination."
      zh_hk: "佩戴隱形眼鏡人士出現眼紅劇痛、畏光或視力下降，未經裂隙燈檢查排除前必須視為微生物角膜潰瘍（綠膿桿菌可於數小時內導致角膜穿孔失明）。"
    clinician_action_prompt:
      en: "Instruct immediate contact lens removal (patient to bring lenses and case for microbiology), NEVER prescribe topical steroids or pad the eye, and arrange same-day emergency ophthalmology slit-lamp review."
      zh_hk: "即時除下隱形眼鏡（保留鏡片及盒供化驗），嚴禁處方類固醇眼藥水或敷蓋眼睛，並即日緊急轉介眼科作裂隙燈檢查。"
    patient_safety_net:
      en: "Take your contact lenses out immediately (bring the lenses and case with you) and go for urgent same-day emergency eye assessment. Do not use leftover eye drops or wear lenses again until an eye specialist advises."
      zh_hk: "請立即除下隱形眼鏡（連同鏡片及鏡盒帶往醫院），並即日前往急症室作緊急眼科評估；切勿自行使用舊眼藥水或重新佩戴鏡片。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:sudden_hearing_loss_72h_ssnhl
    source_id: rf:sudden_hearing_loss_72h
    relation: RED_FLAG_FOR
    target_id: cond:ssnhl
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "Sudden unilateral sensorineural hearing loss (>=30 dB across 3 contiguous frequencies within <=72 hours; excludes wax/effusion on otoscopy; Weber lateralises to good ear) is a time-critical otologic emergency with a narrow early corticosteroid salvage window (ideally within 7-14 days)."
      zh_hk: "72小時內突發單側感音神經性聽力下降（耳鏡排除耳垢／積水後）屬耳科急症，口服類固醇搶救聽力的黃金治療窗極短（宜於7至14日內盡早啟動）。"
    clinician_action_prompt:
      en: "Perform immediate otoscopy + tuning fork (Weber/Rinne) and cranial nerve/cerebellar screen (if focal neuro deficit -> emergency stroke pathway); arrange urgent ENT + audiometry and consider immediate high-dose oral prednisolone (verify HBsAg/diabetes) + MRI IAC follow-up."
      zh_hk: "即時作耳鏡、音叉測試及腦神經／小腦篩查（如伴神經缺損須走急診中風流程）；安排緊急耳鼻喉科及純音聽力測試，並評估盡早啟動高劑量口服類固醇（須核查乙肝及血糖）及內聽道 MRI。"
    patient_safety_net:
      en: "Sudden hearing loss in one ear over hours to a few days needs urgent doctor and ENT assessment within 24-48 hours so time-sensitive treatment is not missed. Go to emergency care immediately if you also have facial weakness, double vision, slurred speech, or cannot walk steadily."
      zh_hk: "單側聽力於數小時至數日內突然驟降必須於24至48小時內緊急求醫及轉介耳鼻喉科，以免錯過治療黃金期；如同時出現面癱、重影、口齒不清或行路不穩，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:painless_hard_neck_node_malignancy
    source_id: rf:painless_hard_neck_node
    relation: RED_FLAG_FOR
    target_id: cond:malignancy_occult
    severity: critical
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "A persistent (>2-3 weeks) painless, firm/hard, fixed cervical or supraclavicular lymph node requires urgent malignancy exclusion — nasopharyngeal carcinoma (NPC), head and neck SCC, lymphoma, thyroid carcinoma, or distant GI/thoracic metastasis (Virchow's node)."
      zh_hk: "持續超過2至3星期的無痛、質硬或固定頸部／鎖骨上淋巴結腫大，必須緊急排除鼻咽癌、頭頸部鱗狀細胞癌、淋巴瘤、甲狀腺癌或遠端轉移癌。"
    clinician_action_prompt:
      en: "Arrange urgent ENT / haematology assessment (flexible nasoendoscopy, neck ultrasound + FNA/excisional biopsy, CBC/LDH/LFT/CXR; consider plasma EBV DNA in high-risk Southern Chinese populations) — do NOT treat empirically with repeated antibiotics."
      zh_hk: "安排緊急耳鼻喉科／血液科評估（鼻咽鏡、頸部超聲波及針吸／切片活檢、全血計數及 LDH；高危華南族群考慮血漿 EBV DNA），切勿反覆盲目處方抗生素延誤診斷。"
    patient_safety_net:
      en: "A firm, painless neck lump lasting more than 2-3 weeks needs prompt specialist investigation. Seek immediate emergency care if the swelling grows rapidly or causes noisy breathing, trouble swallowing, or shortness of breath."
      zh_hk: "持續超過2至3星期的無痛頸部硬塊須盡快由醫生及專科作進一步檢查；如腫塊迅速增大或引致呼吸喘鳴、吞嚥困難或氣促，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:ascending_weakness_gbs_emergency
    source_id: rf:ascending_weakness_gbs
    relation: RED_FLAG_FOR
    target_id: cond:guillain_barre_syndrome
    severity: critical
    urgency_floor: 4
    clinic_port_family: referral
    clinician_rationale:
      en: "Rapidly progressive symmetrical ascending limb weakness with hypo-/areflexia (commonly 1-4 weeks post-GI/respiratory infection) indicates suspected Guillain-Barre syndrome — high risk of acute diaphragmatic respiratory failure, bulbar palsy, and autonomic instability."
      zh_hk: "迅速向上蔓延之對稱性肢體無力伴腱反射減弱或消失，高度懷疑吉巴氏綜合症，具急性呼吸肌衰竭、球麻痺及自主神經失調致命風險。"
    clinician_action_prompt:
      en: "Immediate emergency ambulance / A&E transfer for neurology & ICU/HDU monitoring (serial FVC/respiratory mechanics, cardiac telemetry) and early IVIG or plasmapheresis — do NOT wait for outpatient nerve conduction studies."
      zh_hk: "立即安排緊急送往急症室及神經科／深切治療部監察（連續肺活量監測、心電監護）並盡早啟動靜脈免疫球蛋白 (IVIG) 或血漿置換治療，切勿等候門診神經傳導檢查。"
    patient_safety_net:
      en: "Rapidly worsening weakness spreading up your legs or arms, or any new trouble breathing, swallowing, or speaking, is a medical emergency — seek emergency hospital care immediately."
      zh_hk: "如雙腳或手臂無力迅速惡化並向上蔓延，或出現任何呼吸、吞嚥或說話困難，屬危急醫療情況，請立即前往急症室或致電緊急救援服務。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:abcde_changing_lesion_melanoma
    source_id: rf:abcde_changing_pigmented_lesion
    relation: RED_FLAG_FOR
    target_id: cond:melanoma
    severity: high
    urgency_floor: 3
    clinic_port_family: referral
    clinician_rationale:
      en: "A pigmented, acral (palm/sole), subungual, or nodular skin lesion showing ABCDE changes (Asymmetry, irregular Border, varied Colour, Diameter >6mm, Evolving/bleeding/firm/growing) requires urgent dermoscopic evaluation and complete excisional biopsy (2 mm clinical margin) to exclude melanoma."
      zh_hk: "具 ABCDE 變化、不斷增大流血或位於掌跖／甲床之色素病變須緊急作皮膚鏡評估及完整切除活檢以排除黑色素瘤（切忌局部削切或冷凍治療）。"
    clinician_action_prompt:
      en: "Perform dermoscopy and arrange urgent complete full-thickness excisional biopsy (2 mm margin) or urgent dermatology/surgical referral — NEVER use cryotherapy, cautery, or partial shave biopsy on a suspicious pigmented lesion."
      zh_hk: "進行皮膚鏡檢查並安排緊急完整全層切除活檢或轉介皮膚科／外科；切勿對懷疑黑色素瘤病變進行冷凍、電灼或局部削切活檢。"
    patient_safety_net:
      en: "Any mole, dark spot, palm/sole mark, or nail streak that is changing in size, shape, or colour, or is crusting or bleeding, needs prompt face-to-face examination by a doctor with a dermatoscope."
      zh_hk: "任何大小、形狀或顏色出現變化、結痂或流血的黑痣、手掌腳底黑斑或指甲黑線，必須盡快安排面診由醫生以皮膚鏡檢查評估。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: edge:febuxostat_ihd_cvd_caution
    source_id: drug:febuxostat
    relation: CONTRAINDICATED_IN
    target_id: cond:stable_ihd
    severity: high
    urgency_floor: 2
    clinic_port_family: drug_monitoring
    clinician_rationale:
      en: "CARES trial cardiovascular safety signal: febuxostat was associated with higher cardiovascular and all-cause mortality versus allopurinol in patients with established atherosclerotic CVD / ischaemic heart disease — avoid in established CVD where an alternative (e.g. HLA-B*58:01-negative allopurinol) is feasible."
      zh_hk: "CARES 臨床研究警示：對已患有冠心病或動脈粥樣硬化性心血管疾病患者，非布司他之心血管死亡風險高於別嘌醇；如有替代方案（如 HLA-B*58:01 陰性時選用別嘌醇）應避免使用。"
    clinician_action_prompt:
      en: "Review cardiovascular history before prescribing febuxostat; prefer HLA-B*58:01-screened allopurinol in established IHD/CVD where tolerated, or document shared decision-making and cardiology/rheumatology oversight if febuxostat is required."
      zh_hk: "處方非布司他前覆核冠心病／心血管病史；如病人可耐受且基因篩查陰性宜優先選用別嘌醇，若確須使用非布司他應由醫生作共同決策並密切監察心血管症狀。"
    patient_safety_net:
      en: "Seek emergency medical care immediately if you develop chest pain, chest tightness, shortness of breath, sudden weakness, or slurred speech."
      zh_hk: "服藥期間如出現胸痛、心口壓迫、氣促、突發肢體無力或口齒不清，請立即尋求緊急醫療協助。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

# ===========================================================================
# PRESENTATION FRAMES (5) — Murtagh PROMPT + openEHR Positive Exclusions + Safety Netting
# ===========================================================================
frames:
  - id: frame:hearing_loss_tinnitus
    rfe_concept_id: rfe:hearing_loss_tinnitus
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_otitis_media, concept_id: cond:otitis_media, key_discriminators: ["conductive hearing loss / middle ear effusion post-URTI"] }
        - { id: p_otitis_externa, concept_id: cond:otitis_externa, key_discriminators: ["canal oedema/debris/cerumen impaction, tragal tenderness"] }
        - { id: p_menieres, concept_id: cond:menieres_disease, key_discriminators: ["episodic vertigo 20min-12h + fluctuating low-frequency SNHL + aural fullness + tinnitus"] }
      serious_not_to_be_missed:
        - { id: s_ssnhl, concept_id: cond:ssnhl, key_discriminators: ["rapid unilateral SNHL <=72h — urgent oral corticosteroid salvage window"] }
        - { id: s_npc, concept_id: cond:npc, key_discriminators: ["adult unilateral OME / conductive loss + blood-stained post-nasal drip or neck node (Southern Chinese high risk)"] }
        - { id: s_stroke, concept_id: cond:stroke_tia, key_discriminators: ["posterior circulation / AICA stroke — sudden deafness + acute vertigo + focal neuro/ataxia"] }
        - { id: s_schwannoma, concept_id: cond:malignancy_occult, key_discriminators: ["progressive asymmetric SNHL or unilateral tinnitus -> MRI IAC for vestibular schwannoma"] }
      pitfalls_often_missed:
        - { id: o_ototoxic_drugs, concept_id: cond:drug_adverse_effect, key_discriminators: ["aminoglycosides, loop diuretics, high-dose aspirin/NSAIDs, macrolides, platinum chemo"] }
        - { id: o_vestib_neuritis, concept_id: cond:vestibular_neuritis, key_discriminators: ["acute prolonged vertigo without hearing loss (if hearing loss present -> labyrinthitis/AICA stroke)"] }
      masquerades:
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Audit ototoxic medications (furosemide, high-dose aspirin/NSAIDs, macrolides, aminoglycosides)." } }
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Always examine the post-nasal space (refer ENT nasoendoscopy) for unexplained adult unilateral OME, and arrange MRI IAC for asymmetric SNHL." } }
        - { id: mq_neuro, tier: secondary, masquerade: neurological_dilemma, concept_id: cond:neurological_dilemma, clue_prompt: { en: "Screen cranial nerves V/VII/VIII and cerebellar gait to exclude cerebellopontine angle pathology or brainstem stroke." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore communication isolation, fear of permanent deafness or brain tumour, occupational noise exposure, and insomnia/distress from tinnitus." }
    positive_exclusions:
      - id: ex_sudden_hl_72h
        finding_concept_id: rf:sudden_hearing_loss_72h
        question: { en: "Did your hearing drop suddenly in one ear over the last few hours or within 3 days?", zh_hk: "請問你是否於數小時至3日內突然出現單側聽力明顯下降？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_unilateral_ome_npc
        finding_concept_id: rf:unilateral_ome_neck_lump
        question: { en: "Do you have a blocked feeling in one ear alongside blood-stained nasal discharge, nasal blockage, or a painless neck lump?", zh_hk: "請問你單側耳塞或聽力下降時，有否伴隨鼻涕帶血絲、單側鼻塞或無痛頸部腫塊？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_focal_neuro
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Do you have facial weakness or numbness, double vision, slurred speech, severe spinning dizziness, or difficulty walking steadily?", zh_hk: "請問你有否同時出現面部無力或麻痺、重影、口齒不清、劇烈眩暈或行路不穩？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_hearing_loss_emergency
        trigger_condition: { en: "Sudden hearing drop within 72 hours, or any facial weakness, slurred speech, double vision, or inability to walk steadily", zh_hk: "72小時內突發聽力下降，或伴隨面癱、口齒不清、重影或行路不穩" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency care if hearing loss or dizziness is accompanied by facial droop, double vision, slurred speech, or trouble walking. For sudden one-sided hearing loss without other symptoms, see a doctor urgently within 24-48 hours."
          zh_hk: "如聽力下降或耳鳴伴隨面部歪斜、重影、口齒不清或行路不穩，請立即前往急症室。若單側聽力於數日內突然驟降，請於24至48小時內盡快求醫評估。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: frame:neck_lump
    rfe_concept_id: rfe:neck_lump
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_reactive_urti, concept_id: cond:urti, prevalence_note: "Reactive tender mobile cervical lymphadenopathy (<2cm, resolving within 2-3 weeks)" }
        - { id: p_pharyngitis, concept_id: cond:acute_pharyngitis, key_discriminators: ["acute tender jugulodigastric node with sore throat/tonsillitis"] }
        - { id: p_thyroid, concept_id: cond:hypothyroidism, key_discriminators: ["anterior midline/paramedian mass moving on swallowing (thyroid nodule/goitre)"] }
      serious_not_to_be_missed:
        - { id: s_npc, concept_id: cond:npc, key_discriminators: ["painless firm upper posterior cervical node +/- unilateral OME or blood-stained nasal discharge (high HK prevalence)"] }
        - { id: s_malignancy, concept_id: cond:malignancy_occult, key_discriminators: ["lymphoma (rubbery nodes + B-symptoms), H&N SCC (age >=40, smoker/alcohol, hoarseness/dysphagia), thyroid cancer, supraclavicular Virchow's node"] }
        - { id: s_tb_scrofula, concept_id: cond:pulmonary_tb, key_discriminators: ["subacute matted/fluctuant painless cervical node (TB lymphadenitis — common in HK/migrants)"] }
        - { id: s_deep_neck_sepsis, concept_id: cond:sepsis, key_discriminators: ["rapidly enlarging hot tender neck swelling + fever/trismus/stridor/drooling (deep neck abscess)"] }
      pitfalls_often_missed:
        - { id: o_hiv, concept_id: cond:hiv, key_discriminators: ["persistent generalised lymphadenopathy / HIV seroconversion"] }
        - { id: o_hyperthyroid, concept_id: cond:hyperthyroidism, key_discriminators: ["toxic thyroid nodule — check TSH before thyroid ultrasound/nuclear scan"] }
      masquerades:
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Any persistent painless firm/fixed cervical or supraclavicular lump >2-3w in an adult >=40y requires ENT nasoendoscopy + US/FNA." } }
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Check movement on swallowing/tongue protrusion and order TSH + neck ultrasound for anterior neck masses." } }
        - { id: mq_tb, tier: secondary, masquerade: baffling_bacterial, concept_id: cond:pulmonary_tb, clue_prompt: { en: "Consider tuberculous lymphadenitis (scrofula) in subacute matted cervical nodes; perform CXR + AFB/GeneXpert on FNA." } }
      patient_hidden_agenda_prompts:
        - { en: "Directly explore fear of cancer (especially NPC/lymphoma/thyroid cancer) and family history of NPC or thyroid disease." }
    positive_exclusions:
      - id: ex_stridor_airway
        finding_concept_id: rf:stridor_airway
        question: { en: "Do you have noisy breathing, shortness of breath, difficulty swallowing saliva, or a rapidly growing hot neck swelling?", zh_hk: "請問你有沒有呼吸喘鳴、氣促、難以吞嚥口水，或頸部腫脹迅速變大發熱？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_hard_neck_node
        finding_concept_id: rf:painless_hard_neck_node
        question: { en: "Has the neck lump been present for more than 2-3 weeks, or does it feel firm/hard, painless, or located just above your collarbone?", zh_hk: "請問頸部腫塊是否已持續超過2至3星期，或摸起來質地偏硬、無痛，或位於鎖骨上方？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_dysphagia
        finding_concept_id: rf:dysphagia_progressive
        question: { en: "Do you have persistent hoarseness (>3 weeks), trouble swallowing food, or blood-stained saliva/nasal discharge?", zh_hk: "請問你有沒有持續聲沙（超過3星期）、吞嚥困難，或口水／鼻涕帶血絲？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_b_symptoms
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you experienced unexplained weight loss, drenching night sweats, or persistent unexplained fevers?", zh_hk: "請問你有沒有無故體重下降、夜間嚴重盜汗或持續不明原因發燒？" }
        urgency_if_present: 3
        mandatory: true
    safety_netting:
      - id: sn_neck_lump_airway_emergency
        trigger_condition: { en: "Noisy breathing, shortness of breath, drooling/inability to swallow, or rapidly enlarging painful neck swelling", zh_hk: "呼吸喘鳴、氣促、流口水／無法吞嚥，或頸部腫脹迅速增大劇痛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Go to an emergency department immediately if a neck swelling causes noisy breathing, shortness of breath, trouble swallowing, or enlarges rapidly with fever. Arrange prompt doctor review if any lump lasts more than 2-3 weeks."
          zh_hk: "如頸部腫塊引致呼吸喘鳴、氣促、吞嚥困難或伴發燒迅速增大，請立即前往急症室。如任何頸部腫塊持續超過2至3星期未消退，請盡快求醫作詳細檢查。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: frame:neck_shoulder_pain
    rfe_concept_id: rfe:neck_shoulder_pain
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_rotator_cuff, concept_id: cond:rotator_cuff_tendinopathy, key_discriminators: ["painful arc 60-120 deg, pain lying on shoulder, preserved passive ROM"] }
        - { id: p_mechanical_neck, concept_id: cond:spinal_dysfunction, prevalence_note: "Mechanical cervical facet / postural myofascial strain" }
        - { id: p_frozen_shoulder, concept_id: cond:frozen_shoulder, key_discriminators: ["progressive global restriction of BOTH active AND passive external rotation (diabetes/thyroid association)"] }
        - { id: p_oa, concept_id: cond:osteoarthritis, key_discriminators: ["cervical spondylosis / glenohumeral or ACJ osteoarthritis"] }
      serious_not_to_be_missed:
        - { id: s_acs, concept_id: cond:acs, key_discriminators: ["exertional or sudden left shoulder/neck/jaw pain with sweating/dyspnoea — always exclude cardiac ischaemia"] }
        - { id: s_radic_myelopathy, concept_id: cond:cervical_radiculopathy, key_discriminators: ["progressive arm weakness, hand clumsiness, gait ataxia, Lhermitte/Babinski (cervical myelopathy)"] }
        - { id: s_pmr, concept_id: cond:polymyalgia_rheumatica, key_discriminators: ["age >=50, bilateral shoulder/hip girdle morning stiffness >45 min, elevated ESR/CRP — screen GCA!"] }
        - { id: s_septic_joint, concept_id: cond:septic_arthritis, key_discriminators: ["acute hot painful glenohumeral/SC joint with fever or marked loss of all ROM"] }
        - { id: s_malignancy, concept_id: cond:malignancy_occult, key_discriminators: ["Pancoast apical lung cancer (smoker, Horner's, C8-T1 pain) or bony metastasis (relentless night pain)"] }
      pitfalls_often_missed:
        - { id: o_gca, concept_id: cond:gca, key_discriminators: ["co-existing temporal headache, jaw claudication, or visual change in PMR"] }
        - { id: o_axspa, concept_id: cond:ankylosing_spondylitis, key_discriminators: ["inflammatory neck/back stiffness improving with exercise in adult <45y"] }
        - { id: o_zoster, concept_id: cond:herpes_zoster, key_discriminators: ["pre-eruptive burning dermatomal shoulder/arm pain before vesicles"] }
      masquerades:
        - { id: mq_spine, tier: primary, masquerade: spinal_dysfunction, concept_id: cond:spinal_dysfunction, clue_prompt: { en: "Differentiate intrinsic shoulder pathology (rotator cuff/frozen shoulder) from referred C5-C8 cervical radiculopathy." } }
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Consider Pancoast tumour or bony metastasis in smokers/prior cancer with progressive night pain or weight loss." } }
        - { id: mq_ctd, tier: secondary, masquerade: connective_tissue, concept_id: cond:connective_tissue_disease, clue_prompt: { en: "Screen bilateral shoulder/pelvic girdle morning stiffness (PMR) in adults >=50y and check CRP/ESR." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore occupational ergonomic strain, sleep disruption, fear of permanent nerve damage, and expectations for imaging vs physiotherapy." }
    positive_exclusions:
      - id: ex_cardiac_cp
        finding_concept_id: rf:chest_pain_cardiac
        question: { en: "Is the neck or shoulder pain associated with chest tightness, shortness of breath, sweating, nausea, or triggered by walking uphill?", zh_hk: "請問頸痛或肩膊痛有否伴隨胸悶、氣促、冒冷汗、噁心，或於步行／活動時加劇？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_focal_myelopathy
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Have you noticed new weakness in your arm or hand, clumsiness doing up buttons, unsteady walking, or loss of bladder/bowel control?", zh_hk: "請問你有否出現手臂或手掌無力、手指不靈活（如扣鈕困難）、行路不穩或大小便控制異常？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_gca_pmr
        finding_concept_id: rf:jaw_claudication_temporal_pain
        question: { en: "Do you have new temple headaches, jaw pain when chewing, scalp tenderness, or any blurred/double vision?", zh_hk: "請問你有否同時出現新發太陽穴頭痛、咀嚼時下顎痠痛、頭皮觸痛或視力模糊／重影？" }
        urgency_if_present: 3
        mandatory: true
        when: { fact: age_years, op: ge, value: 50 }
      - id: ex_hot_joint
        finding_concept_id: rf:hot_swollen_single_joint
        question: { en: "Is your shoulder joint hot, red, and severely painful to move at all, or accompanied by fever?", zh_hk: "請問肩關節有沒有明顯發熱紅腫、完全痛到無法活動，或伴隨發燒？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_neck_shoulder_emergency
        trigger_condition: { en: "Chest pain/tightness or shortness of breath, progressive arm/leg weakness, unsteady walking, fever with stiff neck, or new visual changes", zh_hk: "胸痛胸悶、氣促、手腳無力加劇、行路不穩、發燒頸梗或視力異常" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Seek immediate emergency medical care if neck or shoulder pain comes with chest tightness, shortness of breath, sweating, progressive arm/leg weakness, unsteady walking, high fever with neck stiffness, or vision changes."
          zh_hk: "如頸肩痛伴隨胸口壓迫、氣促、冒冷汗、手腳無力加劇、行路不穩、高燒頸梗或視力異常，請立即前往急症室。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: frame:skin_lesion_mole_change
    rfe_concept_id: rfe:skin_lesion_mole_change
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_seb_keratosis, concept_id: cond:seborrhoeic_keratosis, key_discriminators: ["well-demarcated stuck-on waxy plaque, milia-like cysts/comedo openings on dermoscopy"] }
        - { id: p_bcc, concept_id: cond:basal_cell_carcinoma, key_discriminators: ["pearly rolled edge, arborising telangiectasia, central ulceration on sun-exposed skin"] }
        - { id: p_tinea, concept_id: cond:tinea_fungal, key_discriminators: ["annular scaly active border with central clearing"] }
      serious_not_to_be_missed:
        - { id: s_melanoma, concept_id: cond:melanoma, key_discriminators: ["ABCDE changing pigmented lesion, ugly-duckling sign, firm growing nodule (EFG), or acral/subungual band (high East Asian proportion)"] }
        - { id: s_scc, concept_id: cond:squamous_cell_carcinoma, key_discriminators: ["rapidly enlarging tender hyperkeratotic/ulcerated nodule (high metastasis risk on ear/lip/immunosuppressed)"] }
        - { id: s_sjs_ten, concept_id: cond:sjs_ten_scar, key_discriminators: ["acute painful dusky blistering/peeling lesions with mucosal erosions after new medication"] }
      pitfalls_often_missed:
        - { id: o_psoriasis_bowen, concept_id: cond:psoriasis, key_discriminators: ["solitary persistent scaly plaque failing topical steroid -> exclude Bowen's disease (SCC in situ) or superficial BCC"] }
        - { id: o_impetigo, concept_id: cond:impetigo, key_discriminators: ["crusted non-healing 'sore' mistaken for impetigo/eczema -> exclude ulcerated SCC/BCC"] }
      masquerades:
        - { id: mq_malignancy, tier: secondary, masquerade: malignancy, concept_id: cond:malignancy_occult, clue_prompt: { en: "Examine palms, soles, nail units (acral lentiginous melanoma in HK/Asian patients), and sun-exposed head/neck/trunk (high UV AU) with dermoscopy." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review immunosuppressive therapy (elevated SCC risk), photosensitising drugs, and new medications within 8 weeks if blistering." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of skin cancer, sun exposure/occupational history, family melanoma history, and cosmetic expectations prior to excision." }
    positive_exclusions:
      - id: ex_abcde_lesion
        finding_concept_id: rf:abcde_changing_pigmented_lesion
        question: { en: "Has a mole, dark spot, palm/sole mark, or nail streak changed in size, shape, or colour, or started bleeding, crusting, or itching?", zh_hk: "請問黑痣、皮膚斑點、手掌腳底黑斑或指甲黑線有沒有變大、形狀不規則、變色，或出現流血、結痂或痕癢？" }
        urgency_if_present: 3
        mandatory: true
      - id: ex_sjs_mucosal
        finding_concept_id: rf:sjs_ten_mucosal_blistering
        question: { en: "Do you have painful skin blisters or peeling along with fever or sores in your mouth, eyes, or genital area after starting a medicine?", zh_hk: "請問你服藥後有沒有出現疼痛的皮膚水泡、脫皮，並伴隨發燒或口腔、眼睛、生殖器潰爛？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_systemic_weight_loss
        finding_concept_id: rf:unintentional_weight_loss
        question: { en: "Have you noticed any new firm lumps in your armpits, groin, or neck, or unexplained weight loss?", zh_hk: "請問你有沒有察覺腋下、腹股溝或頸部出現硬塊，或無故體重下降？" }
        urgency_if_present: 3
        mandatory: false
    safety_netting:
      - id: sn_skin_lesion_scar_emergency
        trigger_condition: { en: "Rapidly spreading painful blistering/peeling skin or mouth/eye sores with fever", zh_hk: "迅速蔓延之痛性水泡／脫皮，或伴發燒及口腔／眼部潰爛" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Go to an emergency department immediately if a skin lesion progresses to painful blistering, peeling, or mouth/eye sores with fever. For any changing, growing, or non-healing spot or mole (>4 weeks), arrange a prompt in-person skin check."
          zh_hk: "如皮膚病變迅速演變為痛性水泡、脫皮或伴隨發燒及口腔／眼部潰爛，請立即前往急症室。任何持續變化、增大或超過4星期未癒合的斑點或黑痣，請盡快安排面診皮膚檢查。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: frame:numbness_tingling_weakness
    rfe_concept_id: rfe:numbness_tingling_weakness
    murtagh_prompt:
      probability_diagnoses:
        - { id: p_cts, concept_id: cond:carpal_tunnel_syndrome, key_discriminators: ["nocturnal palmar thumb-index-middle finger paraesthesiae relieved by shaking hand"] }
        - { id: p_peripheral_neuropathy, concept_id: cond:peripheral_neuropathy, key_discriminators: ["chronic length-dependent distal symmetric stocking-glove numbness/burning (diabetes/B12/alcohol)"] }
        - { id: p_cerv_radic, concept_id: cond:cervical_radiculopathy, key_discriminators: ["unilateral dermatomal neck-to-arm shooting pain/paraesthesiae"] }
      serious_not_to_be_missed:
        - { id: s_stroke, concept_id: cond:stroke_tia, key_discriminators: ["acute onset unilateral limb weakness/numbness, facial droop, dysarthria, visual field loss (FAST)"] }
        - { id: s_gbs, concept_id: cond:guillain_barre_syndrome, key_discriminators: ["rapidly progressive ascending symmetrical limb weakness + areflexia +/- bulbar/respiratory involvement"] }
        - { id: s_cauda_equina, concept_id: cond:cauda_equina, key_discriminators: ["saddle anaesthesia, urinary retention/incontinence, faecal incontinence, bilateral leg weakness"] }
        - { id: s_cord_compression, concept_id: cond:malignancy_occult, key_discriminators: ["sensory level, hyperreflexia/upgoing plantars, gait spasticity, cancer history (acute spinal cord compression)"] }
      pitfalls_often_missed:
        - { id: o_b12_deficiency, concept_id: cond:b12_deficiency, key_discriminators: ["subacute combined degeneration — dorsal column vibration/proprioception loss (check B12 in metformin/PPI/vegan patients)"] }
        - { id: o_diabetes, concept_id: cond:t2dm, key_discriminators: ["undiagnosed T2DM presenting with painful feet neuropathy — check HbA1c"] }
        - { id: o_hypothyroid, concept_id: cond:hypothyroidism, key_discriminators: ["hypothyroidism causing bilateral carpal tunnel syndrome"] }
        - { id: o_trigeminal, concept_id: cond:trigeminal_neuralgia, key_discriminators: ["brief electric-shock unilateral facial pain triggered by chewing/light touch"] }
      masquerades:
        - { id: mq_diabetes, tier: primary, masquerade: diabetes, concept_id: cond:t2dm, clue_prompt: { en: "Order HbA1c/fasting glucose, Vitamin B12, TSH, FBC, eGFR, and serum protein electrophoresis in symmetric polyneuropathy." } }
        - { id: mq_thyroid, tier: primary, masquerade: thyroid_disease, concept_id: cond:hypothyroidism, clue_prompt: { en: "Screen TSH in bilateral carpal tunnel syndrome or proximal myopathy." } }
        - { id: mq_drugs, tier: primary, masquerade: drugs, concept_id: cond:drug_adverse_effect, clue_prompt: { en: "Review neurotoxic/B12-depleting agents: metformin, metronidazole, nitrofurantoin, isoniazid, amiodarone, chemotherapy, excess alcohol/B6." } }
        - { id: mq_neuro, tier: secondary, masquerade: neurological_dilemma, concept_id: cond:neurological_dilemma, clue_prompt: { en: "Distinguish UMN (stroke/cord/MS) vs LMN/peripheral vs neuromuscular junction (myasthenia) by reflex, tone, and distribution exam." } }
      patient_hidden_agenda_prompts:
        - { en: "Explore fear of stroke, multiple sclerosis, or paralysis, falls risk at home, and impact on work/driving." }
    positive_exclusions:
      - id: ex_focal_stroke
        finding_concept_id: rf:focal_neuro_deficit_fast
        question: { en: "Did the weakness or numbness start suddenly on one side, or come with facial drooping, slurred speech, or vision loss?", zh_hk: "請問無力或麻痺是否突然單側發作，或伴隨面部歪斜、口齒不清或視力喪失？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_ascending_gbs
        finding_concept_id: rf:ascending_weakness_gbs
        question: { en: "Is weakness rapidly worsening and spreading up both legs or arms, or are you having any trouble breathing or swallowing?", zh_hk: "請問無力是否從雙腳迅速向上蔓延至雙手，或出現任何呼吸／吞嚥困難？" }
        urgency_if_present: 4
        mandatory: true
      - id: ex_cauda_equina
        finding_concept_id: rf:cauda_equina_signs
        question: { en: "Do you have numbness around your groin/buttocks, difficulty passing urine, or loss of bladder or bowel control?", zh_hk: "請問你有否感到會陰或臀部麻痺、排尿困難或大小便失禁？" }
        urgency_if_present: 4
        mandatory: true
    safety_netting:
      - id: sn_neuro_weakness_emergency
        trigger_condition: { en: "Sudden one-sided weakness/facial droop/slurred speech, rapidly spreading leg/arm weakness, breathing/swallowing difficulty, or groin numbness/bladder-bowel loss", zh_hk: "突發單側無力／面歪／口齒不清、雙腳雙手無力迅速蔓延、呼吸吞嚥困難，或會陰麻痺／大小便失禁" }
        escalation_channel: emergency_services
        patient_instruction:
          en: "Call emergency services or go to an emergency department immediately if weakness or numbness starts suddenly on one side, spreads rapidly up your legs or arms, affects breathing or swallowing, or causes groin numbness or loss of bladder/bowel control."
          zh_hk: "如麻痺或無力突然單側出現、迅速向上蔓延、影響呼吸或吞嚥，或出現會陰麻痺／大小便失禁，請立即致電緊急救援服務或前往急症室。"
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

# ===========================================================================
# OBSERVATION RULES (5) — 3 New Autoimmune/Endocrine + 2 Existing Core Obs Rules
# ===========================================================================
observation_rules:
  - id: obs_rule:rheumatoid_factor
    observation_concept_id: obs:rheumatoid_factor
    canonical_ucum: "U/mL"
    display_ucum: "U/mL"
    reference_intervals:
      - { id: ri_adult_default, low: null, high: 14.0, priority: 0, source_note: "Assay-dependent ULN (~14-20 U/mL or IU/mL); >3x ULN (>45 U/mL) carries higher RA specificity" }
    severity_bands:
      significant: { ge: 14.0 }
      urgent: { ge: 45.0 }
    direction_templates:
      H:
        working_problem: { en: "positive rheumatoid factor (RF)", zh_hk: "類風濕因子 (RF) 呈陽性" }
        plan_template:
          en: "Correlate strictly with clinical inflammatory synovitis (small joint swelling, morning stiffness >60 min). Order anti-CCP, CRP, ESR, CBC, LFT, RFT; note false positives in chronic HCV/HBV, Sjogren's, SLE, and 5-10% of healthy older adults; arrange early rheumatology referral if inflammatory arthritis present."
          zh_hk: "須結合臨床關節滑膜炎徵象（小關節腫痛、晨僵 >60分鐘）判讀；建議加驗 Anti-CCP、CRP、ESR、全血計數及肝腎功能；留意慢性丙肝／乙肝、乾燥症及部分健康長者可呈假陽性，確診發炎性關節炎宜盡早轉介風濕病科。"
        relevant_med_class_ids: ["drug_class:dmard", "drug_class:nsaid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: obs_rule:ana_screen
    observation_concept_id: obs:ana_screen
    canonical_ucum: "{Ordinal}"
    display_ucum: "{Ordinal}"
    reference_intervals: []
    severity_bands:
      significant: { ge: 1.0 }
    direction_templates:
      positive:
        working_problem: { en: "positive antinuclear antibody (ANA) screen", zh_hk: "抗核抗體 (ANA) 篩查呈陽性" }
        plan_template:
          en: "Interpret strictly by titre (>=1:160 more clinically significant), staining pattern, and connective tissue features (photosensitive/malar rash, oral ulcers, synovitis, serositis, cytopenias, proteinuria/haematuria). Low-titre ANA occurs in 10-15% of healthy individuals — order ENA panel, anti-dsDNA, C3/C4, CBC, RFT, and urine ACR/microscopy ONLY when clinical CTD suspicion exists."
          zh_hk: "須按滴度（>=1:160 臨床意義較高）、螢光形態及臨床結締組織病徵象（蝴蝶斑、口腔潰瘍、關節炎、血細胞減少、蛋白尿）判讀；約10至15%健康人士可呈低滴度假陽性，僅於臨床懷疑時加驗 ENA、anti-dsDNA、補體 C3/C4、腎功能及尿蛋白。"
        relevant_med_class_ids: ["drug_class:dmard"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: obs_rule:tpo_antibody
    observation_concept_id: obs:tpo_antibody
    canonical_ucum: "U/mL"
    display_ucum: "U/mL"
    reference_intervals:
      - { id: ri_adult_default, low: null, high: 34.0, priority: 0, source_note: "Assay-dependent ULN (~34-35 U/mL or IU/mL)" }
    severity_bands:
      significant: { ge: 35.0 }
      urgent: { ge: 100.0 }
    direction_templates:
      H:
        working_problem: { en: "positive anti-TPO antibody (autoimmune thyroiditis)", zh_hk: "抗甲狀腺過氧化物酶抗體陽性（自身免疫性甲狀腺炎）" }
        plan_template:
          en: "Indicates autoimmune thyroiditis (Hashimoto's predisposition; ~4%/yr progression from subclinical to overt hypothyroidism and elevated postpartum thyroiditis risk). Pair with TSH and Free T4 (lower levothyroxine initiation threshold in pregnancy/pre-conception); do NOT repeat anti-TPO serially once positive."
          zh_hk: "提示自身免疫性甲狀腺炎（橋本氏病傾向，亞臨床甲減演變為明顯甲減及產後甲狀腺炎風險較高）；須結合 TSH 及游離 T4 評估（懷孕或備孕期治療門檻較低），陽性確診後毋須重複覆檢抗體。"
        relevant_med_class_ids: ["drug_class:thyroid_hormone", "drug_class:antithyroid"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: obs_rule:hba2_hplc
    observation_concept_id: obs:hba2_hplc
    canonical_ucum: "%"
    display_ucum: "%"
    reference_intervals:
      - { id: ri_adult_default, low: 2.0, high: 3.3, priority: 0, source_note: "Adult reference ~2.0-3.3%; beta-thalassaemia trait typically >=3.5%" }
    severity_bands:
      significant: { lt: 1.8, ge: 3.5 }
      urgent: { gt: 4.0 }
    direction_templates:
      H:
        working_problem: { en: "elevated HbA2 (suspected beta-thalassaemia trait)", zh_hk: "HbA2 偏高（懷疑乙型地中海貧血基因攜帶者）" }
        plan_template:
          en: "HbA2 >=3.5% with microcytosis strongly indicates beta-thalassaemia trait. Verify ferritin/CRP (avoid unnecessary empiric oral iron when iron-replete), record carrier status permanently in problem list, and offer partner MCV/Hb pattern screening plus pre-conception/antenatal genetic counselling."
          zh_hk: "HbA2 >=3.5% 伴小紅細胞症高度提示乙型地中海貧血基因攜帶者；核對鐵蛋白（非缺鐵者切忌胡亂補鐵），永久記錄基因攜帶狀態，並為伴侶安排 MCV／血紅素電泳篩查及產前遺傳輔導。"
        relevant_med_class_ids: ["drug_class:haematinic"]
      L:
        working_problem: { en: "reduced HbA2 (concomitant iron deficiency / alpha-thalassaemia / delta variant)", zh_hk: "HbA2 偏低（須排查缺鐵掩蓋、甲型地貧或 delta 鏈變異）" }
        plan_template:
          en: "Severe iron deficiency can falsely lower HbA2 and mask co-existing beta-thalassaemia trait — check ferritin/CRP, replete iron if deficient, and repeat Hb pattern/HPLC once ferritin normalises. If iron-replete with persistent microcytosis and normal/low HbA2, consider alpha-thalassaemia DNA genotyping (especially prior to pregnancy)."
          zh_hk: "嚴重缺鐵可令 HbA2 假性偏低而掩蓋同時存在的乙型地貧基因，宜先檢視鐵蛋白並於補鐵糾正後覆檢血紅素電泳；如鐵蛋白正常但持續 MCV 偏低，應考慮甲型地中海貧血 DNA 基因檢測（尤其於備孕／懷孕前）。"
        relevant_med_class_ids: ["drug_class:haematinic"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

  - id: obs_rule:anti_ttg_iga
    observation_concept_id: obs:anti_ttg_iga
    canonical_ucum: "U/mL"
    display_ucum: "U/mL"
    reference_intervals:
      - { id: ri_adult_default, low: null, high: 10.0, priority: 0, source_note: "Assay-dependent ULN (~7-10 U/mL); interpret with total serum IgA and adequate gluten intake (>=6 weeks)" }
    severity_bands:
      significant: { ge: 10.0 }
      urgent: { ge: 100.0 }
    direction_templates:
      H:
        working_problem: { en: "positive anti-tTG IgA (suspected coeliac disease)", zh_hk: "抗組織轉穀氨酰胺酶 IgA 抗體陽性（懷疑乳糜瀉）" }
        plan_template:
          en: "Advise patient to CONTINUE a normal gluten-containing diet until gastroenterology referral and upper GI endoscopy with duodenal biopsies confirm coeliac disease (stopping gluten prematurely causes false-negative histology). Check total IgA, CBC, ferritin, B12, folate, Vitamin D, calcium, LFT, TSH, and bone health."
          zh_hk: "指示病人於完成胃腸科胃鏡十二指腸活檢確診前必須繼續正常含麩質飲食（過早戒麩質會導致病理假陰性）；同步評估全血計數、鐵蛋白、維他命B12、葉酸、維他命D、血鈣、肝功能及甲狀腺功能。"
        relevant_med_class_ids: ["drug_class:haematinic"]
    epidemiology_pearls: []
    provenance: { author: "ontology_pod_w2_2", review_status: "draft" }

