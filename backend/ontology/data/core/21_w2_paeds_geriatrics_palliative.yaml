      renal_note: "Reduce to 25 mg daily if eGFR 15-29 mL/min; avoid if eGFR <15 mL/min."
      dosing_pearl:
        en: "Non-anticholinergic option for urge incontinence/OAB in older adults (avoids delirium risk). Contraindicated in severe uncontrolled hypertension (>=180/110 mmHg); monitor BP periodically."
        zh_hk: "長者急迫性尿失禁／膀胱過動症之非抗膽鹼選擇（減低譫妄風險）；嚴重未受控高血壓（>=180/110 mmHg）禁用，服藥期間須定期覆查血壓。"
    provenance: { author: "ontology_pod_w2_1", review_status: "draft" }

