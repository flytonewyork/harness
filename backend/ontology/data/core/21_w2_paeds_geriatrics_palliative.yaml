      max_daily_mg: 10
      dosing_pearl:
        en: "Start 5 mg daily (morning if vivid dreams/insomnia), titrate to 10 mg after >=4-6 weeks if tolerated. Check baseline pulse/ECG (vagotonic bradycardia/AV block risk, especially with beta-blockers) and avoid co-prescribing anticholinergics."
        zh_hk: "起始每日5毫克（若引起多夢失眠可改早上服），耐受後4至6週可增至10毫克；用藥前應查脈搏及心電圖，留意與β受體阻滯劑合用引致心搏過緩及暈厥，並避免同服抗膽鹼藥。"
