  - id: rf:kawasaki_5d_fever_mucositis
    kind: red_flag
    wave: W2
    cluster: C12_paediatrics
    display:
      en: "Persistent paediatric fever >=5 days with mucocutaneous signs (strawberry tongue, cracked lips, bilateral conjunctival injection, rash, swollen hands/feet, or cervical lymphadenopathy)"
      zh_hk: "兒童持續發燒5天或以上，伴隨士多啤梨舌、嘴唇乾裂紅腫、雙眼結膜充血、皮疹、手腳紅腫或頸部淋巴結腫大（疑似川崎病）"
    aliases:
      en: ["fever 5 days child", "strawberry tongue", "red cracked lips fever child", "swollen hands feet fever", "Kawasaki warning signs"]
      zh_hk: ["發燒五日唔退", "士多啤梨舌", "嘴唇爆裂紅腫", "紅眼冇眼屎", "手腳腫紅", "川崎病警號"]
    provenance: { author: "ontology_pod_w2_1", review_status: "draft" }

  - id: rf:intussusception_currant_jelly_bilious
    kind: red_flag
    wave: W2
    cluster: C12_paediatrics
    display:
      en: "Episodic inconsolable screaming/drawing knees to chest, bilious (green) vomiting, or redcurrant jelly bloody stools in an infant/young child"
      zh_hk: "嬰幼兒間歇性劇烈哭鬧並屈膝縮腹、吐綠色膽汁或排出紅果醬樣血便（疑似腸套疊／腸梗阻）"
    aliases:
      en: ["redcurrant jelly stool", "bilious green vomiting child", "drawing legs up screaming", "sausage shaped mass abdomen", "intussusception signs"]
      zh_hk: ["果醬樣大便", "吐綠水", "嘔膽汁", "一陣陣劇痛喊到縮埋", "腸套疊警號"]
    provenance: { author: "ontology_pod_w2_1", review_status: "draft" }

  - id: rf:severe_paed_dehydration_sunken
    kind: red_flag
    wave: W2
    cluster: C12_paediatrics
    display:
      en: "Severe paediatric dehydration: sunken eyes/fontanelle, dry mucous membranes, absent tears, prolonged capillary refill (>2-3s), mottled cool peripheries, lethargy, or no wet nappies >6-8h"
      zh_hk: "兒童嚴重脫水徵象：眼窩／囟門凹陷、口舌極乾、哭時無淚、微血管充盈延遲、四肢冰冷起花紋、嗜睡或超過6至8小時無濕尿片"
    aliases:
      en: ["sunken eyes baby", "sunken fontanelle", "no wet nappies", "crying without tears", "severe dehydration child", "lethargic dehydrated baby"]
      zh_hk: ["眼窩凹陷", "囟門凹陷", "喊到冇眼淚", "唔屙尿", "好耐冇濕片", "嚴重脫水"]
    provenance: { author: "ontology_pod_w2_1", review_status: "draft" }

  - id: rf:neonatal_jaundice_first_24h
    kind: red_flag
    wave: W2
    cluster: C12_paediatrics
    display:
      en: "Neonatal jaundice appearing within the first 24 hours of life, rapidly deepening yellowing, pale/chalky stools, dark urine, or poor feeding/lethargy in a jaundiced newborn"
      zh_hk: "初生嬰兒出生24小時內出現黃疸、黃疸迅速加深、大便呈灰白色、小便深茶色，或黃疸伴拒奶嗜睡（病理性新生兒黃疸警號）"
    aliases:
