  - id: drug:morphine
    kind: drug
    wave: W2
    cluster: C15_palliative
    parent_ids: ["drug_class:strong_opioid"]
    bindings:
      inn: "morphine"
      rxnorm: { code: "7052", display: "morphine" }
      atc: { code: "N02AA01", system: "http://www.whocc.no/atc" }
    display: { en: "Morphine (IR / MR oral or parenteral)", zh_hk: "嗎啡（速效／緩釋口服或注射劑）" }
    aliases:
      en: ["morphine", "Ordine", "MS Contin", "Kapanol", "MST Continus", "Sevredol", "morphine sulfate"]
      zh_hk: ["嗎啡", "硫酸嗎啡", "嗎啡水", "緩釋嗎啡"]
    drug_facet:
      high_risk: true
      telehealth_blocked: true
      pregnancy_caution: "caution"
      renal_note: "Avoid or switch agent when eGFR <30 mL/min: active M3G/M6G metabolites accumulate causing neurotoxicity, myoclonus, delirium, and respiratory depression."
      dosing_pearl:
        en: "Always co-prescribe a regular stimulant/osmotic laxative (e.g. senna +/- macrogol); prescribe breakthrough IR dose (~1/6th of total 24h morphine dose) and check eGFR before initiation."
        zh_hk: "處方嗎啡時必須常規合併通便藥（如番瀉葉配聚乙二醇），並處方突破性速效劑量（約每日總量六分之一）；用藥前必須核查腎功能 eGFR。"
    provenance: { author: "ontology_pod_w2_1", review_status: "draft" }

