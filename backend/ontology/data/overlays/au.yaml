  drug:fluconazole:
    drug_facet:
      schedule: "AU_SUSMP_S3"
      dosing_pearl:
        en: "AU SUSMP S3 (Pharmacist Only OTC for 150 mg single-dose VVC); multi-dose/systemic regimens are S4 Prescription Only."
  drug:fluoxetine:
    drug_facet: { schedule: "AU_SUSMP_S4" }
  drug:folic_acid:
    drug_facet: { schedule: "AU_UNSCHEDULED" }
  drug:gabapentin:
    drug_facet:
      schedule: "AU_SUSMP_S4"
      dosing_pearl:
        en: "AU SUSMP S4 / PBS Authority Required (Streamlined) for refractory neuropathic pain; adjust strictly for eGFR and avoid opioid co-prescribing."
  drug:gliclazide:
    drug_facet: { schedule: "AU_SUSMP_S4" }
  drug:hydrochlorothiazide:
