    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
  drug:bisoprolol:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
  drug:carbimazole:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
  drug:celecoxib:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
  drug:cetirizine:
