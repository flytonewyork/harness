# Hong Kong SAR Jurisdiction Overlay (Minimal Toggle Diff over Shared Universal Core)
# Authorities: HKCFP / HKFM, HK PHCC Reference Frameworks, CHP IMPACT 6th Ed (2025),
# Pharmacy & Poisons Ordinance (Cap. 138), Antibiotics Ordinance (Cap. 137), Dangerous Drugs (Cap. 134).

overlay_id: "jurisdiction:hk"
layer: "jurisdiction"
extends: "core"
jurisdiction: "HK"

defaults:
  emergency_number: "999"
  emergency_dept_label:
    en: "Hospital Authority A&E (999)"
    zh_hk: "急症室 (999)"
  crisis_hotlines:
    samaritans_hk_24h: "2389 2222"
    suicide_prevention_services: "2382 0000"
    mental_health_support_gov: "18111"
  poisons_hotline: "2635 1111 (HKPIC clinician) / 2772 2211"
  default_locale: "zh-HK"
  required_locales: ["en", "zh-HK"]
  banned_claims:
    - "nothing to worry"
    - "don't worry"
    - "all clear"
    - "looks normal"
    - "no need to see"
    - "sick leave has been issued"
    - "prescription has been issued"
    - "我係醫生"
    - "唔使擔心"
    - "冇事"
    - "已發出病假"
    - "已處方"
  unit_system_overrides:
    obs:haemoglobin: "g/dL"

concept_patches:
  # --- Wave 0 Core Schedules & HK Pearls ---
  drug:allopurinol:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
    aliases:
      zh_hk: { $add: ["別嘌醇", "降尿酸丸"] }

  drug:codeine:
    drug_facet:
      schedule: "HK_CAP134_DANGEROUS_DRUG"
      telehealth_blocked: true
      dosing_pearl:
        en: "HK Cap. 138A (26 Jan 2024): <0.2% cough syrup requires ASP Poisons Book + HKID; >=0.2%/tablets are Cap. 134 Dangerous Drugs (hard-blocked in teleconsult)."
        zh_hk: "香港法例第134/138章：含可待因藥物屬嚴格受管制藥物／危險藥物，遙距診症禁止處方。"

  drug:amoxicillin_clavulanate:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): First-line outpatient CAP agent (with macrolide/doxycycline if atypical suspected) due to local H. influenzae beta-lactamase & macrolide-resistant S. pneumoniae."

  drug:oseltamivir:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }

  drug:ibuprofen:
    drug_facet: { schedule: "HK_CAP138_PART_I_POISON" }

  drug:salbutamol:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }

  drug:warfarin:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
    aliases:
      zh_hk: { $add: ["華法林", "薄血丸"] }

  # --- Wave 1 Pod A: Cardiometabolic & Renal HK Deltas ---
  drug:clopidogrel:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
      dosing_pearl:
        en: "HK East Asian CYP2C19 loss-of-function prevalence (~50-60%): avoid omeprazole/esomeprazole co-use (prefer pantoprazole); verify HA cardiology DAPT duration."
        zh_hk: "香港華人 CYP2C19 弱代謝基因常見，避免同服奧美拉唑／埃索美拉唑，宜選泮托拉唑並核實雙抗血小板療程。"

  drug:semaglutide:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
      dosing_pearl:
        en: "HK Cap. 138 Part I Sch 3 Rx only: verify registered supply and Asian BMI >=27.5 with comorbidity threshold."

  drug:nitrofurantoin:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): First-line empiric female cystitis (100 mg MR BD x5d) PROVIDED eGFR >=45 and G6PD deficiency excluded (~4.5% HK males)."
        zh_hk: "香港衞生防護中心 IMPACT 2025 指引：單純女性膀胱炎一線口服藥，處方前必須確認 eGFR >=45 及排除蠶豆症 (G6PD)。"

  drug:trimethoprim:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): High local community E. coli resistance (~30%+) — NOT recommended as empiric first-line UTI therapy in HK unless MSU-guided."

  drug:aspirin:
    drug_facet: { schedule: "HK_CAP138_PART_I_POISON" }

  # --- Wave 1 Pod B: Resp, ENT & GI HK Deltas ---
  drug:amoxicillin:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): Verify penicillin allergy; note local H. influenzae beta-lactamase rates for outpatient CAP."

  drug:doxycycline:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): Preferred oral atypical/CAP adjunct in HK adults due to high local Mycoplasma macrolide resistance; CI in pregnancy & age <8y."

  drug:azithromycin:
    drug_facet:
      schedule: "HK_CAP137_ANTIBIOTIC"
      dosing_pearl:
        en: "HK CHP IMPACT 6th Ed (2025): High local macrolide resistance in S. pneumoniae and Mycoplasma — avoid empiric CAP monotherapy."

  drug:budesonide_formoterol:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
      dosing_pearl:
        en: "HK HA / GINA Track 1: Low-dose ICS-formoterol MART preferred for adolescent/adult asthma."

  # --- Wave 1 Pod C: Neuro, Psych & Controlled Drugs HK Deltas ---
  drug:carbamazepine:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
      dosing_pearl:
        en: "HK HA/HKCFP mandatory PGx: Screen HLA-B*15:02 prior to initiating carbamazepine in HK patients (high Han Chinese SJS/TEN risk)."

  drug:lorazepam:
    drug_facet: { schedule: "HK_CAP134_DANGEROUS_DRUG", telehealth_blocked: true }
  drug:diazepam:
    drug_facet: { schedule: "HK_CAP134_DANGEROUS_DRUG", telehealth_blocked: true }
  drug:zolpidem:
    drug_facet: { schedule: "HK_CAP134_DANGEROUS_DRUG", telehealth_blocked: true }
  drug:zopiclone:
    drug_facet: { schedule: "HK_CAP134_DANGEROUS_DRUG", telehealth_blocked: true }
  drug:tramadol:
    drug_facet: { schedule: "HK_CAP134_DANGEROUS_DRUG", telehealth_blocked: true }

  # --- Wave 1 Pod D: Women's, Vaccines & Screening HK Deltas ---
  drug:levonorgestrel_ec:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }

  vaccine:influenza_qiv:
    display:
      en_hk: "Seasonal Influenza Vaccine (HK VSS subsidised >=50y, pregnant, 6m-<18y, high-risk)"

  vaccine:pcv15:
    display:
      en_hk: "15-valent Pneumococcal Conjugate Vaccine (HK GVP/VSS >=65y high-risk -> 23vPPV 1y later)"

  vaccine:shingrix_rzv:
    display:
      en_hk: "Recombinant Zoster Vaccine Shingrix (HK: self-financed >=50y)"

  screen:crc_fit:
    display:
      en_hk: "HK DH Colorectal Cancer Screening Programme (subsidised biennial FIT ages 50-75)"

  screen:cervical_hpv:
    display:
      en_hk: "HK Cervical Screening Programme (25-29y cytology q3y; 30-64y primary HPV q5y)"

  screen:breast_mammogram:
    display:
      en_hk: "HK Personalised Risk-Based Breast Cancer Screening (44-69y via HK Gov bctool)"

  screen:hbv_adult:
    display:
      en_hk: "HK CDCC Hepatitis B Screening (residents born <=1988)"

  # --- Wave 1 Complete HK Statutory Drug Schedules (zero UNSPECIFIED) ---
  drug:adrenaline_autoinjector:
    drug_facet:
      schedule: "HK_CAP138_PART_I_SCH3_RX"
      dosing_pearl:
        en: "HK Cap. 138 Part I Sch 3 Rx (doctor prescription required in HK, unlike AU S3 OTC): prescribe 2 twin autoinjectors, verify expiry, and train patient/school carer."
        zh_hk: "香港附表3處方藥（與澳洲藥劑師非處方不同，須醫生處方）：建議常備兩支腎上腺素自動注射筆並核對有效日期。"
  drug:alendronate:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
  drug:amiodarone:
    drug_facet: { schedule: "HK_CAP138_PART_I_SCH3_RX" }
